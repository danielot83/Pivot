<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Play design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b70; --line: #e5e5e5; --paper: #fafafa; --card: #ffffff;
    --accent: #d21414; --accent-deep: #a10f0f; --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
  h1, h2, h3, .logotype { font-family: "Space Grotesk", "Inter", sans-serif; }
  a { color: inherit; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); }
  .nav-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .nav-btn:hover { border-color: var(--accent); }
  .back-link { display: inline-block; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; max-width: 1100px; margin: 0 auto; padding: 24px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  h1 { font-size: 22px; margin: 8px 0 4px; display:flex; align-items:center; justify-content:space-between; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }

  .msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }
  .help-box { display: none; background: var(--accent-tint); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--ink); margin-bottom: 12px; }

  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .side-card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px; }
  .tree-season { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .tree-season:first-child { margin-top: 0; }
  .play-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 8px; margin-left: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .play-item:hover { background: var(--paper); }
  .play-item.active { background: var(--accent-tint); color: var(--accent-deep); font-weight: 600; }
  .play-item button { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--muted); }
  .play-item button:hover { color: var(--accent); }
  .new-play-btn { font-size: 12.5px; color: var(--accent-deep); background: none; border: none; cursor: pointer; padding: 6px 8px; text-align: left; width: 100%; font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--accent); }
  .spacer { flex: 1; }
  .tool-group { display: flex; flex-wrap: wrap; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; margin-bottom: 6px; }
  .tool-btn { padding: 5px 9px; border: none; background: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .tool-btn:hover { background: var(--paper); }
  .tool-btn.active { background: var(--accent); color: #fff; }

  .field-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }

  .step-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; align-items: center; }
  .step-tab { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 12px; cursor: pointer; }
  .step-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .step-tab .del-step { font-size: 10px; opacity: 0.7; }
  .step-tab .del-step:hover { opacity: 1; }
  .add-step-btn { padding: 6px 10px; border: 1px dashed var(--line); background: none; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--accent-deep); font-weight: 600; }
  .add-step-btn:hover { border-color: var(--accent); }

  .court-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  #court-canvas { display: block; margin: 0 auto; cursor: crosshair; touch-action: none; }
  .hint-text { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>

<nav>
  <div class="logotype">Pi<span class="v-red">v</span>ot<span class="dot">.</span></div>
  <div class="nav-right">
    <img id="org-logo" style="height:28px; width:28px; border-radius:6px; object-fit:cover; display:none;" />
    <span id="org-name"></span>
    <select id="nav-menu" class="nav-btn" style="cursor:pointer;">
      <option value="">Go to…</option>
      <option value="dashboard.html">Dashboard</option>
      <option value="roster.html">Roster</option>
      <option value="assessment.html">Player assessment</option>
      <option value="play_design.html" selected>Play design</option>
      <option value="compare.html">Compare players</option>
      <option value="match.html">Match day</option>
      <option value="exercises.html">Exercise creator</option>
      <option value="library.html">Library</option>
      <option value="training.html">Training builder</option>
      <option value="settings.html">Settings</option>
    </select>
    <button class="nav-btn" id="logout-btn">Log out</button>

</nav>

<div class="layout">
  <div>
    <div class="side-card">
      <h2>Your playbook</h2>
      <button class="new-play-btn" id="new-play-btn">+ New play</button>
      <div id="plays-tree"></div>
    </div>
  </div>

  <div>
    <a class="back-link" href="./dashboard.html">&larr; Back to dashboard</a>
    <h1>
      Play design
      <button id="help-btn" title="How does this work?" style="width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; line-height:1;">?</button>
    </h1>
    <p class="sub">Draw sets, cuts, screens, and passes — as many steps as the play needs — then animate the whole sequence or export it.</p>
    <div class="help-box" id="help-box"></div>
    <div class="msg" id="msg"></div>

    <div class="field-row">
      <div class="field" style="flex:2;"><label for="play-name">Play name</label><input id="play-name" type="text" placeholder="e.g. Horns flare" /></div>
      <div class="field"><label for="play-season">Season</label><select id="play-season"><option value="">Optional</option></select></div>
      <div class="field"><label for="play-team">Team</label><select id="play-team"><option value="">Optional</option></select></div>
      <div class="field"><label for="play-category">Category</label><input id="play-category" type="text" placeholder="e.g. Half-court offense" /></div>
    </div>

    <div class="step-tabs" id="step-tabs"></div>
    <div class="toolbar">
      <div class="field" style="flex-direction:row; align-items:center; gap:6px;">
        <label for="step-court-type" style="margin:0;">This step's court</label>
        <select id="step-court-type" style="width:110px;"><option value="half">Half court</option><option value="full">Full court</option></select>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-secondary" id="animate-btn">▶ Animate whole sequence</button>
    </div>

    <div class="tool-group" id="tools-row1"></div>
    <div class="tool-group" id="tools-row2"></div>
    <div class="tool-group" id="tools-row3"></div>
    <div class="toolbar">
      <div class="field" style="flex-direction:row; align-items:center; gap:6px;">
        <label for="color-select" style="margin:0;">Color</label>
        <select id="color-select" style="width:100px;">
          <option value="#141414">Black</option>
          <option value="#c9002b">Red</option>
          <option value="#1560bd">Blue</option>
          <option value="#1e7a3c">Green</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="undo-btn">↩ Undo</button>
      <button class="btn btn-secondary" id="clear-actions-btn">Clear this step</button>
    </div>

    <div class="court-card">
      <canvas id="court-canvas" width="480" height="460"></canvas>
    </div>
    <p class="hint-text" id="step-hint"></p>

    <div class="toolbar" style="margin-top:14px;">
      <button class="btn btn-primary" id="save-play-btn">Save play</button>
      <button class="btn btn-secondary" id="export-pdf-btn">Export to PDF (all steps)</button>
      <button class="btn btn-secondary" id="delete-play-btn" style="display:none; color:#991b1b;">Delete this play</button>
    </div>
  </div>
</div>

<script src="court-diagram.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const els = {
    orgName: document.getElementById("org-name"),
    orgLogo: document.getElementById("org-logo"),
    logoutBtn: document.getElementById("logout-btn"),
    msg: document.getElementById("msg"),
    playsTree: document.getElementById("plays-tree"),
    playName: document.getElementById("play-name"),
    playSeason: document.getElementById("play-season"),
    playTeam: document.getElementById("play-team"),
    playCategory: document.getElementById("play-category"),
    canvas: document.getElementById("court-canvas"),
    colorSelect: document.getElementById("color-select"),
    stepCourtType: document.getElementById("step-court-type"),
    stepHint: document.getElementById("step-hint"),
  };
  const ctx = els.canvas.getContext("2d");

  let currentOrgId = null;
  let currentPlayId = null;
  let allPlays = [];
  let rosterSeasonsTeams = []; // [{season, team}] réels, tirés de Roster
  let activeTool = "move";
  // steps = tableau ordonné, PAS de nombre fixe : chaque étape a son propre
  // type de terrain et sa propre position de départ des joueurs.
  let steps = [];
  let currentStepIndex = 0;
  let dragging = null, drawingFrom = null;
  let animating = false;

  function showMessage(text, type) { els.msg.textContent = text; els.msg.className = "msg " + type; }

  // -----------------------------------------------------------------------
  // Formation par défaut (5 attaquants, 5 défenseurs)
  // -----------------------------------------------------------------------
  function defaultFormation() {
    const spots = [
      { x: 0.5, y: 0.88 }, { x: 0.18, y: 0.7 }, { x: 0.82, y: 0.7 }, { x: 0.3, y: 0.35 }, { x: 0.7, y: 0.35 },
    ];
    return [
      ...spots.map((s, i) => ({ id: "O" + (i + 1), team: "O", num: i + 1, x: s.x, y: s.y })),
      ...spots.map((s, i) => ({ id: "X" + (i + 1), team: "X", num: i + 1, x: s.x, y: Math.max(0.1, s.y - 0.12) })),
    ];
  }

  function newStep(players) {
    return { courtType: "half", players: players || defaultFormation(), actions: [] };
  }

  function currentStep() { return steps[currentStepIndex]; }

  // -----------------------------------------------------------------------
  // Applique les mouvements (coupe/dribble) d'une étape aux joueurs, pour
  // que l'étape suivante démarre là où le ballon/les joueurs ont fini --
  // pas avec les positions de départ de l'étape précédente.
  // -----------------------------------------------------------------------
  function resolvedPlayers(step) {
    const resolved = step.players.map((p) => ({ ...p }));
    step.actions.forEach((a) => {
      if ((a.type === "arrow" || a.type === "dribble") && a.playerId && a.points) {
        const p = resolved.find((pp) => pp.id === a.playerId);
        if (p) { p.x = a.points[1][0]; p.y = a.points[1][1]; }
      }
    });
    return resolved;
  }

  function toPx(x, y) { return [x * els.canvas.width, y * els.canvas.height]; }

  function drawPlayers(playersToDraw) {
    playersToDraw.forEach((p) => {
      const [px, py] = toPx(p.x, p.y);
      ctx.beginPath();
      ctx.arc(px, py, 13, 0, Math.PI * 2);
      ctx.fillStyle = p.team === "O" ? "#d21414" : "#1a1a1a";
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px Inter, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(p.num), px, py + 0.5);
    });
  }

  function render() {
    const step = currentStep();
    if (!step) return;
    drawCourtBackground(ctx, els.canvas, step.courtType);
    step.actions.forEach((a) => drawDiagramElement(ctx, toPx, els.canvas, a));
    drawPlayers(step.players);
  }

  function resizeCanvasForStep() {
    const step = currentStep();
    if (!step) return;
    const [w, h] = CANVAS_SIZES[step.courtType];
    els.canvas.width = w; els.canvas.height = h;
  }

  // -----------------------------------------------------------------------
  // Onglets d'étapes -- nombre libre, pas fixé à 5. "+ Add step" crée la
  // suite logique : les joueurs partent d'où ils ont fini l'étape d'avant.
  // -----------------------------------------------------------------------
  function buildStepTabs() {
    els.stepHint.textContent = steps.length > 1
      ? `Step ${currentStepIndex + 1} of ${steps.length} — players start where the previous step's moves ended.`
      : "Add more steps to build out the full sequence of the play.";
    const row = document.getElementById("step-tabs");
    row.innerHTML = "";
    steps.forEach((s, i) => {
      const btn = document.createElement("button");
      btn.className = "step-tab" + (i === currentStepIndex ? " active" : "");
      btn.innerHTML = `Step ${i + 1}` + (steps.length > 1 ? ` <span class="del-step" data-idx="${i}">✕</span>` : "");
      btn.addEventListener("click", (e) => {
        if (e.target.classList.contains("del-step")) return;
        currentStepIndex = i;
        buildStepTabs(); resizeCanvasForStep(); syncCourtTypeSelect(); render();
      });
      row.appendChild(btn);
    });
    row.querySelectorAll(".del-step").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const idx = parseInt(el.dataset.idx, 10);
        if (steps.length <= 1) return;
        steps.splice(idx, 1);
        currentStepIndex = Math.min(currentStepIndex, steps.length - 1);
        buildStepTabs(); resizeCanvasForStep(); syncCourtTypeSelect(); render();
      });
    });
    const addBtn = document.createElement("button");
    addBtn.className = "add-step-btn";
    addBtn.textContent = "+ Add step";
    addBtn.addEventListener("click", () => {
      const prev = currentStep();
      const carried = resolvedPlayers(prev);
      steps.push(newStep(carried));
      currentStepIndex = steps.length - 1;
      steps[currentStepIndex].courtType = prev.courtType;
      buildStepTabs(); resizeCanvasForStep(); syncCourtTypeSelect(); render();
    });
    row.appendChild(addBtn);
  }

  function syncCourtTypeSelect() {
    const step = currentStep();
    if (step) els.stepCourtType.value = step.courtType;
  }
  els.stepCourtType.addEventListener("change", () => {
    const step = currentStep();
    if (!step) return;
    step.courtType = els.stepCourtType.value;
    resizeCanvasForStep(); render();
  });

  // -----------------------------------------------------------------------
  // Interaction souris/tactile
  // -----------------------------------------------------------------------
  function eventToFraction(e) {
    const rect = els.canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) / rect.width, y: (clientY - rect.top) / rect.height };
  }
  function playerAt(x, y) {
    const step = currentStep();
    return step.players.find((p) => Math.hypot(p.x - x, p.y - y) < 0.05);
  }

  els.canvas.addEventListener("mousedown", onPointerDown);
  els.canvas.addEventListener("touchstart", onPointerDown);
  function onPointerDown(e) {
    e.preventDefault();
    const { x, y } = eventToFraction(e);
    if (activeTool === "move") {
      const p = playerAt(x, y);
      if (p) dragging = p.id;
    } else {
      drawingFrom = { x, y, playerId: (playerAt(x, y) || {}).id };
    }
  }
  els.canvas.addEventListener("mousemove", onPointerMove);
  els.canvas.addEventListener("touchmove", onPointerMove);
  function onPointerMove(e) {
    if (!dragging && !drawingFrom) return;
    e.preventDefault();
    const { x, y } = eventToFraction(e);
    const step = currentStep();
    if (dragging) {
      const p = step.players.find((pl) => pl.id === dragging);
      if (p) { p.x = Math.min(0.96, Math.max(0.04, x)); p.y = Math.min(0.96, Math.max(0.04, y)); render(); }
    } else if (drawingFrom) {
      render();
      drawDiagramElement(ctx, toPx, els.canvas, { type: activeTool, points: [[drawingFrom.x, drawingFrom.y], [x, y]], color: els.colorSelect.value });
    }
  }
  window.addEventListener("mouseup", onPointerUp);
  window.addEventListener("touchend", onPointerUp);
  function onPointerUp(e) {
    if (dragging) { dragging = null; return; }
    if (drawingFrom) {
      const { x, y } = eventToFraction(e.changedTouches ? e.changedTouches[0] : e);
      if (Math.hypot(x - drawingFrom.x, y - drawingFrom.y) > 0.03) {
        currentStep().actions.push({ type: activeTool, points: [[drawingFrom.x, drawingFrom.y], [x, y]], color: els.colorSelect.value, playerId: drawingFrom.playerId });
      }
      drawingFrom = null;
      render();
    }
  }

  buildSharedToolbar(["tools-row1", "tools-row2", "tools-row3"], (key) => { activeTool = key; });

  document.getElementById("undo-btn").addEventListener("click", () => { currentStep().actions.pop(); render(); });
  document.getElementById("clear-actions-btn").addEventListener("click", () => { currentStep().actions = []; render(); });

  document.getElementById("animate-btn").addEventListener("click", async () => {
    if (animating || steps.length === 0) return;
    animating = true;
    for (let i = 0; i < steps.length; i++) {
      currentStepIndex = i;
      buildStepTabs(); resizeCanvasForStep(); syncCourtTypeSelect();
      await animateStep(steps[i]);
      await new Promise((r) => setTimeout(r, 350)); // petite pause entre étapes
    }
    animating = false;
    render();
  });

  function animateStep(step) {
    return new Promise((resolve) => {
      const start = performance.now();
      const duration = 1300;
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        drawCourtBackground(ctx, els.canvas, step.courtType);
        step.actions.forEach((a) => drawDiagramElement(ctx, toPx, els.canvas, a, t));
        const moved = step.players.map((p) => ({ ...p }));
        step.actions.forEach((a) => {
          if ((a.type === "arrow" || a.type === "dribble") && a.playerId && a.points) {
            const p = moved.find((pp) => pp.id === a.playerId);
            if (p) { p.x = a.points[0][0] + (a.points[1][0] - a.points[0][0]) * t; p.y = a.points[0][1] + (a.points[1][1] - a.points[0][1]) * t; }
          }
        });
        drawPlayers(moved);
        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  // -----------------------------------------------------------------------
  // Club + logo + saisons/équipes réelles du Roster (pour les menus)
  // -----------------------------------------------------------------------
  async function loadMyOrganization() {
    const { data, error } = await supabaseClient
      .from("memberships").select("organization_id, status, organizations(name)").eq("status", "active").limit(1);
    if (error || !data || data.length === 0) { showMessage("You're not an active member of any club yet.", "error"); return null; }
    currentOrgId = data[0].organization_id;
    els.orgName.textContent = (data[0].organizations && data[0].organizations.name) || "";
    els.orgLogo.onload = () => { els.orgLogo.style.display = "inline-block"; };
    els.orgLogo.onerror = () => { els.orgLogo.style.display = "none"; };
    els.orgLogo.src = `${SUPABASE_URL}/storage/v1/object/public/logos/${currentOrgId}/logo.png?t=${Date.now()}`;
    return currentOrgId;
  }

  async function loadRosterSeasonsTeams() {
    const { data, error } = await supabaseClient.from("players").select("season, team").eq("organization_id", currentOrgId);
    if (error) { console.error("loadRosterSeasonsTeams error:", error); return; }
    const seen = new Set();
    rosterSeasonsTeams = [];
    (data || []).forEach((r) => {
      const key = r.season + "|" + r.team;
      if (!seen.has(key)) { seen.add(key); rosterSeasonsTeams.push({ season: r.season, team: r.team }); }
    });
    const seasons = Array.from(new Set(rosterSeasonsTeams.map((r) => r.season))).sort().reverse();
    els.playSeason.innerHTML = '<option value="">Optional</option>';
    seasons.forEach((s) => { const o = document.createElement("option"); o.value = s; o.textContent = s; els.playSeason.appendChild(o); });
    updateTeamOptions();
  }
  function updateTeamOptions() {
    const season = els.playSeason.value;
    const teams = Array.from(new Set(rosterSeasonsTeams.filter((r) => !season || r.season === season).map((r) => r.team))).sort();
    const current = els.playTeam.value;
    els.playTeam.innerHTML = '<option value="">Optional</option>';
    teams.forEach((t) => { const o = document.createElement("option"); o.value = t; o.textContent = t; els.playTeam.appendChild(o); });
    if (teams.includes(current)) els.playTeam.value = current;
  }
  els.playSeason.addEventListener("change", updateTeamOptions);

  // -----------------------------------------------------------------------
  // Cuaderno de jugadas, agrupado por temporada/equipo/categoría
  // -----------------------------------------------------------------------
  async function loadPlaysList() {
    const { data, error } = await supabaseClient
      .from("plays").select("id, name, season, team, category").eq("organization_id", currentOrgId).order("name");
    els.playsTree.innerHTML = "";
    if (error) { console.error("loadPlaysList error:", error); return; }
    allPlays = data || [];

    const groups = {}; // "season|team" -> { label, category: { catName: [plays] } }
    allPlays.forEach((p) => {
      const seasonTeam = `${p.season || "No season"} — ${p.team || "No team"}`;
      groups[seasonTeam] = groups[seasonTeam] || {};
      const cat = p.category || "Uncategorized";
      (groups[seasonTeam][cat] = groups[seasonTeam][cat] || []).push(p);
    });

    Object.keys(groups).sort().forEach((seasonTeam) => {
      const seasonEl = document.createElement("div");
      seasonEl.className = "tree-season";
      seasonEl.textContent = seasonTeam;
      els.playsTree.appendChild(seasonEl);
      Object.keys(groups[seasonTeam]).sort().forEach((cat) => {
        const catEl = document.createElement("div");
        catEl.style.cssText = "font-size:11.5px; color:var(--muted); margin:4px 0 2px 4px; text-transform:uppercase;";
        catEl.textContent = cat;
        els.playsTree.appendChild(catEl);
        groups[seasonTeam][cat].forEach((p) => {
          const row = document.createElement("div");
          row.className = "play-item" + (p.id === currentPlayId ? " active" : "");
          const label = document.createElement("span");
          label.textContent = p.name;
          const del = document.createElement("button");
          del.textContent = "✕"; del.title = "Delete";
          del.addEventListener("click", (e) => { e.stopPropagation(); deletePlay(p.id); });
          row.appendChild(label); row.appendChild(del);
          row.addEventListener("click", () => openPlay(p.id));
          els.playsTree.appendChild(row);
        });
      });
    });
  }

  function newPlay() {
    currentPlayId = null;
    els.playName.value = "";
    els.playSeason.value = "";
    updateTeamOptions();
    els.playCategory.value = "";
    steps = [newStep()];
    currentStepIndex = 0;
    buildStepTabs(); resizeCanvasForStep(); syncCourtTypeSelect(); render();
    document.getElementById("delete-play-btn").style.display = "none";
    showMessage("New blank play — draw on the court, then Save when ready.", "success");
  }

  async function openPlay(id) {
    const { data, error } = await supabaseClient.from("plays").select("*").eq("id", id).single();
    if (error) { showMessage(error.message, "error"); return; }
    currentPlayId = id;
    els.playName.value = data.name;
    els.playSeason.value = data.season || "";
    updateTeamOptions();
    els.playTeam.value = data.team || "";
    els.playCategory.value = data.category || "";
    steps = (data.diagram && Array.isArray(data.diagram.steps) && data.diagram.steps.length > 0)
      ? data.diagram.steps
      : [newStep()];
    currentStepIndex = 0;
    buildStepTabs(); resizeCanvasForStep(); syncCourtTypeSelect(); render();
    document.getElementById("delete-play-btn").style.display = "inline-block";
    await loadPlaysList();
  }

  async function savePlay() {
    if (!currentOrgId) { showMessage("Join or create a club first.", "error"); return; }
    const name = els.playName.value.trim();
    if (!name) { showMessage("Give the play a name first.", "error"); return; }
    const payload = {
      organization_id: currentOrgId,
      season: els.playSeason.value || null,
      team: els.playTeam.value || null,
      category: els.playCategory.value.trim() || null,
      name, court_type: "multi-step",
      diagram: { steps },
      updated_at: new Date().toISOString(),
    };
    try {
      let error;
      if (currentPlayId) ({ error } = await supabaseClient.from("plays").update(payload).eq("id", currentPlayId));
      else {
        const { data, error: insErr } = await supabaseClient.from("plays").insert(payload).select("id").single();
        error = insErr;
        if (!error) currentPlayId = data.id;
      }
      if (error) throw error;
      showMessage("Play saved.", "success");
      document.getElementById("delete-play-btn").style.display = "inline-block";
      await loadPlaysList();
    } catch (err) {
      showMessage(err.message || "Couldn't save that play.", "error");
    }
  }

  async function deletePlay(id) {
    if (!confirm("Delete this play?")) return;
    const { error } = await supabaseClient.from("plays").delete().eq("id", id);
    if (error) { showMessage(error.message, "error"); return; }
    if (id === currentPlayId) newPlay();
    await loadPlaysList();
  }

  // -----------------------------------------------------------------------
  // PDF vectoriel : une page par étape, terrain + joueurs + actions
  // dessinés directement (jamais une capture d'écran).
  // -----------------------------------------------------------------------
  function hexToRgb(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  async function loadLogoDataUrl(orgId) {
    try {
      const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/public/logos/${orgId}/logo.png`);
      if (!resp.ok) return null;
      const blob = await resp.blob();
      return await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(blob);
      });
    } catch (e) { return null; }
  }

  function drawStepOnPdf(doc, step, marginX, top) {
    const ink = [26, 26, 26];
    const isHalf = step.courtType === "half";
    const courtW = isHalf ? 300 : 460;
    const courtH = isHalf ? 380 : 260;
    const courtX = marginX + (495 - courtW) / 2;
    const courtTop = top;

    doc.setDrawColor(200, 200, 205); doc.setLineWidth(1);
    doc.rect(courtX, courtTop, courtW, courtH);
    if (isHalf) {
      const keyW = courtW * 0.34, keyH = courtH * 0.34;
      doc.rect(courtX + (courtW - keyW) / 2, courtTop + courtH - keyH, keyW, keyH);
      doc.circle(courtX + courtW / 2, courtTop + courtH - keyH, keyW / 2, "S");
    } else {
      doc.line(courtX, courtTop + courtH / 2, courtX + courtW, courtTop + courtH / 2);
      doc.circle(courtX + courtW / 2, courtTop + courtH / 2, courtH * 0.16, "S");
      [0, 1].forEach((half) => {
        const keyH = courtH * 0.5, keyW = courtW * 0.16;
        const keyX = half === 0 ? courtX : courtX + courtW - keyW;
        doc.rect(keyX, courtTop + (courtH - keyH) / 2, keyW, keyH);
      });
    }

    function toPdfXY(x, y) { return [courtX + x * courtW, courtTop + y * courtH]; }
    step.actions.forEach((a) => {
      const pts = a.points || [];
      if (pts.length < 2) return;
      const [fx, fy] = toPdfXY(pts[0][0], pts[0][1]);
      const [tx, ty] = toPdfXY(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      if (a.type === "pass" || a.type === "fake_pass") doc.setLineDash([3, 2]); else doc.setLineDash([]);
      const [r, g, b] = a.color ? hexToRgb(a.color) : ink;
      doc.setDrawColor(r, g, b); doc.setLineWidth(1.3);
      doc.line(fx, fy, tx, ty);
      doc.setLineDash([]);
    });
    step.players.forEach((p) => {
      const [px, py] = toPdfXY(p.x, p.y);
      doc.setFillColor(...(p.team === "O" ? [210, 20, 20] : [26, 26, 26]));
      doc.circle(px, py, 8, "F");
      doc.setTextColor(255, 255, 255); doc.setFontSize(8); doc.setFont("helvetica", "bold");
      doc.text(String(p.num), px - 2.5, py + 3);
    });
    return courtTop + courtH;
  }

  async function exportToPdf() {
    const logoDataUrl = await loadLogoDataUrl(currentOrgId);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const marginX = 50;

    steps.forEach((step, i) => {
      if (i > 0) doc.addPage();
      let top = 50;
      if (logoDataUrl) { try { doc.addImage(logoDataUrl, "PNG", 495, 30, 40, 40); } catch (e) {} }
      doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(26, 26, 26);
      doc.text(els.orgName.textContent || "Pivot", marginX, top);
      top += 18;
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(130, 130, 136);
      doc.text(`${els.playName.value || "Untitled play"} — step ${i + 1} of ${steps.length}`, marginX, top);
      top += 10;
      doc.setDrawColor(210, 20, 20); doc.setLineWidth(1);
      doc.line(marginX, top, 545, top);
      top += 30;
      drawStepOnPdf(doc, step, marginX, top);
      doc.setTextColor(130, 130, 136); doc.setFontSize(8); doc.setFont("helvetica", "normal");
      doc.text(`Generated by Pivot on ${new Date().toISOString().slice(0, 10)}`, marginX, 810);
    });

    doc.save(`${(els.playName.value || "play").replace(/\s+/g, "_")}.pdf`);
  }

  document.getElementById("new-play-btn").addEventListener("click", newPlay);
  document.getElementById("save-play-btn").addEventListener("click", savePlay);
  document.getElementById("export-pdf-btn").addEventListener("click", exportToPdf);
  document.getElementById("delete-play-btn").addEventListener("click", () => currentPlayId && deletePlay(currentPlayId));

  document.getElementById("nav-menu").addEventListener("change", (e) => {
    if (e.target.value) window.location.href = "./" + e.target.value;
  });

  document.getElementById("help-btn").addEventListener("click", () => {
    const box = document.getElementById("help-box");
    if (box.style.display === "block") { box.style.display = "none"; return; }
    box.innerHTML = `
      <strong>How to use Play design</strong>
      <ul style="margin:8px 0 0; padding-left:18px; line-height:1.9;">
        <li><strong>Season / Team</strong> — pulled straight from your Roster, so plays stay organized the same way your players are. <strong>Category</strong> is free text (e.g. "Half-court offense", "Out of bounds", "Press break") and groups plays in the list on the left.</li>
        <li><strong>Steps</strong> — a play isn't one static picture, it's a sequence. Click "+ Add step" as many times as the play needs (not limited to any fixed number). Each new step starts with players positioned where the previous step's cuts/dribbles ended — so if player 1 passes to player 2 and cuts through, step 2 opens with the ball already at player 2 and player 1 already through the lane. You don't have to manually re-place anyone.</li>
        <li><strong>This step's court</strong> — choose half or full court independently for every single step (e.g. draw the inbounds on a full court, then switch to half court for the set that follows).</li>
        <li><strong>Tools</strong> — 17 total, same set as the Exercise creator: move/select, attacker, defender, coach, ball, cone, post, hand-off, movement (no ball), dribble, pass (dashed), screen, zone, shot, and three types of fakes. Pick a color to distinguish different sequences on the same step.</li>
        <li><strong>Animate whole sequence</strong> — plays every step in order, one after another, moving players along their cuts/dribbles each time — not just the step you're currently looking at.</li>
        <li><strong>Export to PDF</strong> — one page per step, in order, each drawn as real vector shapes (not a screenshot) so it prints and zooms cleanly.</li>
        <li><strong>Save</strong> — the whole sequence (all steps) is saved together as one play.</li>
      </ul>`;
    box.style.display = "block";
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "./login.html";
  });

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) { window.location.href = "./login.html"; return; }
    newPlay();
    const orgId = await loadMyOrganization();
    if (orgId) { await loadRosterSeasonsTeams(); await loadPlaysList(); }
  }
  init();
</script>
