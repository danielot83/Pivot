<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Play design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b70; --line: #e5e5e5; --paper: #fafafa; --card: #ffffff;
    --accent: #d21414; --accent-deep: #a10f0f; --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
  h1, h2, h3, .logotype { font-family: "Space Grotesk", "Inter", sans-serif; }
  a { color: inherit; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); }
  .nav-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .nav-btn:hover { border-color: var(--accent); }
  .back-link { display: inline-block; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; max-width: 1100px; margin: 0 auto; padding: 24px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  h1 { font-size: 22px; margin: 8px 0 4px; display:flex; align-items:center; justify-content:space-between; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }

  .msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }
  .help-box { display: none; background: var(--accent-tint); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--ink); margin-bottom: 12px; }

  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .side-card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px; }
  .tree-season { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .tree-season:first-child { margin-top: 0; }
  .tree-cat { font-size: 11px; color: var(--muted); margin: 4px 0 2px 6px; text-transform: uppercase; }
  .play-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 8px; margin-left: 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .play-item:hover { background: var(--paper); }
  .play-item.active { background: var(--accent-tint); color: var(--accent-deep); font-weight: 600; }
  .play-item button { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--muted); }
  .play-item button:hover { color: var(--accent); }
  .new-play-btn { font-size: 12.5px; color: var(--accent-deep); background: none; border: none; cursor: pointer; padding: 6px 8px; text-align: left; width: 100%; font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-danger { background: transparent; border: 1px solid #f3c6c6; color: #991b1b; }
  .btn-danger:hover { background: #fef2f2; }
  .spacer { flex: 1; }
  .tool-group { display: flex; flex-wrap: wrap; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; margin-bottom: 6px; }
  .tool-btn { padding: 5px 9px; border: none; background: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .tool-btn:hover { background: var(--paper); }
  .tool-btn.active { background: var(--accent); color: #fff; }

  .field-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select, .field textarea { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; font-family: inherit; }

  .step-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; align-items: center; }
  .step-tab { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 12px; cursor: pointer; }
  .step-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .step-tab .del-step { font-size: 10px; opacity: 0.7; }
  .step-tab .del-step:hover { opacity: 1; }
  .add-step-btn { padding: 6px 10px; border: 1px dashed var(--line); background: none; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--accent-deep); font-weight: 600; }
  .add-step-btn:hover { border-color: var(--accent); }

  .court-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; }
  #court-canvas { display: block; margin: 0 auto; cursor: crosshair; touch-action: none; }
  .hint-text { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
  .step-note-display { font-size: 13px; color: var(--ink); background: var(--accent-tint); border-radius: 6px; padding: 8px 12px; margin-top: 10px; display: none; }
</style>
</head>

<div class="layout">
  <div>
    <div class="side-card">

  <div>
    <a class="back-link" href="./dashboard.html">&larr; Back to dashboard</a>
    <h1>
      Play design
      <button id="help-btn" title="How does this work?" style="width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; line-height:1;">?</button>

      </div>
      <div class="field" style="flex:2; min-width:220px;"><label for="step-note">Note for this step</label><input id="step-note" type="text" placeholder="e.g. 1 passes to 2 and cuts to the corner" /></div>

<script src="court-diagram.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const els = {
    orgName: document.getElementById("org-name"),
    orgLogo: document.getElementById("org-logo"),
    logoutBtn: document.getElementById("logout-btn"),
    msg: document.getElementById("msg"),
    playsTree: document.getElementById("plays-tree"),
    playName: document.getElementById("play-name"),
    playSeason: document.getElementById("play-season"),
    playTeam: document.getElementById("play-team"),
    playCategory: document.getElementById("play-category"),
    canvas: document.getElementById("court-canvas"),
    colorSelect: document.getElementById("color-select"),
    stepCourtType: document.getElementById("step-court-type"),
    stepNote: document.getElementById("step-note"),
    stepNoteDisplay: document.getElementById("step-note-display"),
    stepHint: document.getElementById("step-hint"),
    animSpeed: document.getElementById("anim-speed"),
  };
  let ctx = els.canvas.getContext("2d");
  let cssW = 480, cssH = 460;

  let currentOrgId = null;
  let currentPlayId = null;
  let rosterSeasonsTeams = [];
  let activeTool = "select";
  // steps = tableau ordonné, pas de nombre fixe. Chaque étape : son propre
  // type de terrain, sa propre note, ses propres points (joueurs/cônes/...)
  // et actions -- rien n'est pré-rempli, l'utilisateur ajoute ce qu'il faut.
  let steps = [];
  let currentStepIndex = 0;
  let dragging = null, drawingFrom = null, draggingBallId = null;
  let animating = false;

  function showMessage(text, type) { els.msg.textContent = text; els.msg.className = "msg " + type; }

  function newStep() { return { courtType: "half", note: "", points: [], actions: [] }; }
  function currentStep() { return steps[currentStepIndex]; }

  // -----------------------------------------------------------------------
  // Continuité logique : applique les mouvements (coupe/dribble) d'une
  // étape à ses points, pour que l'étape suivante démarre là où le
  // ballon/les joueurs ont fini -- pas avec les positions de départ.
  // -----------------------------------------------------------------------
  // Retourne le point "collé" à p (le ballon qu'un joueur porte, ou le
  // joueur qui porte ce ballon) -- pour que les deux se déplacent
  // ensemble sur un mouvement/dribble. Une passe ne compte pas : le
  // passeur reste sur place, seul le ballon doit voler.
  //
  // On préfère le lien explicite "carriedBy" (posé une fois pour toutes
  // quand le ballon est déposé près d'un joueur) à un simple calcul de
  // distance à chaque fois -- sinon, selon que le clic tombe à 3px ou à
  // 8px du joueur, le lien "voyait" ou "ne voyait pas" le ballon, ce qui
  // cassait la continuité de façon imprévisible.
  const ATTACH_RADIUS = 0.06;
  function findAttachedCompanion(points, p) {
    if (p.type === "ball") {
      if (p.carriedBy) {
        const owner = points.find((o) => o.id === p.carriedBy);
        if (owner) return owner;
      }
      return points.find((o) => o.id !== p.id && (o.type === "player" || o.type === "defender") && Math.hypot(o.x - p.x, o.y - p.y) < ATTACH_RADIUS);
    }
    if (p.type === "player" || p.type === "defender") {
      const carried = points.find((o) => o.type === "ball" && o.carriedBy === p.id);
      if (carried) return carried;
      return points.find((o) => o.id !== p.id && o.type === "ball" && Math.hypot(o.x - p.x, o.y - p.y) < ATTACH_RADIUS);
    }
    return null;
  }

  function resolvedPoints(step) {
    const resolved = step.points.map((p) => ({ ...p }));
    step.actions.forEach((a) => {
      // "pass" est inclus : c'est normalement comme ça que le ballon se
      // déplace d'un joueur à l'autre -- sans ça, un ballon posé sur le
      // terrain ne suivait jamais la jugada. "shot" aussi : un tir, c'est
      // en fait une passe vers le panier -- le ballon doit finir au
      // cercle, pas rester collé au tireur.
      if ((a.type === "arrow" || a.type === "dribble" || a.type === "pass" || a.type === "shot") && a.pointId && a.points) {
        const p = resolved.find((pp) => pp.id === a.pointId);
        if (p) {
          const dx = a.points[1][0] - p.x;
          const dy = a.points[1][1] - p.y;
          // Mouvement/dribble : le ballon et le joueur qui le porte
          // avancent ensemble. Passe et tir : seul le ballon vole.
          if (a.type !== "pass" && a.type !== "shot") {
            const companion = findAttachedCompanion(resolved, p);
            if (companion) { companion.x += dx; companion.y += dy; }
          }
          p.x = a.points[1][0]; p.y = a.points[1][1];
          if (a.type === "pass" && p.type === "ball") {
            // Une passe change de main : le ballon appartient maintenant
            // à qui se trouve à l'endroit où il atterrit (le receveur),
            // plus à celui qui vient de l'envoyer -- sinon l'étape
            // suivante "pense" encore que l'ancien porteur l'a, même
            // s'il est resté loin derrière.
            const receiver = resolved.find((o) => o.id !== p.id && (o.type === "player" || o.type === "defender") && Math.hypot(o.x - p.x, o.y - p.y) < ATTACH_RADIUS);
            p.carriedBy = receiver ? receiver.id : undefined;
          } else if (a.type === "shot" && p.type === "ball") {
            // Après un tir, le ballon est au panier -- personne ne le
            // "porte" plus.
            p.carriedBy = undefined;
          }
        }
      }
    });
    return resolved;
  }

  function toPx(x, y) { return [x * cssW, y * cssH]; }

  function render() {
    const step = currentStep();
    if (!step) return;
    drawCourtBackground(ctx, els.canvas, step.courtType, cssW, cssH);
    step.actions.forEach((a) => drawDiagramElement(ctx, toPx, els.canvas, a));
    step.points.forEach((p) => drawPointElement(ctx, toPx, p));
    els.stepNote.value = step.note || "";
  }

  function resizeCanvasForStep() {
    const step = currentStep();
    if (!step) return;
    [cssW, cssH] = CANVAS_SIZES[step.courtType];
    ctx = setupHiDPICanvas(els.canvas, cssW, cssH);
  }

  // -----------------------------------------------------------------------
  // Onglets d'étapes -- nombre libre. "+ Add step" crée la suite logique.
  // -----------------------------------------------------------------------
  function buildStepTabs() {
    els.stepHint.textContent = steps.length > 1
      ? `Step ${currentStepIndex + 1} of ${steps.length} — points start where the previous step's moves ended.`
      : "Add more steps to build out the full sequence of the play.";
    const row = document.getElementById("step-tabs");
    row.innerHTML = "";
    steps.forEach((s, i) => {
      const btn = document.createElement("button");
      btn.className = "step-tab" + (i === currentStepIndex ? " active" : "");
      btn.innerHTML = `Step ${i + 1}` + (steps.length > 1 ? ` <span class="del-step" data-idx="${i}">✕</span>` : "");
      btn.addEventListener("click", (e) => {
        if (e.target.classList.contains("del-step")) return;
        commitNoteField();
        currentStepIndex = i;
        buildStepTabs(); resizeCanvasForStep(); syncControls(); render();
      });
      row.appendChild(btn);
    });
    row.querySelectorAll(".del-step").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const idx = parseInt(el.dataset.idx, 10);
        if (steps.length <= 1) return;
        steps.splice(idx, 1);
        currentStepIndex = Math.min(currentStepIndex, steps.length - 1);
        buildStepTabs(); resizeCanvasForStep(); syncControls(); render();
      });
    });
    const addBtn = document.createElement("button");
    addBtn.className = "add-step-btn";
    addBtn.textContent = "+ Add step";
    addBtn.addEventListener("click", () => {
      commitNoteField();
      const prev = currentStep();
      const carried = resolvedPoints(prev);
      const next = newStep();
      next.points = carried;
      next.courtType = prev.courtType;
      steps.push(next);
      currentStepIndex = steps.length - 1;
      buildStepTabs(); resizeCanvasForStep(); syncControls(); render();
    });
    row.appendChild(addBtn);
  }

  function commitNoteField() {
    const step = currentStep();
    if (step) step.note = els.stepNote.value;
  }
  els.stepNote.addEventListener("input", commitNoteField);

  function syncControls() {
    const step = currentStep();
    if (step) { els.stepCourtType.value = step.courtType; els.stepNote.value = step.note || ""; }
  }
  els.stepCourtType.addEventListener("change", () => {
    const step = currentStep();
    if (!step) return;
    step.courtType = els.stepCourtType.value;
    resizeCanvasForStep(); render();
  });

  // -----------------------------------------------------------------------
  // Interaction souris/tactile -- gère les TROIS familles d'outils :
  // sélection/déplacement, placement de point (clic simple), et tracé de
  // ligne/écran/zone (clic-glisser). C'est ce qui manquait avant : les
  // outils de placement (joueur, ballon, cône...) ne faisaient jamais rien.
  // -----------------------------------------------------------------------
  const POINT_TOOLS = ["player", "defender", "coach", "ball", "cone", "post", "handoff"];

  function eventToFraction(e) {
    const rect = els.canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) / rect.width, y: (clientY - rect.top) / rect.height };
  }
  function pointAt(x, y, radius) {
    const step = currentStep();
    // Le point le PLUS PROCHE du clic, pas le premier trouvé dans la
    // liste -- sinon, quand un ballon est collé sur un joueur, on
    // "attrapait" toujours le même des deux par hasard (l'ordre de
    // création), même si l'autre était en réalité plus proche du clic.
    let best = null, bestDist = radius || 0.045;
    step.points.forEach((p) => {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestDist) { best = p; bestDist = d; }
    });
    return best;
  }
  const pointCounters = { nextPlayerNum: 1, nextDefenderNum: 1 };

  els.canvas.addEventListener("mousedown", onPointerDown);
  els.canvas.addEventListener("touchstart", onPointerDown);
  function onPointerDown(e) {
    e.preventDefault();
    const { x, y } = eventToFraction(e);
    const step = currentStep();

    if (activeTool === "select") {
      const p = pointAt(x, y);
      if (p) {
        dragging = p.id;
        // si un ballon est juste à côté (le joueur "l'a en main"), il
        // doit suivre le joueur tant qu'on ne dessine pas un vrai pas/tir
        draggingBallId = null;
        if (p.type === "player" || p.type === "defender") {
          const ball = step.points.find((b) => b.type === "ball" && (b.carriedBy === p.id || (b.id !== p.id && Math.hypot(b.x - p.x, b.y - p.y) < ATTACH_RADIUS)));
          if (ball) draggingBallId = ball.id;
        }
      }
      return;
    }
    if (POINT_TOOLS.includes(activeTool)) {
      const id = "p" + Date.now() + Math.floor(Math.random() * 1000);
      const el = { id, type: activeTool, x, y, color: els.colorSelect.value };
      if (activeTool === "player" || activeTool === "defender") {
        // Attaque et défense comptent chacune à partir de 1 -- avant, un
        // seul compteur partagé faisait que le premier défenseur posé
        // héritait du prochain numéro de l'attaque (ex: "5") au lieu de
        // recommencer à 1, alors que visuellement ce sont deux groupes
        // séparés (couleur/contour différents).
        const counter = activeTool === "player" ? "nextPlayerNum" : "nextDefenderNum";
        const label = prompt("Number/label for this " + activeTool + ":", String(pointCounters[counter]));
        if (label === null) return; // annulé
        el.label = label.trim();
        pointCounters[counter]++;
      }
      // Si on pose un ballon juste à côté d'un joueur/défenseur, on note
      // explicitement "ce joueur le porte" -- ce lien reste vrai même si
      // plus tard les deux se retrouvent à une distance légèrement
      // différente (au lieu de le redeviner par la distance à chaque
      // fois, ce qui était fragile).
      if (activeTool === "ball") {
        const carrier = step.points.find((o) => (o.type === "player" || o.type === "defender") && Math.hypot(o.x - x, o.y - y) < ATTACH_RADIUS);
        if (carrier) el.carriedBy = carrier.id;
      }
      step.points.push(el);
      render();
      return;
    }
    // outils de ligne/écran/zone : clic-glisser
    // Pour les outils qui représentent un déplacement réel (arrow,
    // dribble, pass), on est plus tolérant sur la précision du clic --
    // sinon, un clic à quelques pixels du joueur/ballon crée une ligne
    // "orpheline" : elle se voit très bien à l'écran, mais comme elle
    // n'est rattachée à personne, rien ne bouge à l'étape suivante, en
    // silence, sans aucun message d'erreur.
    const isMovementTool = activeTool === "arrow" || activeTool === "dribble" || activeTool === "pass" || activeTool === "shot";
    let startPoint = pointAt(x, y, isMovementTool ? 0.09 : 0.045);
    // Une PASSE (ou un TIR, qui est en fait une passe vers le panier),
    // c'est toujours le ballon qui vole -- jamais le joueur qui l'envoie.
    // Si le clic a "attrapé" le joueur (parce que le ballon est collé
    // dessus, à quelques pixels près), on redirige vers le ballon :
    // sinon, selon la précision du clic, c'était parfois le joueur qui
    // se retrouvait déplacé à la place du ballon.
    if ((activeTool === "pass" || activeTool === "shot") && startPoint && (startPoint.type === "player" || startPoint.type === "defender")) {
      const step2 = currentStep();
      const ball = step2.points.find((b) => b.type === "ball" && (b.carriedBy === startPoint.id || (b.id !== startPoint.id && Math.hypot(b.x - startPoint.x, b.y - startPoint.y) < ATTACH_RADIUS)));
      if (ball) startPoint = ball;
    }
    if (isMovementTool && !startPoint) {
      showMessage("This line didn't start on a player or ball, so it won't carry over to the next step. Start the drag right on the dot.", "error");
    }
    drawingFrom = { x, y, pointId: (startPoint || {}).id };
  }
  els.canvas.addEventListener("mousemove", onPointerMove);
  els.canvas.addEventListener("touchmove", onPointerMove);
  function onPointerMove(e) {
    if (!dragging && !drawingFrom) return;
    e.preventDefault();
    const { x, y } = eventToFraction(e);
    const step = currentStep();
    if (dragging) {
      const p = step.points.find((pl) => pl.id === dragging);
      if (p) {
        const dx = Math.min(0.97, Math.max(0.03, x)) - p.x;
        const dy = Math.min(0.97, Math.max(0.03, y)) - p.y;
        p.x += dx; p.y += dy;
        if (draggingBallId) {
          const ball = step.points.find((b) => b.id === draggingBallId);
          if (ball) { ball.x += dx; ball.y += dy; }
        }
        render();
      }
    } else if (drawingFrom) {
      render();
      if (activeTool === "zone") {
        drawZoneElement(ctx, toPx, els.canvas, { x: Math.min(drawingFrom.x, x), y: Math.min(drawingFrom.y, y), w: Math.abs(x - drawingFrom.x), h: Math.abs(y - drawingFrom.y), color: els.colorSelect.value });
      } else if (activeTool === "screen") {
        drawScreenElement(ctx, toPx, { points: [[drawingFrom.x, drawingFrom.y], [x, y]], color: els.colorSelect.value });
      } else {
        drawLineElement(ctx, toPx, { type: activeTool, points: [[drawingFrom.x, drawingFrom.y], [x, y]], color: els.colorSelect.value });
      }
    }
  }
  window.addEventListener("mouseup", onPointerUp);
  window.addEventListener("touchend", onPointerUp);
  function onPointerUp(e) {
    if (dragging) { dragging = null; draggingBallId = null; return; }
    if (drawingFrom) {
      const { x, y } = eventToFraction(e.changedTouches ? e.changedTouches[0] : e);
      const step = currentStep();
      if (activeTool === "zone") {
        if (Math.abs(x - drawingFrom.x) > 0.02 && Math.abs(y - drawingFrom.y) > 0.02) {
          step.actions.push({ type: "zone", x: Math.min(drawingFrom.x, x), y: Math.min(drawingFrom.y, y), w: Math.abs(x - drawingFrom.x), h: Math.abs(y - drawingFrom.y), color: els.colorSelect.value });
        }
      } else if (Math.hypot(x - drawingFrom.x, y - drawingFrom.y) > 0.03) {
        step.actions.push({ type: activeTool, points: [[drawingFrom.x, drawingFrom.y], [x, y]], color: els.colorSelect.value, pointId: drawingFrom.pointId });
      }
      drawingFrom = null;
      render();
    }
  }
  els.canvas.addEventListener("dblclick", (e) => {
    const { x, y } = eventToFraction(e);
    const p = pointAt(x, y);
    if (p && (p.type === "player" || p.type === "defender")) {
      const label = prompt("Label for this point:", p.label || "");
      if (label !== null) { p.label = label.trim(); render(); }
    } else if (p) {
      if (confirm("Remove this point from the step?")) {
        const step = currentStep();
        step.points = step.points.filter((pt) => pt.id !== p.id);
        render();
      }
    }
  });

  buildSharedToolbar(["tools-row1", "tools-row2", "tools-row3"], (key) => { activeTool = key; });

  document.getElementById("undo-btn").addEventListener("click", () => {
    const step = currentStep();
    if (step.actions.length) step.actions.pop();
    else step.points.pop();
    render();
  });
  document.getElementById("clear-actions-btn").addEventListener("click", () => {

  // Anime toute la séquence, étape par étape, à la vitesse choisie.

  document.getElementById("animate-btn").addEventListener("click", () => runAnimation(false));
  document.getElementById("download-gif-btn").addEventListener("click", () => runAnimation(true));

  let cachedGifWorkerUrl = null;
  async function getGifWorkerUrl() {
    // Un Worker ne peut pas être créé directement depuis un script d'un
    // autre domaine (restriction de sécurité du navigateur) -- sans ça,
    // gif.js échouait en silence et rien ne se téléchargeait jamais.
    if (cachedGifWorkerUrl) return cachedGifWorkerUrl;
    const resp = await fetch("https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js");
    const text = await resp.text();
    const blob = new Blob([text], { type: "application/javascript" });
    cachedGifWorkerUrl = URL.createObjectURL(blob);
    return cachedGifWorkerUrl;
  }

  async function runAnimation(recordGif) {
    if (animating || steps.length === 0) return;
    animating = true;
    const speed = parseFloat(els.animSpeed.value) || 1;
    let gif = null;
    if (recordGif) {
      const workerUrl = await getGifWorkerUrl();
      gif = new GIF({ workers: 2, quality: 8, width: els.canvas.width, height: els.canvas.height, workerScript: workerUrl });
      gif.on("abort", () => showMessage("Couldn't render the GIF.", "error"));
    }
    for (let i = 0; i < steps.length; i++) {
      currentStepIndex = i;
      buildStepTabs(); resizeCanvasForStep(); syncControls();
      await animateStep(steps[i], speed, gif);
      await new Promise((r) => setTimeout(r, 350 * speed));
    }
    animating = false;
    render();
    if (gif) {
      showMessage("Rendering the GIF, this can take a moment…", "success");
      gif.on("finished", (blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${(els.playName.value || "play").replace(/\s+/g, "_")}.gif`;
        // Un lien qui n'est pas dans le document est parfois ignoré par
        // le navigateur, surtout ici où le clic arrive de façon
        // asynchrone (après le rendu du GIF) et non pas au moment même
        // du clic de l'utilisateur -- il faut l'attacher au DOM.
        document.body.appendChild(a);
        a.click();
        a.remove();
        showMessage("GIF downloaded.", "success");
      });
      gif.render();
    }
  }

  function animateStep(step, speed, gif) {
    return new Promise((resolve) => {
      const start = performance.now();
      const duration = 1300 * speed;
      let lastFrameTime = 0;
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        drawCourtBackground(ctx, els.canvas, step.courtType, cssW, cssH);
        step.actions.forEach((a) => drawDiagramElement(ctx, toPx, els.canvas, a, t));
        const moved = step.points.map((p) => ({ ...p }));
        step.actions.forEach((a) => {
          if ((a.type === "arrow" || a.type === "dribble" || a.type === "pass" || a.type === "shot") && a.pointId && a.points) {
            const p = moved.find((pp) => pp.id === a.pointId);
            if (p) {
              const newX = a.points[0][0] + (a.points[1][0] - a.points[0][0]) * t;
              const newY = a.points[0][1] + (a.points[1][1] - a.points[0][1]) * t;
              const dx = newX - p.x, dy = newY - p.y;
              if (a.type !== "pass" && a.type !== "shot") {
                const companion = findAttachedCompanion(moved, p);
                if (companion) { companion.x += dx; companion.y += dy; }
              }
              p.x = newX; p.y = newY;
            }
          }
        });
        moved.forEach((p) => drawPointElement(ctx, toPx, p));
        if (step.note) {
          els.stepNoteDisplay.textContent = step.note;
          els.stepNoteDisplay.style.display = "block";
        } else {
          els.stepNoteDisplay.style.display = "none";
        }
        if (gif && now - lastFrameTime > 80) { gif.addFrame(els.canvas, { copy: true, delay: 90 }); lastFrameTime = now; }
        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  async function loadMyOrganization() {
    const { data, error } = await supabaseClient
      .from("memberships").select("organization_id, status, organizations(name)").eq("status", "active").limit(1);
    if (error || !data || data.length === 0) { showMessage("You're not an active member of any club yet.", "error"); return null; }
    currentOrgId = data[0].organization_id;
    els.orgName.textContent = (data[0].organizations && data[0].organizations.name) || "";
    els.orgLogo.onload = () => { els.orgLogo.style.display = "inline-block"; };
    els.orgLogo.onerror = () => { els.orgLogo.style.display = "none"; };
    els.orgLogo.src = `${SUPABASE_URL}/storage/v1/object/public/logos/${currentOrgId}/logo.png?t=${Date.now()}`;
    return currentOrgId;
  }

  async function loadRosterSeasonsTeams() {
    const { data, error } = await supabaseClient.from("players").select("season, team").eq("organization_id", currentOrgId);
    if (error) { console.error("loadRosterSeasonsTeams error:", error); return; }
    const seen = new Set();
    rosterSeasonsTeams = [];
    (data || []).forEach((r) => {
      const key = r.season + "|" + r.team;
      if (!seen.has(key)) { seen.add(key); rosterSeasonsTeams.push({ season: r.season, team: r.team }); }
    });
    const seasons = Array.from(new Set(rosterSeasonsTeams.map((r) => r.season))).sort().reverse();
    els.playSeason.innerHTML = '<option value="">Optional</option>';
    seasons.forEach((s) => { const o = document.createElement("option"); o.value = s; o.textContent = s; els.playSeason.appendChild(o); });
    updateTeamOptions();
  }
  function updateTeamOptions() {
    const season = els.playSeason.value;
    const teams = Array.from(new Set(rosterSeasonsTeams.filter((r) => !season || r.season === season).map((r) => r.team))).sort();
    const current = els.playTeam.value;
    els.playTeam.innerHTML = '<option value="">Optional</option>';
    teams.forEach((t) => { const o = document.createElement("option"); o.value = t; o.textContent = t; els.playTeam.appendChild(o); });
    if (teams.includes(current)) els.playTeam.value = current;
  }
  els.playSeason.addEventListener("change", updateTeamOptions);

  // -----------------------------------------------------------------------
  // Cuaderno de jugadas, agrupado por temporada/equipo, luego categoría
  // (comme des "sous-dossiers")
  // -----------------------------------------------------------------------
  async function loadPlaysList() {
    const { data, error } = await supabaseClient
      .from("plays").select("id, name, season, team, category").eq("organization_id", currentOrgId).order("name");
    els.playsTree.innerHTML = "";
    if (error) { console.error("loadPlaysList error:", error); return; }

    const groups = {};
    (data || []).forEach((p) => {
      const seasonTeam = `${p.season || "No season"} — ${p.team || "No team"}`;
      groups[seasonTeam] = groups[seasonTeam] || {};
      const cat = p.category || "Uncategorized";
      (groups[seasonTeam][cat] = groups[seasonTeam][cat] || []).push(p);
    });

    Object.keys(groups).sort().forEach((seasonTeam) => {
      const seasonEl = document.createElement("div");
      seasonEl.className = "tree-season";
      seasonEl.textContent = seasonTeam;
      els.playsTree.appendChild(seasonEl);
      Object.keys(groups[seasonTeam]).sort().forEach((cat) => {
        const catEl = document.createElement("div");
        catEl.className = "tree-cat";
        catEl.textContent = "📁 " + cat;
        els.playsTree.appendChild(catEl);
        groups[seasonTeam][cat].forEach((p) => {
          const row = document.createElement("div");
          row.className = "play-item" + (p.id === currentPlayId ? " active" : "");
          const label = document.createElement("span");
          label.textContent = p.name;
          const del = document.createElement("button");
          del.textContent = "✕"; del.title = "Delete";
          del.addEventListener("click", (e) => { e.stopPropagation(); deletePlay(p.id); });
          row.appendChild(label); row.appendChild(del);
          row.addEventListener("click", () => openPlay(p.id));
          els.playsTree.appendChild(row);
        });
      });
    });

  function newPlay() {
    currentPlayId = null;
    els.playName.value = "";
    els.playSeason.value = "";
    updateTeamOptions();
    els.playCategory.value = "";
    steps = [newStep()];
    currentStepIndex = 0;
    pointCounters.nextPlayerNum = 1;
    pointCounters.nextDefenderNum = 1;
    buildStepTabs(); resizeCanvasForStep(); syncControls(); render();
    document.getElementById("delete-play-btn").style.display = "none";
    showMessage("New blank play — pick a tool and draw on the court, then Save when ready.", "success");
  }

  async function openPlay(id) {
    const { data, error } = await supabaseClient.from("plays").select("*").eq("id", id).single();
    if (error) { showMessage(error.message, "error"); return; }
    currentPlayId = id;
    els.playName.value = data.name;
    els.playSeason.value = data.season || "";
    updateTeamOptions();
    els.playTeam.value = data.team || "";
    els.playCategory.value = data.category || "";
    steps = (data.diagram && Array.isArray(data.diagram.steps) && data.diagram.steps.length > 0)
      ? data.diagram.steps.map((s) => ({ courtType: s.courtType || "half", note: s.note || "", points: s.points || [], actions: s.actions || [] }))
      : [newStep()];
    currentStepIndex = 0;
    // Reprend la numérotation là où la jugada l'avait laissée -- sinon,
    // ouvrir une jugada qui a déjà les joueurs 1 à 5 et en ajouter un
    // nouveau proposait à nouveau "1", au lieu de "6".
    ["player", "defender"].forEach((kind) => {
      const key = kind === "player" ? "nextPlayerNum" : "nextDefenderNum";
      let max = 0;
      steps.forEach((s) => s.points.forEach((p) => {
        if (p.type === kind) { const n = parseInt(p.label, 10); if (!isNaN(n) && n > max) max = n; }
      }));
      pointCounters[key] = max + 1;
    });
    buildStepTabs(); resizeCanvasForStep(); syncControls(); render();
    document.getElementById("delete-play-btn").style.display = "inline-block";
    await loadPlaysList();
  }

  async function savePlay() {
    if (!currentOrgId) { showMessage("Join or create a club first.", "error"); return; }
    const name = els.playName.value.trim();
    if (!name) { showMessage("Give the play a name first.", "error"); return; }
    commitNoteField();
    const payload = {
      organization_id: currentOrgId,
      season: els.playSeason.value || null,
      team: els.playTeam.value || null,
      category: els.playCategory.value.trim() || null,
      name, court_type: "multi-step",
      diagram: { steps },
      updated_at: new Date().toISOString(),
    };
    try {
      let error;
      if (currentPlayId) ({ error } = await supabaseClient.from("plays").update(payload).eq("id", currentPlayId));
      else {
        const { data, error: insErr } = await supabaseClient.from("plays").insert(payload).select("id").single();
        error = insErr;
        if (!error) currentPlayId = data.id;
      }
      if (error) throw error;
      showMessage("Play saved.", "success");
      document.getElementById("delete-play-btn").style.display = "inline-block";
      await loadPlaysList();
    } catch (err) {
      showMessage(err.message || "Couldn't save that play.", "error");
    }
  }

  async function deletePlay(id) {
    if (!confirm("Delete this play? This can't be undone.")) return;
    const { error } = await supabaseClient.from("plays").delete().eq("id", id);
    if (error) { showMessage(error.message, "error"); return; }
    if (id === currentPlayId) newPlay();
    await loadPlaysList();
  }

  // -----------------------------------------------------------------------
  // PDF vectoriel : une page par étape, avec sa note en légende
  // -----------------------------------------------------------------------
  function hexToRgb(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  async function loadLogoDataUrl(orgId) {
    try {
      const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/public/logos/${orgId}/logo.png`);
      if (!resp.ok) return null;
      const blob = await resp.blob();
      return await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(blob);
      });
    } catch (e) { return null; }
  }

  // Dessine un arc en petits segments de droite -- jsPDF n'a pas d'arc
  // paramétrique direct, donc on suit la même logique que la vérification
  // Python qui a servi à corriger court-diagram.js.
  function pdfArc(doc, cx, cy, r, a1, a2, n) {
    n = n || 30;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = a1 + (a2 - a1) * i / n;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    for (let i = 0; i < pts.length - 1; i++) doc.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
  }

  // Même géométrie exacte que le terrain à l'écran (voir court-diagram.js)
  // -- pour que le PDF ne soit jamais "différent de ce qu'on voit".
  function drawPdfHalfCourt(doc, originX, originY, courtW, courtH, basketAtBottom) {
    const cx = originX + courtW / 2;
    const keyW = courtW * 0.32, keyH = courtH * 0.38;
    const keyX = cx - keyW / 2;
    const keyY = basketAtBottom ? originY + courtH - keyH : originY;
    doc.rect(keyX, keyY, keyW, keyH);

    const ftY = basketAtBottom ? keyY : keyY + keyH;
    const ftR = keyW * 0.375;
    pdfArc(doc, cx, ftY, ftR, 0, Math.PI * 2);

    const basketY = basketAtBottom ? originY + courtH - 7 : originY + 7;
    const backboardY = basketAtBottom ? basketY - 9 : basketY + 9;
    doc.line(cx - 15, backboardY, cx + 15, backboardY);
    pdfArc(doc, cx, basketY, 4, 0, Math.PI * 2, 16);

    const raR = keyW * 0.26;
    if (basketAtBottom) pdfArc(doc, cx, basketY, raR, Math.PI, 2 * Math.PI);
    else pdfArc(doc, cx, basketY, raR, 0, Math.PI);

    const r3 = courtW * 0.475;
    const cornerX = courtW * 0.44;
    const cornerReach = Math.sqrt(Math.max(r3 * r3 - cornerX * cornerX, 0));
    const phi = Math.acos(cornerX / r3);
    if (basketAtBottom) {
      const baseY = originY + courtH - 3;
      const straightTopY = basketY - cornerReach;
      doc.line(cx - cornerX, baseY, cx - cornerX, straightTopY);
      pdfArc(doc, cx, basketY, r3, Math.PI + phi, 2 * Math.PI - phi);
      doc.line(cx + cornerX, straightTopY, cx + cornerX, baseY);
    } else {
      const baseY = originY + 3;
      const straightBottomY = basketY + cornerReach;
      doc.line(cx - cornerX, baseY, cx - cornerX, straightBottomY);
      pdfArc(doc, cx, basketY, r3, Math.PI - phi, phi, 30); // même sens que le correctif de la diagonale
      doc.line(cx + cornerX, straightBottomY, cx + cornerX, baseY);
    }
  }

  // Même transformation vérifiée que court-diagram.js pour "full" :
  // un point local (lx,ly) devient (ly, H-lx) une fois tourné à 90°.
  // On dessine donc drawPdfHalfCourt dans un espace local, puis on
  // convertit chaque primitive avec cette règle avant de l'envoyer à jsPDF.
  // Version horizontale directe (basket a gauche ou a droite), sans
  // passer par une rotation -- plus simple a verifier et moins risque
  // de refaire l'erreur de transformation.
  function drawPdfHalfCourtRotated(doc, courtX, top, courtW, courtH, basketAtLeft) {
    const cy = top + courtH / 2;
    const keyWidth = courtH * 0.32, keyDepth = (courtW / 2) * 0.38;
    const keyX = basketAtLeft ? courtX : courtX + courtW - keyDepth;
    doc.rect(keyX, cy - keyWidth / 2, keyDepth, keyWidth);

    const ftX = basketAtLeft ? keyX + keyDepth : keyX;
    const ftR = keyWidth * 0.375;
    pdfArc(doc, ftX, cy, ftR, 0, Math.PI * 2);

    const basketX = basketAtLeft ? courtX + 7 : courtX + courtW - 7;
    const backboardX = basketAtLeft ? basketX + 9 : basketX - 9;
    doc.line(backboardX, cy - 15, backboardX, cy + 15);
    pdfArc(doc, basketX, cy, 4, 0, Math.PI * 2, 16);

    const raR = keyWidth * 0.26;
    if (basketAtLeft) pdfArc(doc, basketX, cy, raR, -Math.PI / 2, Math.PI / 2);
    else pdfArc(doc, basketX, cy, raR, Math.PI / 2, Math.PI * 1.5);

    const r3 = courtH * 0.475;
    const cornerDist = courtH * 0.44;
    const cornerReach = Math.sqrt(Math.max(r3 * r3 - cornerDist * cornerDist, 0));
    const phi = Math.acos(cornerDist / r3);
    const baseX = basketAtLeft ? courtX + 3 : courtX + courtW - 3;
    if (basketAtLeft) {
      const straightX = basketX + cornerReach;
      doc.line(baseX, cy - cornerDist, straightX, cy - cornerDist);
      pdfArc(doc, basketX, cy, r3, -phi, phi, 30);
      doc.line(straightX, cy + cornerDist, baseX, cy + cornerDist);
    } else {
      const straightX = basketX - cornerReach;
      doc.line(baseX, cy - cornerDist, straightX, cy - cornerDist);
      pdfArc(doc, basketX, cy, r3, Math.PI - phi, Math.PI + phi, 30);
      doc.line(straightX, cy + cornerDist, baseX, cy + cornerDist);
    }
  }

  function drawStepOnPdf(doc, step, marginX, top) {
    const isHalf = step.courtType === "half";
    const courtW = isHalf ? 300 : 460;
    const courtH = isHalf ? 280 : 240;
    const courtX = marginX + (495 - courtW) / 2;
    doc.setDrawColor(190, 190, 195); doc.setLineWidth(0.7);
    doc.rect(courtX, top, courtW, courtH);

    if (isHalf) {
      pdfArc(doc, courtX + courtW / 2, top, courtW * 0.22, 0, Math.PI);
      drawPdfHalfCourt(doc, courtX, top, courtW, courtH, true);
    } else {
      doc.line(courtX + courtW / 2, top, courtX + courtW / 2, top + courtH);
      pdfArc(doc, courtX + courtW / 2, top + courtH / 2, courtH * 0.22, 0, Math.PI * 2);
      // même rotation que le canvas : les deux moitiés partagent l'axe vertical
      drawPdfHalfCourtRotated(doc, courtX, top, courtW, courtH, false);
      drawPdfHalfCourtRotated(doc, courtX, top, courtW, courtH, true);
    }

    function toPdfXY(x, y) { return [courtX + x * courtW, top + y * courtH]; }

    doc.setLineWidth(1.2);
    step.actions.forEach((a) => {
      const pts = a.points || [];
      if (pts.length < 2) return;
      const [fx, fy] = toPdfXY(pts[0][0], pts[0][1]);
      const [tx, ty] = toPdfXY(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      const [r, g, b] = a.color ? hexToRgb(a.color) : [26, 26, 26];
      doc.setDrawColor(r, g, b); doc.setFillColor(r, g, b);
      if (a.type === "pass" || a.type === "fake_pass") doc.setLineDash([3, 2]); else doc.setLineDash([]);
      doc.line(fx, fy, tx, ty);
      doc.setLineDash([]);
      if (a.type !== "zone") {
        // pointe de flèche -- c'est ce qui manquait complètement avant
        const angle = Math.atan2(ty - fy, tx - fx);
        const ah = 6;
        const p1 = [tx - ah * Math.cos(angle - 0.4), ty - ah * Math.sin(angle - 0.4)];
        const p2 = [tx - ah * Math.cos(angle + 0.4), ty - ah * Math.sin(angle + 0.4)];
        doc.triangle(tx, ty, p1[0], p1[1], p2[0], p2[1], "F");
      }
    });

    step.points.forEach((p) => {
      const [px, py] = toPdfXY(p.x, p.y);
      const [r, g, b] = p.color ? hexToRgb(p.color) : [26, 26, 26];
      doc.setDrawColor(r, g, b); doc.setFillColor(r, g, b);
      if (p.type === "player") {
        doc.circle(px, py, 8, "F");
        if (p.label) { doc.setTextColor(255, 255, 255); doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.text(String(p.label).slice(0, 2), px - 3, py + 3); }
      } else if (p.type === "defender") {
        doc.setLineWidth(1); doc.circle(px, py, 8, "S");
        if (p.label) { doc.setTextColor(r, g, b); doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.text(String(p.label).slice(0, 2), px - 3, py + 3); }
      } else if (p.type === "ball") {
        doc.setLineWidth(1); doc.circle(px, py, 5, "S");
      } else if (p.type === "cone") {
        doc.triangle(px, py - 6, px + 5, py + 5, px - 5, py + 5, "F");
      } else if (p.type === "post") {
        doc.rect(px - 5, py - 5, 10, 10, "F");
      } else if (p.type === "coach" || p.type === "handoff") {
        doc.setTextColor(r, g, b); doc.setFontSize(10); doc.setFont("helvetica", "bold");
        doc.text(p.type === "coach" ? "C" : "#", px - 3, py + 3);
      }
    });
    return top + courtH;
  }

  async function exportToPdf() {
    const logoDataUrl = await loadLogoDataUrl(currentOrgId);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const marginX = 50;

    steps.forEach((step, i) => {
      if (i > 0) doc.addPage();
      let top = 50;
      if (logoDataUrl) { try { doc.addImage(logoDataUrl, "PNG", 495, 30, 40, 40); } catch (e) {} }
      doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(26, 26, 26);
      doc.text(els.orgName.textContent || "Pivot", marginX, top);
      top += 18;
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(130, 130, 136);
      doc.text(`${els.playName.value || "Untitled play"} — step ${i + 1} of ${steps.length}`, marginX, top);
      top += 10;
      doc.setDrawColor(210, 20, 20); doc.setLineWidth(1);
      doc.line(marginX, top, 545, top);
      top += 26;
      const bottom = drawStepOnPdf(doc, step, marginX, top);
      if (step.note) {
        doc.setFont("helvetica", "italic"); doc.setFontSize(10); doc.setTextColor(60, 60, 60);
        doc.text(step.note, marginX, bottom + 20, { maxWidth: 495 });
      }
      doc.setTextColor(130, 130, 136); doc.setFontSize(8); doc.setFont("helvetica", "normal");
      doc.text(`Generated by Pivot on ${new Date().toISOString().slice(0, 10)}`, marginX, 810);
    });

    doc.save(`${(els.playName.value || "play").replace(/\s+/g, "_")}.pdf`);
  }

  document.getElementById("new-play-btn").addEventListener("click", newPlay);
  document.getElementById("save-play-btn").addEventListener("click", savePlay);
  document.getElementById("export-pdf-btn").addEventListener("click", exportToPdf);
  document.getElementById("delete-play-btn").addEventListener("click", () => currentPlayId && deletePlay(currentPlayId));

  document.getElementById("nav-menu").addEventListener("change", (e) => {
    if (e.target.value) window.location.href = "./" + e.target.value;
  });

  document.getElementById("help-btn").addEventListener("click", () => {
    const box = document.getElementById("help-box");
    if (box.style.display === "block") { box.style.display = "none"; return; }
    box.innerHTML = `
      <strong>How to use Play design</strong>
      <ul style="margin:8px 0 0; padding-left:18px; line-height:1.9;">
        <li><strong>Season / Team dropdowns</strong> — these are NOT typed in here. They're pulled directly from Roster: whatever seasons and teams already have players added in Roster are the only ones you can pick from. If a season/team is missing from the dropdown, go add that team's players in Roster first, then come back — it'll show up automatically.</li>
        <li><strong>Category = the "subfolder"</strong> — this one IS free text, typed by you (e.g. "Half-court offense", "Out of bounds", "Press break", "Zone offense"). There's no separate screen to "create" a category — you just type a name here and save; the very next play you give the same category name to will automatically appear grouped with it in the playbook on the left, under that season/team. Typos create a new, separate folder, so keep the wording consistent (e.g. always "Out of bounds", not sometimes "OOB").</li>
        <li>The playbook on the left is organized in two levels: first by <strong>Season — Team</strong>, then by <strong>Category</strong> underneath (shown with a 📁 icon). A play with no season/team goes under "No season — No team"; a play with no category goes under "Uncategorized."</li>
        <li>A new play starts <strong>completely empty</strong> — nothing is pre-placed. Pick "Attacker", "Defender", "Ball", "Cone", "Coach", "Post", or "Handoff" and click the court to add one; you'll be asked for a number/label for attackers and defenders.</li>
        <li><strong>Move/select</strong> — drag any point you've placed. Double-click a player/defender to rename it, or double-click any other point to remove it.</li>
        <li><strong>Steps</strong> — click "+ Add step" as many times as the play needs. Each new step starts with points positioned exactly where the previous step's cuts/dribbles ended — draw a pass from 1 to 2 and step 2 opens with the ball already at 2.</li>
        <li><strong>Note for this step</strong> — a short caption (e.g. "1 passes to 2 and cuts backdoor") that appears on screen while that step plays during "Animate", and under the diagram in the exported PDF.</li>
        <li><strong>This step's court</strong> — half or full, chosen independently for every step.</li>
        <li><strong>Speed</strong> — slows down or speeds up "Animate whole sequence"; the same speed also gets baked into the downloaded GIF.</li>
        <li><strong>Download animation (GIF)</strong> — renders the whole sequence as a GIF file you can send or embed anywhere, not just play it here.</li>
        <li><strong>Undo</strong> removes the last action, or the last point if there are no actions left. <strong>Clear this step</strong> wipes everything on the current step only.</li>
      </ul>`;
    box.style.display = "block";
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "./login.html";
  });

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) { window.location.href = "./login.html"; return; }
    newPlay();
    const orgId = await loadMyOrganization();
    if (orgId) { await loadRosterSeasonsTeams(); await loadPlaysList(); }
  }
  init();
</script>
