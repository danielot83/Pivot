<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Module</title>
<style>
  /* Même feuille de style que index.html -- une seule logique de design
     partagée entre la page d'accueil et chaque fiche de module. */
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b70;
    --line: #e5e5e5;
    --paper: #fafafa;
    --card: #ffffff;
    --accent: #d21414;
    --accent-deep: #a10f0f;
    --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  h1, h2, .logotype { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-cta {
    background: var(--ink);
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-cta:hover { background: var(--accent-deep); }

  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 24px 40px; }
  .back-link {
    display: inline-block;
    font-size: 13.5px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 24px;
  }
  .back-link:hover { color: var(--ink); }
  .badge-soon {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    padding: 3px 10px;
    border-radius: 100px;
    margin-left: 10px;
    vertical-align: middle;
  }
  h1 { font-size: 32px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  p.tagline { font-size: 16px; color: var(--muted); margin: 0 0 32px; }
  .concept-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 30px;
    margin-bottom: 20px;
  }
  .concept-card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent-deep); margin: 0 0 12px; }
  .concept-card p { font-size: 15px; color: var(--ink); margin: 0 0 12px; }
  .concept-card p:last-child { margin-bottom: 0; }
  .cta-row { margin-top: 32px; text-align: center; }
  .btn-primary {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-deep); }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 48px 0 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }
  .module-card {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
  }
  .module-card:hover { border-color: var(--accent); }
  .module-card .icon { width: 26px; height: 26px; margin-bottom: 10px; color: var(--ink); }
  .module-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .module-card h3 .chevron { font-size: 13px; color: var(--accent); }
  .module-card p.blurb { font-size: 13.5px; color: var(--muted); margin: 0; }
  .module-card .badge-soon {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 100px;
    margin-left: 8px;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 24px 40px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<nav>
  <a href="./dashboard.html" class="logotype" style="text-decoration:none; color:inherit;">Pi<span class="v-red">v</span>ot<span class="dot">.</span></a>
</nav>

<div class="wrap">
  <a class="back-link" href="./index.html">&larr; Back to all modules</a>

  <h1 id="mod-title">…</h1>
  <p class="tagline" id="mod-tagline"></p>

  <div class="concept-card">
    <h2>The idea</h2>
    <p id="mod-concept-1"></p>
    <p id="mod-concept-2"></p>
    <img id="mod-image" style="display:none; width:100%; border-radius:8px; border:1px solid var(--line); margin-top:8px;" />
  </div>

  <div class="cta-row">
    <a class="btn-primary" href="./login.html" id="mod-cta">Log in or create an account</a>
  </div>

  <p class="section-label">What's inside</p>
  <div class="grid" id="modules-grid"></div>
  <script src="modules-grid.js"></script>
  <script>renderModulesGrid("modules-grid");</script>
</div>

<footer>
  Pivot is in continuous development.
  <br><br>
  Created by DOT — non-profit, 2026.
</footer>

    exercises: {
      title: "Create exercise",
      tagline: "Build a drill by hand — court diagram, difficulty, tags — or fill it in with an AI prompt.",
      concept1: "Every coach accumulates exercises over the years — drills for dribbling, shooting, defense, game situations. Create exercise gives each one a real court diagram, a difficulty rating, categories, and age groups, so you can find the right drill in seconds instead of digging through old notes.",
      concept2: "Fill it in by hand, or copy a ready-made prompt into any AI chat, describe the drill, and paste the reply back — it fills in name, difficulty, categories, tags, objectives and description for you to review. The diagram itself always stays hand-drawn. Choose exercise by exercise whether to keep it private to your club or share it so other coaches on Pivot can use it too.",
    },
    library: {
      title: "Exercise library",
      tagline: "Browse, search, and filter every exercise — yours and whatever your club/association/community has shared.",
      concept1: "Once you've got more than a handful of exercises, finding the right one again is the real challenge. The library lets you search by name, tag, or description, and filter by difficulty, age group, category, language, favorites, or ones you've never actually used in a session.",
      concept2: "Exercises can come from your own club, from your club association, or from the whole Pivot community, each marked with its own little icon so you always know where a drill came from. Duplicate one to make it your own, or duplicate it as a translation to keep the same exercise in more than one language.",
    },
    training: {
      title: "Training builder",
      tagline: "Pull exercises into a session plan, track total time, mark attendance, print the sheet.",
      concept1: "Planning a session usually means picking exercises from memory and guessing at timing. The training builder lets you pull exercises straight from your library into a session plan, with a running total that compares against how long you actually have.",
      concept2: "You can also mark who attended, straight from your roster, so attendance history builds up automatically over a season instead of living on a paper sheet.",
    },
    match: {
      title: "Match day",
      tagline: "Lineups, starters, live stats, and a season summary per player — generated as a clean PDF.",
      concept1: "On match day, you need a call-up sheet, a way to mark starters, and a way to record what happens — points, minutes, fouls — for each player. Match day handles all three, pulling the roster in automatically so you're not retyping names.",
      concept2: "Across a season, those individual match sheets add up into a per-player summary — games played, points, minutes, fouls, and averages — useful for checking that playing time is being shared fairly, not just match by match.",
    },
    assessment: {
      title: "Player assessment",
      tagline: "Score technique, IQ, personality and attitude by criteria, with automatic sector averages and a chart.",
      concept1: "Beyond day-to-day coaching, tracking a player's development over a season (or several) needs a real framework, not just a gut feeling. This module scores 36 concrete criteria across 4 sectors — technique, basketball IQ, personality, and behaviour — each rated 0 to 5, modeled on real federation assessment sheets. A basic/advanced toggle keeps it simple for a first pass, with the more tactical criteria available when you want them.",
