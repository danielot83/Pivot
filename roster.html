<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b70; --line: #e5e5e5; --paper: #fafafa; --card: #ffffff;
    --accent: #d21414; --accent-deep: #a10f0f; --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
  h1, h2, .logotype { font-family: "Space Grotesk", "Inter", sans-serif; }
  a { color: inherit; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); }
  .nav-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .nav-btn:hover { border-color: var(--accent); }
  .back-link { display: inline-block; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; max-width: 1100px; margin: 0 auto; padding: 24px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  h1 { font-size: 22px; margin: 8px 0 4px; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }

  .msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }

  /* -------- arbre saison/équipe -------- */
  .tree-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .side-card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px; }
  .tree-card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px; }
  .tree-season { font-size: 13px; font-weight: 600; margin: 10px 0 4px; cursor: default; }
  .tree-season:first-child { margin-top: 0; }
  .tree-team { display: block; width: 100%; text-align: left; background: none; border: none; padding: 5px 8px; margin: 1px 0; border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .tree-team:hover { background: var(--paper); }
  .tree-team.active { background: var(--accent-tint); color: var(--accent-deep); font-weight: 600; }
  .tree-new, .tree-example { font-size: 12.5px; color: var(--accent-deep); background: none; border: none; cursor: pointer; padding: 6px 8px; text-align: left; width: 100%; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--accent); }
  .spacer { flex: 1; }

  /* -------- menu de columnas -------- */
  .columns-menu { position: relative; }
  .columns-panel {
    display: none; position: absolute; top: 100%; right: 0; margin-top: 6px; z-index: 5;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08); min-width: 180px;
  }
  .columns-panel.open { display: block; }
  .columns-panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; cursor: pointer; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { background: var(--paper); font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .inactive-row { opacity: 0.5; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--muted); padding: 3px 5px; }
  td.actions button:hover { color: var(--accent); }
  .empty-state { text-align: center; padding: 24px 20px; color: var(--muted); font-size: 13px; }

  /* -------- cellules éditables directement -------- */
  td.editable { cursor: text; }
  td.editable:hover { background: var(--accent-tint); }
  td.editable input, td.editable select { width: 100%; padding: 3px 5px; border: 1px solid var(--accent); border-radius: 4px; font-size: 13px; font-family: inherit; }
  td.editable input[type="checkbox"] { width: auto; }

  /* -------- photo -------- */
  .photo-thumb {
    width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); display: block;
  }
  .photo-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); }
  .license-btn { font-size: 11.5px; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; cursor: pointer; color: var(--muted); }
  .license-btn.has-file { color: var(--accent-deep); border-color: var(--accent-tint); }

  /* -------- panneau d'ajout (nouveau joueur uniquement) -------- */
  .panel { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
  .panel.open { display: block; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; }
  .panel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 720px) { .panel-grid { grid-template-columns: repeat(2, 1fr); } }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .field input, .field select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  .panel-actions { margin-top: 14px; display: flex; gap: 8px; }
</style>
</head>
<body>

<nav>
  <div class="logotype">Pi<span class="v-red">v</span>ot<span class="dot">.</span></div>
  <div class="nav-right">
    <img id="org-logo" style="height:28px; width:28px; border-radius:6px; object-fit:cover; display:none;" />
    <span id="org-name"></span>
    <select id="org-switcher" style="display:none; margin-left:6px; padding:2px 6px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; background:var(--card); color:var(--ink);"></select>
    <select id="nav-menu" class="nav-btn" style="cursor:pointer;">
      <option value="">Go to…</option>
      <option value="dashboard.html">Dashboard</option>
      <option value="roster.html" selected>Roster</option>
      <option value="assessment.html">Player assessment</option>
      <option value="play_design.html">Play design</option>
      <option value="compare.html">Statistics</option>
      <option value="match.html">Match day</option>
      <option value="exercises.html">Exercise creator</option>
      <option value="library.html">Library</option>
      <option value="training.html">Training builder</option>
      <option value="settings.html">Settings</option>
    </select>
    <button class="nav-btn" id="logout-btn">Log out</button>
  </div>
</nav>

<div class="layout">
  <div>
    <div class="tree-card">
      <h2>Seasons &amp; teams</h2>
      <div id="tree"></div>
    </div>
    <div class="side-card" id="example-data-card" style="margin-top:14px;"></div>
  </div>

  <div>
    <a class="back-link" href="./dashboard.html">&larr; Back to dashboard</a>
    <h1 style="display:flex; align-items:center; justify-content:space-between;">
      Roster
      <button id="help-btn" title="What's this module for?" style="width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; line-height:1;">?</button>
    </h1>
    <div id="help-box" style="display:none; background:var(--accent-tint); border-radius:8px; padding:12px 16px; font-size:13px; color:var(--ink); margin-bottom:12px;"></div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <p class="sub" id="current-selection" style="display:flex; align-items:center; gap:8px;">Pick a season/team on the left, or create a new one.</p>
    </div>

    <div class="msg" id="msg"></div>

    <div class="toolbar">
      <button class="btn btn-primary" id="add-btn">+ Add player</button>
      <div class="columns-menu">
        <button class="btn btn-secondary" id="columns-btn">Columns ▾</button>
        <div class="columns-panel" id="columns-panel"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-secondary" id="export-btn">Export to Excel</button>
      <button class="btn btn-secondary" id="export-pdf-btn">Export to PDF</button>
      <button class="btn btn-secondary" id="import-btn">Import from Excel</button>
      <input type="file" id="import-file-input" accept=".xlsx,.xls" style="display:none" />
    </div>

    <div class="panel" id="panel">
      <h2>Add a player</h2>
      <div class="panel-grid">
        <div class="field"><label>First name *</label><input id="f-first_name" type="text" /></div>
        <div class="field"><label>Last name *</label><input id="f-last_name" type="text" /></div>
        <div class="field"><label>Birth year</label><input id="f-birth_year" type="number" placeholder="2012" /></div>
        <div class="field"><label>Category</label><input id="f-category" type="text" placeholder="U15" /></div>
        <div class="field"><label>Jersey number</label><input id="f-jersey_number" type="text" /></div>
        <div class="field">
          <label>Gender</label>
          <select id="f-gender"><option value="">—</option><option value="Girl">Girl</option><option value="Boy">Boy</option></select>
        </div>
        <div class="field"><label>Phone</label><input id="f-phone" type="text" /></div>
        <div class="field"><label>Email</label><input id="f-email" type="email" /></div>
        <div class="field"><label>License number</label><input id="f-license" type="text" /></div>
        <div class="field"><label>AVS number</label><input id="f-avs_number" type="text" /></div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="save-btn">Save</button>
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
      </div>
    </div>

    <table id="roster-table">
      <thead><tr id="table-head"></tr></thead>
      <tbody id="players-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none">No players yet for this season/team — add the first one above.</div>
  </div>
</div>

<input type="file" id="photo-file-input" accept="image/png, image/jpeg, image/webp" style="display:none" />
<input type="file" id="license-file-input" accept="image/png, image/jpeg, image/webp" style="display:none" />

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="org-switcher.js"></script>
<script src="example-data.js"></script>
<script src="team-tree.js"></script>
<script>
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------------------------------------------------------------------
  // Colonnes possibles -- l'utilisateur choisit lesquelles voir (menu
  // "Columns"), gardé en mémoire d'une visite à l'autre via localStorage.
  // ---------------------------------------------------------------------
  const COLUMN_DEFS = [
    { key: "jersey_number", label: "#", default: true, type: "text" },
    { key: "first_name", label: "First name", default: true, type: "text" },
    { key: "last_name", label: "Last name", default: true, type: "text" },
    { key: "birth_year", label: "Birth year", default: false, type: "number" },
    { key: "category", label: "Category", default: true, type: "text" },
    { key: "gender", label: "Gender", default: false, type: "select", options: ["", "Girl", "Boy"] },
    { key: "phone", label: "Phone", default: false, type: "text" },
    { key: "email", label: "Email", default: false, type: "text" },
    { key: "license", label: "License #", default: false, type: "text" },
    { key: "avs_number", label: "AVS number", default: false, type: "text" },
    { key: "has_license", label: "Has license", default: true, type: "checkbox" },
    { key: "active", label: "Active", default: true, type: "checkbox" },
    { key: "visibility", label: "Who sees them", default: true, type: "select", options: ["team", "private"] },
  ];
  const FORM_FIELDS = ["first_name","last_name","birth_year","category","jersey_number","gender","phone","email","license","avs_number"];

  function saveDefaultCategory(season, team, category) {
    const store = JSON.parse(localStorage.getItem("pivot_roster_default_categories") || "{}");
    store[`${season}|${team}`] = category;
    localStorage.setItem("pivot_roster_default_categories", JSON.stringify(store));
  }
  function getDefaultCategory(season, team) {
    const store = JSON.parse(localStorage.getItem("pivot_roster_default_categories") || "{}");
    return store[`${season}|${team}`] || "";
  }

  function loadVisibleColumns() {
    const saved = localStorage.getItem("pivot_roster_columns");
    if (saved) { try { return JSON.parse(saved); } catch (e) {} }
    return COLUMN_DEFS.filter((c) => c.default).map((c) => c.key);
  }
  function saveVisibleColumns(keys) {
    localStorage.setItem("pivot_roster_columns", JSON.stringify(keys));
  }
  let visibleColumns = loadVisibleColumns();

  const els = {
    orgName: document.getElementById("org-name"),
    orgLogo: document.getElementById("org-logo"),
    logoutBtn: document.getElementById("logout-btn"),
    tree: document.getElementById("tree"),
    currentSelection: document.getElementById("current-selection"),
    addBtn: document.getElementById("add-btn"),
    columnsBtn: document.getElementById("columns-btn"),
    columnsPanel: document.getElementById("columns-panel"),
    panel: document.getElementById("panel"),
    saveBtn: document.getElementById("save-btn"),
    cancelBtn: document.getElementById("cancel-btn"),
    tableHead: document.getElementById("table-head"),
    body: document.getElementById("players-body"),
    emptyState: document.getElementById("empty-state"),
    msg: document.getElementById("msg"),
    photoFileInput: document.getElementById("photo-file-input"),
    licenseFileInput: document.getElementById("license-file-input"),
  };

  let currentOrgId = null;
  let myRole = null;
  const canDelete = () => myRole === "admin" || myRole === "coach";
  let currentSeason = null;
  let currentTeam = null;
  let currentTeamCategory = ""; // categoría del equipo actualmente seleccionado (U8, U10... o "" si no aplica)
  let photoUploadTargetId = null;
  let licenseUploadTargetId = null;

  function showMessage(text, type) { els.msg.textContent = text; els.msg.className = "msg " + type; }
  function clearMessage() { els.msg.className = "msg"; els.msg.textContent = ""; }

  // ---------------------------------------------------------------------
  // Menu des colonnes
  // ---------------------------------------------------------------------
  function renderColumnsMenu() {
    els.columnsPanel.innerHTML = "";
    COLUMN_DEFS.forEach((col) => {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = visibleColumns.includes(col.key);
      cb.addEventListener("change", () => {
        visibleColumns = cb.checked
          ? [...visibleColumns, col.key]
          : visibleColumns.filter((k) => k !== col.key);
        saveVisibleColumns(visibleColumns);
        renderTableHead();
        loadPlayers();
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(col.label));
      els.columnsPanel.appendChild(label);
    });
  }
  els.columnsBtn.addEventListener("click", () => els.columnsPanel.classList.toggle("open"));

  function renderTableHead() {
    els.tableHead.innerHTML = "";
    const photoTh = document.createElement("th");
    photoTh.textContent = "Photo";
    els.tableHead.appendChild(photoTh);
    COLUMN_DEFS.filter((c) => visibleColumns.includes(c.key)).forEach((c) => {
      const th = document.createElement("th");
      th.textContent = c.label;
      els.tableHead.appendChild(th);
    });
    const licenseTh = document.createElement("th");
    licenseTh.textContent = "License doc.";
    els.tableHead.appendChild(licenseTh);
    els.tableHead.appendChild(document.createElement("th"));
  }

  // ---------------------------------------------------------------------
  // Arbre saison / équipe
  // ---------------------------------------------------------------------
  async function loadTree() {
    const { data, error } = await supabaseClient
      .from("players").select("season, team, team_category").eq("organization_id", currentOrgId);
    if (error) { showMessage("Couldn't load your teams: " + (error.message || "unknown error"), "error"); console.error("loadTree error:", error); return; }
    const { data: teamRows } = await supabaseClient
      .from("teams").select("season, team, team_category").eq("organization_id", currentOrgId);

    const rows = mergeTeamRows(data, teamRows);

    els.tree.innerHTML = "";

    const newBtn = document.createElement("button");
    newBtn.className = "tree-new";
    newBtn.textContent = "+ New season/team";
    newBtn.addEventListener("click", async () => {
      const created = await promptNewTeam(supabaseClient, currentOrgId);
      if (!created) return;
      const category = prompt("Default position for new players on this team (e.g. PG) — optional, can leave blank:");
      if (category) saveDefaultCategory(created.season, created.team, category.trim());
      currentTeamCategory = created.team_category;
      selectSeasonTeam(created.season, created.team);
    });
    els.tree.appendChild(newBtn);

    renderTeamTree("tree", rows, currentSeason, currentTeam, (season, team, cat) => {
      currentTeamCategory = cat || "";
      selectSeasonTeam(season, team);
    }, (season, team) => deleteTeam(season, team));
  }

  async function deleteTeam(season, team) {
    if (!confirm(`Remove "${team}" (${season}) and all its players? This can't be undone.`)) return;
    const { error } = await supabaseClient.from("players").delete()
      .eq("organization_id", currentOrgId).eq("season", season).eq("team", team);
    if (error) { showMessage(error.message, "error"); return; }
    await supabaseClient.from("teams").delete().eq("organization_id", currentOrgId).eq("season", season).eq("team", team);
    if (season === currentSeason && team === currentTeam) { currentSeason = null; currentTeam = null; }
    showMessage(`"${team}" (${season}) removed.`, "success");
    await loadTree();
    els.body.innerHTML = "";
    els.currentSelection.textContent = "Pick a season/team on the left, or create a new one.";
  }

  function selectSeasonTeam(season, team) {
    currentSeason = season;
    currentTeam = team;
    renderCurrentSelection();
    loadTree();
    loadPlayers();
  }

  function renderCurrentSelection() {
    els.currentSelection.innerHTML = "";
    const label = document.createElement("span");
    label.textContent = `${currentTeam} — ${currentSeason}`;
    els.currentSelection.appendChild(label);
    if (currentTeamCategory) {
      const badge = document.createElement("span");
      badge.textContent = currentTeamCategory;
      badge.style.cssText = "background:var(--accent-tint); color:var(--accent-deep); font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px;";
      els.currentSelection.appendChild(badge);
    }
    const editBtn = document.createElement("button");
    editBtn.textContent = currentTeamCategory ? "✎ Edit category" : "+ Add category";
    editBtn.style.cssText = "background:none; border:none; color:var(--accent-deep); font-size:12px; cursor:pointer; padding:0;";
    editBtn.addEventListener("click", async () => {
      const next = prompt(`Team category for "${currentTeam}" (e.g. U8) — leave blank to remove it:`, currentTeamCategory || "");
      if (next === null) return;
      const { error } = await supabaseClient.from("players").update({ team_category: next.trim() || null })
        .eq("organization_id", currentOrgId).eq("season", currentSeason).eq("team", currentTeam);
      if (error) { showMessage(error.message, "error"); return; }
      currentTeamCategory = next.trim();
      renderCurrentSelection();
      await loadTree();
      showMessage("Team category updated.", "success");
    });
    els.currentSelection.appendChild(editBtn);
  }

  // ---------------------------------------------------------------------
  // Club
  // ---------------------------------------------------------------------
  async function loadMyOrganization() {
    const { data, error } = await supabaseClient
      .from("memberships").select("organization_id, role, status, organizations(name)").eq("status", "active");
    if (error || !data || data.length === 0) {
      showMessage("You're not an active member of any club yet.", "error");
      return null;
    }
    const chosen = pivotResolveActiveOrg(data);
    pivotRenderOrgSwitcher("org-switcher", data, chosen.organization_id);
    currentOrgId = chosen.organization_id;
    myRole = chosen.role;
    els.orgName.textContent = (chosen.organizations && chosen.organizations.name) || "";
    els.orgLogo.onload = () => { els.orgLogo.style.display = "inline-block"; };
    els.orgLogo.onerror = () => { els.orgLogo.style.display = "none"; };
    els.orgLogo.src = `${SUPABASE_URL}/storage/v1/object/public/logos/${currentOrgId}/logo.png?t=${Date.now()}`;
    return currentOrgId;
  }

  // ---------------------------------------------------------------------
  // Joueurs : chargement + rendu, avec édition directe dans les cellules
  // ---------------------------------------------------------------------
  async function loadPlayers() {
    if (!currentOrgId || !currentSeason || !currentTeam) return;
    const { data, error } = await supabaseClient
      .from("players").select("*")
      .eq("organization_id", currentOrgId).eq("season", currentSeason).eq("team", currentTeam)
      .order("last_name");
    if (error) { showMessage(error.message, "error"); return; }
    renderPlayers(data || []);
  }

  function renderPlayers(players) {
    els.body.innerHTML = "";
    els.emptyState.style.display = players.length === 0 ? "block" : "none";
    players.forEach((p) => els.body.appendChild(renderRow(p)));
  }

  function renderRow(p) {
    const tr = document.createElement("tr");
    if (!p.active) tr.className = "inactive-row";

    // -- photo --
    const photoTd = document.createElement("td");
    const img = document.createElement("img");
    img.className = "photo-thumb";

    img.addEventListener("click", () => { photoUploadTargetId = p.id; els.photoFileInput.click(); });
    photoTd.appendChild(img);
    tr.appendChild(photoTd);
    loadSignedPhoto("player-photos", p.id, img);

    // -- colonnes visibles, éditables directement --
    COLUMN_DEFS.filter((c) => visibleColumns.includes(c.key)).forEach((col) => {
      const td = document.createElement("td");
      td.className = "editable";
      td.textContent = formatCellValue(p[col.key], col);
      td.addEventListener("click", () => makeCellEditable(td, p, col));
      tr.appendChild(td);
    });

    // -- document de licence --
    const licenseTd = document.createElement("td");
    const licenseBtn = document.createElement("button");
    licenseBtn.className = "license-btn";
    licenseBtn.textContent = "Upload";
    // on essaie de savoir s'il y en a déjà un (juste pour l'indication visuelle)
    checkLicenseExists(p.id).then((exists) => {
      if (exists) { licenseBtn.textContent = "View / replace"; licenseBtn.classList.add("has-file"); }
    });
    licenseBtn.addEventListener("click", () => { licenseUploadTargetId = p.id; els.licenseFileInput.click(); });
    licenseTd.appendChild(licenseBtn);
    tr.appendChild(licenseTd);

    // -- actions --
    const actionsTd = document.createElement("td");
    actionsTd.className = "actions";
    if (canDelete()) {
      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", () => deletePlayer(p));
      actionsTd.appendChild(delBtn);

    tr.appendChild(actionsTd);

  function placeholderPhoto(p) {

  function formatCellValue(value, col) {
    if (col.type === "checkbox") return value ? "✓" : "";
    return value ?? "";
  }

  function makeCellEditable(td, player, col) {
    if (td.querySelector("input, select")) return; // déjà en édition
    const original = player[col.key];
    let input;
    if (col.type === "checkbox") {
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!original;
    } else if (col.type === "select") {
      input = document.createElement("select");
      col.options.forEach((opt) => {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt || "—";
        if (opt === original) o.selected = true;
        input.appendChild(o);
      });
    } else {
      input = document.createElement("input");
      input.type = col.type === "number" ? "number" : "text";
      input.value = original ?? "";
    }
    td.textContent = "";
    td.appendChild(input);
    input.focus();

    const commit = async () => {
      const newValue = col.type === "checkbox" ? input.checked : (input.value || null);
      td.textContent = formatCellValue(newValue, col);
      if (newValue !== original) {
        const { error } = await supabaseClient.from("players").update({ [col.key]: newValue }).eq("id", player.id);
        if (error) { showMessage(error.message, "error"); }
        else { player[col.key] = newValue; }
      }
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  }

  async function loadSignedPhoto(bucket, playerId, imgEl) {

    if (error || !data) { imgEl.onerror(); return; }

  function fileToResizedPngBlob(file, maxSize) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => {
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Couldn't process that image."))), "image/png");
        };
        img.onerror = () => reject(new Error("That doesn't look like a valid image."));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("Couldn't read that file."));
      reader.readAsDataURL(file);
    });
  }

  // Export PDF vectoriel (texte et lignes dessinés directement, pas une
  // image de la page) -- même esprit que les fiches de l'application de

  // -----------------------------------------------------------------------
  // Récupère le logo du club en base64, pour l'insérer dans le PDF --
  // renvoie null proprement si le club n'a pas encore de logo.
  async function loadLogoDataUrl(orgId) {
    try {
      const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/public/logos/${orgId}/logo.png`);
      if (!resp.ok) return null;
      const blob = await resp.blob();
      return await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(blob);
      });
    } catch (e) { return null; }
  }

  async function exportToPdf() {
    if (!currentSeason || !currentTeam) { showMessage("Pick a season/team first.", "error"); return; }
    const { data, error } = await supabaseClient
      .from("players").select("*")
      .eq("organization_id", currentOrgId).eq("season", currentSeason).eq("team", currentTeam)
      .order("last_name");
    if (error) { showMessage(error.message, "error"); return; }
    const players = data || [];

    const logoDataUrl = await loadLogoDataUrl(currentOrgId);
    const { jsPDF } = window.jspdf;
    // Paysage, toujours une seule page -- la taille des lignes s'adapte au
    // nombre de joueurs plutôt que de passer à une deuxième page.
    const doc = new jsPDF({ unit: "pt", format: "a4", orientation: "landscape" });
    const accent = [210, 20, 20];
    const ink = [26, 26, 26];
    const muted = [130, 130, 136];
    const pageW = 842, pageH = 595;
    const marginX = 36;
    const contentW = pageW - marginX * 2;
    let y = 40;

    if (logoDataUrl) {
      try { doc.addImage(logoDataUrl, "PNG", pageW - marginX - 36, 24, 36, 36); } catch (e) {}
    }

    doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(...ink);
    doc.text(els.orgName.textContent || "Pivot", marginX, y);
    y += 17;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.setTextColor(...muted);
    doc.text(`Roster — ${currentTeam} (${currentSeason})`, marginX, y);
    y += 8;
    doc.setDrawColor(...accent); doc.setLineWidth(1);
    doc.line(marginX, y, pageW - marginX, y);
    y += 18;

    const headerH = y;
    const footerH = 24;
    const availableH = pageH - headerH - footerH;
    const rowH = Math.max(9, Math.min(20, players.length ? availableH / (players.length + 1) : 20));
    const fontSize = Math.max(6.5, Math.min(9.5, rowH * 0.55));

    const cols = [
      { key: "jersey_number", label: "#", w: 0.05 },
      { key: "first_name", label: "First name", w: 0.16 },
      { key: "last_name", label: "Last name", w: 0.18 },
      { key: "birth_year", label: "Birth", w: 0.08 },
      { key: "category", label: "Cat.", w: 0.08 },
      { key: "gender", label: "Gender", w: 0.1 },
      { key: "phone", label: "Phone", w: 0.15 },
      { key: "has_license", label: "License", w: 0.1 },
      { key: "active", label: "Active", w: 0.1 },
    ];

    doc.setFont("helvetica", "bold"); doc.setFontSize(Math.max(7, fontSize - 0.5)); doc.setTextColor(...muted);
    let x = marginX;
    cols.forEach((c) => { doc.text(c.label.toUpperCase(), x, y); x += c.w * contentW; });
    y += rowH * 0.5;
    doc.setDrawColor(225, 225, 225); doc.setLineWidth(0.5);
    doc.line(marginX, y, pageW - marginX, y);
    y += rowH * 0.75;

    doc.setFont("helvetica", "normal"); doc.setFontSize(fontSize);
    players.forEach((p, i) => {
      if (i % 2 === 1) {
        doc.setFillColor(250, 250, 250);
        doc.rect(marginX, y - rowH * 0.7, contentW, rowH, "F");
      }
      doc.setTextColor(...ink);
      let x2 = marginX;
      cols.forEach((c) => {
        let v = p[c.key];
        if (c.key === "has_license" || c.key === "active") v = v ? "✓" : "—";
        doc.text(String(v ?? ""), x2, y);
        x2 += c.w * contentW;
      });
      y += rowH;
    });

    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text(`Generated by Pivot on ${new Date().toISOString().slice(0, 10)} — ${players.length} players`, marginX, pageH - 14);

    doc.save(`${currentTeam}_${currentSeason}_roster.pdf`);
  }

  // -----------------------------------------------------------------------
  // Import flexible : reconnaît plusieurs jeux d'en-têtes (le nôtre, en
  // anglais, mais aussi les exports français typiques d'un club/fédération
  // -- accents ignorés, casse ignorée). Gère aussi une colonne "Contacts"
  // combinée "Nom, Prénom" quand il n'y a pas de colonnes séparées.
  // -----------------------------------------------------------------------
  const HEADER_ALIASES = {
    first_name: ["first_name", "prenom", "prénom", "firstname"],
    last_name: ["last_name", "nom", "lastname", "surname"],
    combined_name: ["contacts", "nom complet", "name", "joueur", "player"],
    birth_year: ["birth_year", "annee de naissance", "année de naissance", "birth year"],
    birth_date: ["birth_date", "date de naissance", "naissance", "date of birth"],
    category: ["category", "categorie", "catégorie"],
    jersey_number: ["jersey_number", "n maillot", "numero maillot", "n° maillot", "dossard", "number"],
    gender: ["gender", "sexe", "genre"],
    phone: ["phone", "mobile", "telephone", "téléphone", "tel"],
    email: ["email", "e-mail", "e-mail parents 1", "mail", "courriel"],
    license: ["license", "licence", "n licence", "n° licence"],
    avs_number: ["avs_number", "n avs", "n° avs", "n securite sociale", "n° sécurité sociale", "ahv", "ssn", "social security"],
    has_license: ["has_license", "licencie", "licencié"],
    active: ["active", "actif"],
  };

  function normalizeHeader(h) {
    return String(h || "").toLowerCase().trim()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // enlève les accents
  }

  function buildFieldMap(headers) {
    const map = {}; // en-tête original -> champ canonique
    headers.forEach((h) => {
      const norm = normalizeHeader(h);
      for (const field in HEADER_ALIASES) {
        if (HEADER_ALIASES[field].some((alias) => normalizeHeader(alias) === norm)) {
          map[h] = field;
          break;
        }
      }
    });
    return map;
  }

  function parseGender(value) {
    const v = normalizeHeader(value);
    if (["masculin", "boy", "m", "garcon", "garçon"].includes(v)) return "Boy";
    if (["feminin", "féminin", "girl", "f", "fille"].includes(v)) return "Girl";
    return value || null;
  }

  function yearFromBirthDate(value) {
    if (!value) return null;
    // accepte "15/08/2017", "2017-08-15", ou juste "2017"
    const str = String(value).trim();
    const match = str.match(/(\d{4})(?!.*\d{4})/); // dernier groupe de 4 chiffres = l'année
    return match ? parseInt(match[1], 10) : null;
  }

  async function importFromExcel(file) {
    if (!currentSeason || !currentTeam) { showMessage("Pick a season/team first.", "error"); return; }
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rawRows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
      if (rawRows.length === 0) { showMessage("That file doesn't have any rows.", "error"); return; }

      const fieldMap = buildFieldMap(Object.keys(rawRows[0]));

      const payload = [];
      rawRows.forEach((raw) => {
        const r = {};
        for (const header in raw) {
          const field = fieldMap[header];
          if (field) r[field] = raw[header];
        }

        let first_name = r.first_name ? String(r.first_name).trim() : "";
        let last_name = r.last_name ? String(r.last_name).trim() : "";
        if ((!first_name || !last_name) && r.combined_name) {
          // format "Nom, Prénom" (ou juste "Prénom Nom" si pas de virgule)
          const combined = String(r.combined_name).trim();
          if (combined.includes(",")) {
            const [ln, fn] = combined.split(",");
            last_name = last_name || (ln || "").trim();
            first_name = first_name || (fn || "").trim();
          } else {
            const parts = combined.split(" ");
            first_name = first_name || parts.pop() || "";
            last_name = last_name || parts.join(" ");
          }
        }
        if (!first_name || !last_name) return; // ligne sans nom exploitable, ignorée

        payload.push({
          organization_id: currentOrgId, season: currentSeason, team: currentTeam, team_category: currentTeamCategory || null,
          first_name, last_name,
          birth_year: r.birth_year ? parseInt(r.birth_year, 10) : yearFromBirthDate(r.birth_date),
          category: r.category || null,
          jersey_number: r.jersey_number ? String(r.jersey_number) : null,
          gender: parseGender(r.gender),
          phone: r.phone ? String(r.phone) : null,
          email: r.email || null,
          license: r.license ? String(r.license) : null,
          avs_number: r.avs_number ? String(r.avs_number) : null,
          has_license: r.has_license === true || r.has_license === "TRUE" || r.has_license === 1,
          active: !(r.active === false || r.active === "FALSE" || r.active === 0),
        });
      });

      if (payload.length === 0) {
        showMessage("Couldn't find any usable name column — check the file has a name, or First/Last name columns.", "error");
        return;
      }
      if (!confirm(`Import ${payload.length} players into ${currentTeam} (${currentSeason})?`)) return;

      const { error } = await supabaseClient.from("players").insert(payload);
      if (error) throw error;
      showMessage(`${payload.length} players imported.`, "success");
      await loadPlayers();
      await loadTree();
    } catch (err) {
      showMessage(err.message || "Couldn't read that Excel file.", "error");
    }
  }

        <li><strong>Export to Excel</strong> — click the button, get a spreadsheet of the currently selected team, ready to send or archive.</li>
        <li><strong>Import from Excel</strong> — click the button, pick a file. It recognizes common column names automatically (English or French, a combined "Last, First" name column, full birth dates instead of just the year...). Rows without a usable name are skipped, not imported.</li>
        <li><strong>Remove a team</strong> — click the small 🗑 next to a team's name in the left list. This deletes all its players too, so it asks to confirm first.</li>
        <li><strong>Load example</strong> — top right, fills this in with a real historical roster (Chicago Bulls '95-96) so you can try everything above before you have your own data. Safe to click more than once — it replaces itself instead of duplicating.</li>
      </ul>`;
    box.style.display = "block";
  });

  document.getElementById("nav-menu").addEventListener("change", (e) => {
    if (e.target.value) window.location.href = "./" + e.target.value;
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "./login.html";
  });

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) { window.location.href = "./login.html"; return; }
    renderColumnsMenu();
    renderTableHead();
    const orgId = await loadMyOrganization();
    if (orgId) await loadTree();
  }
  init();
</script>

</body>
</html>
