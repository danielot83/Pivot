<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Training builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b70; --line: #e5e5e5; --paper: #fafafa; --card: #ffffff;
    --accent: #d21414; --accent-deep: #a10f0f; --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
  h1, h2, h3, .logotype { font-family: "Space Grotesk", "Inter", sans-serif; }
  a { color: inherit; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); }
  .nav-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .nav-btn:hover { border-color: var(--accent); }
  .back-link { display: inline-block; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; max-width: 1000px; margin: 0 auto; padding: 24px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  h1 { font-size: 22px; margin: 8px 0 4px; display:flex; align-items:center; justify-content:space-between; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
  .msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }
  .help-box { display: none; background: var(--accent-tint); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--ink); margin-bottom: 12px; }

  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .side-card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px; }
  .tree-season { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .tree-season:first-child { margin-top: 0; }
  .tree-team { display: block; width: 100%; text-align: left; background: none; border: none; padding: 5px 8px; margin: 1px 0; border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .tree-team:hover { background: var(--paper); }
  .tree-team.active { background: var(--accent-tint); color: var(--accent-deep); font-weight: 600; }
  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .item-row:hover { background: var(--paper); }
  .item-row.active { background: var(--accent-tint); color: var(--accent-deep); font-weight: 600; }
  .new-btn { font-size: 12.5px; color: var(--accent-deep); background: none; border: none; cursor: pointer; padding: 6px 8px; text-align: left; width: 100%; font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  .spacer { flex: 1; }
  .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--accent); }

  .duration-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; margin-bottom: 14px; }
  .duration-banner.over { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  .duration-banner strong { font-family: "Space Grotesk", sans-serif; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; margin-bottom: 16px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { background: var(--paper); font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  td button { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--muted); }
  td button:hover { color: var(--accent); }
  td input[type="number"] { width: 60px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; }
  .section-label { font-size: 13px; font-weight: 600; margin: 20px 0 10px; }
  .empty-state { text-align: center; padding: 24px 20px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<nav>
  <div class="logotype">Pi<span class="v-red">v</span>ot<span class="dot">.</span></div>
  <div class="nav-right">
    <img id="org-logo" style="height:28px; width:28px; border-radius:6px; object-fit:cover; display:none;" />
    <span id="org-name"></span>
    <select id="nav-menu" class="nav-btn" style="cursor:pointer;">
      <option value="">Go to…</option>
      <option value="dashboard.html">Dashboard</option>
      <option value="roster.html">Roster</option>
      <option value="assessment.html">Player assessment</option>
      <option value="play_design.html">Play design</option>
      <option value="compare.html">Compare players</option>
      <option value="match.html">Match day</option>
      <option value="exercises.html">Exercise creator</option>
      <option value="library.html">Library</option>
      <option value="training.html" selected>Training builder</option>
      <option value="settings.html">Settings</option>
    </select>
    <button class="nav-btn" id="logout-btn">Log out</button>
  </div>
</nav>

<div class="layout">
  <div>
    <div class="side-card">
      <h2>Seasons &amp; teams</h2>
      <div id="tree"></div>
    </div>
    <div class="side-card">
      <h2>Sessions</h2>
      <button class="new-btn" id="new-training-btn">+ New session</button>
      <div id="trainings-list"></div>
    </div>
  </div>

  <div>
    <a class="back-link" href="./dashboard.html">&larr; Back to dashboard</a>
    <h1>
      Training builder
      <button id="help-btn" title="How does this work?" style="width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; line-height:1;">?</button>
    </h1>
    <p class="sub" id="current-selection">Pick a season/team on the left.</p>
    <div class="help-box" id="help-box"></div>
    <div class="msg" id="msg"></div>

    <div id="training-area" style="display:none">
      <div class="toolbar">
        <div class="field"><label for="tr-title">Title</label><input id="tr-title" type="text" placeholder="e.g. Tuesday practice" /></div>
        <div class="field"><label for="tr-date">Date</label><input id="tr-date" type="date" /></div>
        <div class="field"><label for="tr-planned">Planned length (min)</label><input id="tr-planned" type="number" style="width:90px;" value="90" /></div>
        <div class="field"><label for="tr-visibility">Who can see it?</label>
          <select id="tr-visibility">
            <option value="private">🔒 Only me</option>
            <option value="team">👥 My team</option>
            <option value="association">🤝 My club association</option>
            <option value="community">🌐 Pivot Community</option>
          </select>
        </div>
      </div>

      <div class="duration-banner" id="duration-banner"></div>

      <p class="section-label">Exercises in this session</p>
      <div class="toolbar">
        <div class="field" style="flex:1; min-width:220px;">
          <label for="add-exercise-select">Add from library</label>
          <select id="add-exercise-select"><option value="">Pick an exercise…</option></select>
        </div>
        <button class="btn btn-secondary" id="add-exercise-btn">+ Add</button>
      </div>
      <table>
        <thead><tr><th>#</th><th>Exercise</th><th>Minutes</th><th></th></tr></thead>
        <tbody id="session-exercises-body"></tbody>
      </table>
      <div class="empty-state" id="session-empty">No exercises added yet.</div>

      <p class="section-label">Attendance</p>
      <table>
        <thead><tr><th>Present</th><th>Player</th></tr></thead>
        <tbody id="attendance-body"></tbody>
      </table>

      <div class="toolbar">
        <button class="btn btn-primary" id="save-training-btn">Save session</button>
        <button class="btn btn-secondary" id="export-pdf-btn">Export to PDF</button>
        <div class="spacer"></div>
        <button class="btn btn-secondary" id="delete-training-btn" style="color:#991b1b;">Delete this session</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const VISIBILITY_ICONS = { private: "🔒", team: "👥", association: "🤝", community: "🌐" };

  const els = {
    orgName: document.getElementById("org-name"),
    orgLogo: document.getElementById("org-logo"),
    logoutBtn: document.getElementById("logout-btn"),
    tree: document.getElementById("tree"),
    trainingsList: document.getElementById("trainings-list"),
    currentSelection: document.getElementById("current-selection"),
    trainingArea: document.getElementById("training-area"),
    title: document.getElementById("tr-title"),
    date: document.getElementById("tr-date"),
    planned: document.getElementById("tr-planned"),
    visibility: document.getElementById("tr-visibility"),
    durationBanner: document.getElementById("duration-banner"),
    addExerciseSelect: document.getElementById("add-exercise-select"),
    sessionBody: document.getElementById("session-exercises-body"),
    sessionEmpty: document.getElementById("session-empty"),
    attendanceBody: document.getElementById("attendance-body"),
    msg: document.getElementById("msg"),
  };

  let currentOrgId = null;
  let currentSeason = null, currentTeam = null;
  let currentTrainingId = null;
  let teamPlayers = [];
  let allExercises = [];
  let sessionExercises = []; // { exercise_id, name, duration_minutes }
  let attendance = {}; // player_id -> boolean

  function showMessage(text, type) { els.msg.textContent = text; els.msg.className = "msg " + type; }

  async function loadMyOrganization() {
    const { data, error } = await supabaseClient
      .from("memberships").select("organization_id, status, organizations(name)").eq("status", "active").limit(1);
    if (error || !data || data.length === 0) { showMessage("You're not an active member of any club yet.", "error"); return null; }
    currentOrgId = data[0].organization_id;
    els.orgName.textContent = (data[0].organizations && data[0].organizations.name) || "";
    els.orgLogo.onload = () => { els.orgLogo.style.display = "inline-block"; };
    els.orgLogo.onerror = () => { els.orgLogo.style.display = "none"; };
    els.orgLogo.src = `${SUPABASE_URL}/storage/v1/object/public/logos/${currentOrgId}/logo.png?t=${Date.now()}`;
    return currentOrgId;
  }

  async function loadExerciseOptions() {
    const { data } = await supabaseClient.from("exercises").select("id, name").order("name");
    allExercises = data || [];
    els.addExerciseSelect.innerHTML = '<option value="">Pick an exercise…</option>';
    allExercises.forEach((e) => {
      const opt = document.createElement("option");
      opt.value = e.id; opt.textContent = e.name;
      els.addExerciseSelect.appendChild(opt);
    });
  }

  async function loadTree() {
    const { data, error } = await supabaseClient.from("players").select("season, team").eq("organization_id", currentOrgId);
    if (error) { console.error(error); return; }
    const bySeasons = {};
    (data || []).forEach((r) => (bySeasons[r.season] = bySeasons[r.season] || new Set()).add(r.team));
    els.tree.innerHTML = "";
    Object.keys(bySeasons).sort().reverse().forEach((season) => {
      const seasonEl = document.createElement("div");
      seasonEl.className = "tree-season"; seasonEl.textContent = season;
      els.tree.appendChild(seasonEl);
      Array.from(bySeasons[season]).sort().forEach((team) => {
        const btn = document.createElement("button");
        btn.className = "tree-team" + (season === currentSeason && team === currentTeam ? " active" : "");
        btn.textContent = team;
        btn.addEventListener("click", () => selectSeasonTeam(season, team));
        els.tree.appendChild(btn);
      });
    });
  }

  async function selectSeasonTeam(season, team) {
    currentSeason = season; currentTeam = team;
    els.currentSelection.textContent = `${team} — ${season}`;
    els.trainingArea.style.display = "none";
    currentTrainingId = null;
    await loadTree();
    await loadTeamPlayers();
    await loadTrainingsList();
  }

  async function loadTeamPlayers() {
    const { data } = await supabaseClient
      .from("players").select("id, first_name, last_name")
      .eq("organization_id", currentOrgId).eq("season", currentSeason).eq("team", currentTeam)
      .eq("active", true).order("last_name");
    teamPlayers = data || [];
  }

  async function loadTrainingsList() {
    const { data, error } = await supabaseClient
      .from("trainings").select("id, date, title, visibility, organization_id, season, team")
      .order("date", { ascending: false });
    els.trainingsList.innerHTML = "";
    if (error) { console.error(error); return; }
    const mine = (data || []).filter((t) => t.organization_id === currentOrgId && t.season === currentSeason && t.team === currentTeam);
    const shared = (data || []).filter((t) => t.organization_id !== currentOrgId);

    mine.forEach((t) => {
      const row = document.createElement("div");
      row.className = "item-row" + (t.id === currentTrainingId ? " active" : "");
      row.textContent = `${VISIBILITY_ICONS[t.visibility || "team"] || ""} ${t.date}${t.title ? " — " + t.title : ""}`;
      row.addEventListener("click", () => openTraining(t.id));
      els.trainingsList.appendChild(row);
    });

    // Même logique que pour les matchs : le season/team d'un
    // entrenamiento partagé appartient au roster d'un autre club, on ne
    // le mélange pas dans TA sélection.
    if (shared.length > 0) {
      const header = document.createElement("div");
      header.className = "tree-season";
      header.textContent = "🌐 Shared by other clubs";
      els.trainingsList.appendChild(header);
      shared.forEach((t) => {
        const row = document.createElement("div");
        row.className = "item-row" + (t.id === currentTrainingId ? " active" : "");
        row.textContent = `${VISIBILITY_ICONS[t.visibility || "team"] || ""} ${t.date}${t.title ? " — " + t.title : ""}`;
        row.addEventListener("click", () => openTraining(t.id));
        els.trainingsList.appendChild(row);
      });
    }
  }

  function newTraining() {
    if (!currentTeam) { showMessage("Pick a season/team on the left first.", "error"); return; }
    currentTrainingId = null;
    els.title.value = ""; els.date.value = new Date().toISOString().slice(0, 10); els.planned.value = "90";
    els.visibility.value = "team";
    sessionExercises = [];
    attendance = {}; teamPlayers.forEach((p) => (attendance[p.id] = true));
    renderSessionTable(); renderAttendanceTable(); updateDurationBanner();
    els.trainingArea.style.display = "block";
    document.getElementById("delete-training-btn").style.display = "none";
    document.getElementById("save-training-btn").style.display = "inline-block";
    [els.title, els.date, els.planned, els.visibility].forEach((el) => (el.disabled = false));
  }

  async function openTraining(id) {
    const { data: training, error } = await supabaseClient.from("trainings").select("*").eq("id", id).single();
    if (error) { showMessage(error.message, "error"); return; }
    currentTrainingId = id;
    els.title.value = training.title || ""; els.date.value = training.date; els.planned.value = training.planned_minutes || 90;
    els.visibility.value = training.visibility || "team";

    const { data: exRows } = await supabaseClient
      .from("training_exercises").select("id, exercise_id, order_index, duration_minutes, exercises(name)")
      .eq("training_id", id).order("order_index");
    sessionExercises = (exRows || []).map((r) => ({ id: r.id, exercise_id: r.exercise_id, name: (r.exercises && r.exercises.name) || "(deleted exercise)", duration_minutes: r.duration_minutes }));

    const { data: attRows } = await supabaseClient.from("training_attendance").select("player_id, present").eq("training_id", id);
    attendance = {}; teamPlayers.forEach((p) => (attendance[p.id] = true));
    (attRows || []).forEach((r) => (attendance[r.player_id] = r.present));

    renderSessionTable(); renderAttendanceTable(); updateDurationBanner();
    els.trainingArea.style.display = "block";
    const owned = training.organization_id === currentOrgId;
    document.getElementById("delete-training-btn").style.display = owned ? "inline-block" : "none";
    document.getElementById("save-training-btn").style.display = owned ? "inline-block" : "none";
    [els.title, els.date, els.planned, els.visibility].forEach((el) => (el.disabled = !owned));
    if (!owned) showMessage("This session belongs to another club — you can look, but not edit or save changes.", "success");
    await loadTrainingsList();
  }

  function renderSessionTable() {
    els.sessionBody.innerHTML = "";
    els.sessionEmpty.style.display = sessionExercises.length === 0 ? "block" : "none";
    sessionExercises.forEach((se, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${i + 1}</td><td>${se.name}</td>
        <td><input type="number" value="${se.duration_minutes}" data-idx="${i}"></td>
        <td><button data-idx="${i}">Remove</button></td>
      `;
      tr.querySelector("input").addEventListener("change", (e) => {
        sessionExercises[i].duration_minutes = parseInt(e.target.value, 10) || 0;
        updateDurationBanner();
      });
      tr.querySelector("button").addEventListener("click", () => { sessionExercises.splice(i, 1); renderSessionTable(); updateDurationBanner(); });
      els.sessionBody.appendChild(tr);
    });
  }

  function renderAttendanceTable() {
    els.attendanceBody.innerHTML = "";
    teamPlayers.forEach((p) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><input type="checkbox" ${attendance[p.id] ? "checked" : ""} data-player="${p.id}"></td><td>${p.first_name} ${p.last_name}</td>`;
      tr.querySelector("input").addEventListener("change", (e) => (attendance[p.id] = e.target.checked));
      els.attendanceBody.appendChild(tr);
    });
  }

  function updateDurationBanner() {
    const total = sessionExercises.reduce((sum, se) => sum + (se.duration_minutes || 0), 0);
    const planned = parseInt(els.planned.value, 10) || 0;
    const over = total > planned;
    els.durationBanner.className = "duration-banner" + (over ? " over" : "");
    els.durationBanner.innerHTML = `<strong>${total} min</strong> planned so far, out of <strong>${planned} min</strong> total${over ? " — over the planned length" : ""}.`;
  }
  els.planned.addEventListener("input", updateDurationBanner);

  document.getElementById("add-exercise-btn").addEventListener("click", () => {
    const id = els.addExerciseSelect.value;
    if (!id) return;
    const ex = allExercises.find((e) => e.id === id);
    sessionExercises.push({ exercise_id: id, name: ex.name, duration_minutes: 10 });
    els.addExerciseSelect.value = "";
    renderSessionTable(); updateDurationBanner();
  });

  async function saveTraining() {
    if (!currentTeam) { showMessage("Pick a season/team first.", "error"); return; }
    const payload = {
      organization_id: currentOrgId, season: currentSeason, team: currentTeam,
      date: els.date.value, title: els.title.value.trim() || null,
      planned_minutes: parseInt(els.planned.value, 10) || null,
      visibility: els.visibility.value,
    };
    try {
      let trainingId = currentTrainingId;
      if (trainingId) { const { error } = await supabaseClient.from("trainings").update(payload).eq("id", trainingId); if (error) throw error; }
      else {
        const { data, error } = await supabaseClient.from("trainings").insert(payload).select("id").single();
        if (error) throw error;
        trainingId = data.id; currentTrainingId = trainingId;
      }

      await supabaseClient.from("training_exercises").delete().eq("training_id", trainingId);
      if (sessionExercises.length > 0) {
        const rows = sessionExercises.map((se, i) => ({ training_id: trainingId, exercise_id: se.exercise_id, order_index: i, duration_minutes: se.duration_minutes }));
        const { error } = await supabaseClient.from("training_exercises").insert(rows);
        if (error) throw error;
      }

      await supabaseClient.from("training_attendance").delete().eq("training_id", trainingId);
      const attRows = teamPlayers.map((p) => ({ training_id: trainingId, player_id: p.id, present: !!attendance[p.id] }));
      if (attRows.length > 0) {
        const { error } = await supabaseClient.from("training_attendance").insert(attRows);
        if (error) throw error;
      }

      showMessage("Session saved.", "success");
      await loadTrainingsList();
    } catch (err) {
      showMessage(err.message || "Couldn't save that session.", "error");
    }
  }

  async function deleteTraining() {
    if (!currentTrainingId || !confirm("Delete this session?")) return;
    const { error } = await supabaseClient.from("trainings").delete().eq("id", currentTrainingId);
    if (error) { showMessage(error.message, "error"); return; }
    els.trainingArea.style.display = "none"; currentTrainingId = null;
    await loadTrainingsList();
  }

  async function loadLogoDataUrl(orgId) {
    try {
      const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/public/logos/${orgId}/logo.png`);
      if (!resp.ok) return null;
      const blob = await resp.blob();
      return await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(blob);
      });
    } catch (e) { return null; }
  }

  async function exportToPdf() {
    const logoDataUrl = await loadLogoDataUrl(currentOrgId);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const accent = [210, 20, 20], ink = [26, 26, 26], muted = [130, 130, 136];
    const marginX = 40;
    if (logoDataUrl) { try { doc.addImage(logoDataUrl, "PNG", 480, 30, 40, 40); } catch (e) {} }
    let y = 50;
    doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(...ink);
    doc.text(els.orgName.textContent || "Pivot", marginX, y);
    y += 18;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...muted);
    doc.text(`Training — ${els.title.value || currentTeam} (${els.date.value})`, marginX, y);
    y += 10;
    doc.setDrawColor(...accent); doc.setLineWidth(1); doc.line(marginX, y, 555, y);
    y += 22;

    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...ink);
    doc.text("Exercises", marginX, y); y += 16;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    sessionExercises.forEach((se, i) => { doc.text(`${i + 1}. ${se.name} — ${se.duration_minutes} min`, marginX, y); y += 15; });
    y += 12;

    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...ink);
    doc.text("Attendance", marginX, y); y += 16;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    teamPlayers.forEach((p) => { doc.text(`${attendance[p.id] ? "✓" : "—"}  ${p.first_name} ${p.last_name}`, marginX, y); y += 14; });

    doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text(`Generated by Pivot on ${new Date().toISOString().slice(0, 10)}`, marginX, 810);
    doc.save(`${(els.title.value || currentTeam)}_${els.date.value}.pdf`);
  }

  document.getElementById("new-training-btn").addEventListener("click", newTraining);
  document.getElementById("save-training-btn").addEventListener("click", saveTraining);
  document.getElementById("delete-training-btn").addEventListener("click", deleteTraining);
  document.getElementById("export-pdf-btn").addEventListener("click", exportToPdf);

  document.getElementById("nav-menu").addEventListener("change", (e) => {
    if (e.target.value) window.location.href = "./" + e.target.value;
  });

  document.getElementById("help-btn").addEventListener("click", () => {
    const box = document.getElementById("help-box");
    if (box.style.display === "block") { box.style.display = "none"; return; }
    box.innerHTML = `
      <strong>How to use Training builder</strong>
      <ul style="margin:8px 0 0; padding-left:18px; line-height:1.7;">
        <li>Pick a season/team on the left, then "+ New session" or an existing one from the list.</li>
        <li><strong>Add from library</strong> pulls an exercise straight from Exercise library — set how many minutes it gets.</li>
        <li>The banner above the exercise list tracks your running total against the planned length, and turns red if you go over.</li>
        <li><strong>Attendance</strong> is pulled from the team's roster — untick anyone who wasn't there.</li>
        <li><strong>Export to PDF</strong> makes a clean session sheet with the exercise list and attendance.</li>
        <li><strong>Who can see it</strong> — 🔒 only you, 👥 your whole team, 🤝 your club association (needs approval), or 🌐 every club on Pivot (view only for them). The icon next to each session in the list shows its current circle.</li>
      </ul>`;
    box.style.display = "block";
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "./login.html";
  });

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) { window.location.href = "./login.html"; return; }
    const orgId = await loadMyOrganization();
    if (orgId) { await loadExerciseOptions(); await loadTree(); }
  }
  init();
</script>

</body>
</html>
