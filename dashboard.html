<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b70; --line: #e5e5e5; --paper: #fafafa; --card: #ffffff;
    --accent: #d21414; --accent-deep: #a10f0f; --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
  h1, h2, h3, .logotype { font-family: "Space Grotesk", "Inter", sans-serif; }
  a { color: inherit; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); }
  .nav-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .nav-btn:hover { border-color: var(--accent); }

  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .msg { margin-bottom: 16px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }

  .section-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 32px 0 14px; }
  .section-label:first-of-type { margin-top: 0; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 8px; }
  @media (max-width: 640px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .stat-card .num { font-size: 26px; font-weight: 700; font-family: "Space Grotesk", sans-serif; }
  .stat-card .label { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .module-card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  .module-card:hover { border-color: var(--accent); }
  .module-card .icon { width: 26px; height: 26px; margin-bottom: 10px; color: var(--ink); }
  .module-card h3 { font-size: 15px; font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between; }
  .module-card h3 .chevron { font-size: 13px; color: var(--accent); }
  .module-card p.blurb { font-size: 13.5px; color: var(--muted); margin: 0; }
  .module-card .badge-soon { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--paper); border: 1px solid var(--line); padding: 2px 8px; border-radius: 100px; margin-left: 8px; }

  .pending-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; margin-bottom: 8px; }
  .request-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 20px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  .request-row:last-child { border-bottom: none; }
  .request-info strong { display: block; }
  .request-info span { color: var(--muted); font-size: 12.5px; }
  .request-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .request-actions button { width: auto; padding: 6px 12px; font-size: 12.5px; border: none; border-radius: 6px; cursor: pointer; }
  .btn-approve { background: var(--accent); color: #fff; }
  .btn-reject { background: transparent; color: #991b1b; border: 1px solid var(--line); }
</style>
</head>
<body>

<nav>
  <div class="logotype">Pi<span class="v-red">v</span>ot<span class="dot">.</span></div>
  <div class="nav-right">
    <img id="org-logo" style="height:28px; width:28px; border-radius:6px; object-fit:cover; display:none;" />
    <span id="org-name"></span>
    <select id="nav-menu" class="nav-btn" style="cursor:pointer;">
      <option value="">Go to…</option>
      <option value="roster.html">Roster</option>
      <option value="assessment.html">Player assessment</option>
      <option value="play_design.html">Play design</option>
      <option value="compare.html">Compare players</option>
      <option value="match.html">Match day</option>
      <option value="exercises.html">Exercise creator</option>
      <option value="library.html">Library</option>
      <option value="training.html">Training builder</option>
      <option value="settings.html">Settings</option>
    </select>
    <button class="nav-btn" id="logout-btn">Log out</button>
  </div>
</nav>

<div class="wrap">
  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:20px;">
    <div>
      <h1 style="display:flex; align-items:center; gap:8px;">
        <span id="greeting">Welcome</span>
        <button id="help-btn" title="How does this work?" style="width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; line-height:1;">?</button>
      </h1>
      <p class="sub" id="club-status-text"></p>
      <div class="help-box" id="help-box" style="display:none; background:var(--accent-tint); border-radius:8px; padding:12px 16px; font-size:13px; color:var(--ink); margin-bottom:12px; max-width:520px;"></div>
    </div>
    <div style="text-align:center; flex-shrink:0;">
      <img id="org-logo-big" style="width:64px; height:64px; border-radius:10px; object-fit:cover; display:none;" />
      <div id="org-name-big" style="font-size:13px; color:var(--muted); margin-top:6px; font-weight:600; max-width:120px;"></div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div id="pending-section" style="display:none">
    <p class="section-label">Pending requests to approve</p>
    <div class="pending-card" id="pending-requests"></div>
  </div>

  <p class="section-label">Your stats at a glance</p>
  <div class="stats-row" style="grid-template-columns: repeat(3, 1fr);">
    <div class="stat-card"><div class="num" id="stat-teams">—</div><div class="label">Teams</div></div>
    <div class="stat-card"><div class="num" id="stat-players">—</div><div class="label">Players</div></div>
    <div class="stat-card"><div class="num" id="stat-assessments">—</div><div class="label">Assessments</div></div>
    <div class="stat-card"><div class="num">—</div><div class="label">Exercises</div></div>
    <div class="stat-card"><div class="num">—</div><div class="label">Notebooks</div></div>
    <div class="stat-card"><div class="num">—</div><div class="label">Play designs</div></div>
    <div class="stat-card"><div class="num">—</div><div class="label">Matches</div></div>
    <div class="stat-card"><div class="num">—</div><div class="label">Wins</div></div>
    <div class="stat-card"><div class="num">—</div><div class="label">Losses</div></div>
  </div>

  <p class="section-label">Tools</p>
  <div class="grid" id="modules-grid"></div>

  <p class="section-label">Example data (Chicago Bulls '96)</p>
  <div style="display:flex; gap:10px;">
    <button class="nav-btn" id="load-example-btn" style="text-transform:none; letter-spacing:normal; font-weight:600; font-size:13px;">Load example data</button>
    <button class="nav-btn" id="remove-example-btn" style="text-transform:none; letter-spacing:normal; font-weight:600; font-size:13px; color:#991b1b;">Remove example data</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="modules-grid.js"></script>
<script>
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const els = {
    greeting: document.getElementById("greeting"),
    orgName: document.getElementById("org-name"),
    orgLogo: document.getElementById("org-logo"),
    orgLogoBig: document.getElementById("org-logo-big"),
    orgNameBig: document.getElementById("org-name-big"),
    logoutBtn: document.getElementById("logout-btn"),
    clubStatusText: document.getElementById("club-status-text"),
    msg: document.getElementById("msg"),
    pendingSection: document.getElementById("pending-section"),
    pendingRequests: document.getElementById("pending-requests"),
    statPlayers: document.getElementById("stat-players"),
    statTeams: document.getElementById("stat-teams"),
    statAssessments: document.getElementById("stat-assessments"),
  };

  let currentOrgId = null;

  function showMessage(text, type) { els.msg.textContent = text; els.msg.className = "msg " + type; }

  // -----------------------------------------------------------------------
  // Pages réelles pour les modules déjà construits ; les autres pointent
  // encore vers la fiche explicative (module.html) en attendant.
  // -----------------------------------------------------------------------
  const REAL_PAGES = { roster: "roster.html", assessment: "assessment.html", plays: "play_design.html", match: "match.html", exercises: "exercises.html", training: "training.html" };
  function linkForModule(m) {
    return REAL_PAGES[m.key] || `module.html?m=${m.key}`;
  }

  async function loadMyOrganization(user) {
    // le nom du profil, pour dire "Welcome, Daniel" plutôt que l'email
    const { data: profile } = await supabaseClient.from("profiles").select("full_name").eq("id", user.id).maybeSingle();
    const displayName = (profile && profile.full_name) || user.email;
    els.greeting.textContent = `Welcome, ${displayName}`;

    const { data, error } = await supabaseClient
      .from("memberships")
      .select("organization_id, status, organizations(name)")
      .eq("status", "active")
      .limit(1);

    if (error) console.error("loadMyOrganization error:", error);

    if (error || !data || data.length === 0) {
      els.clubStatusText.textContent = "You're not an active member of any club or association yet.";
      showJoinPrompt();
      return null;
    }
    currentOrgId = data[0].organization_id;
    const orgName = (data[0].organizations && data[0].organizations.name) || "";
    els.orgName.textContent = orgName;
    els.clubStatusText.textContent = orgName ? `Club: ${orgName}` : "";
    loadOrgLogo(currentOrgId, orgName);
    return currentOrgId;
  }

  // Essaie de charger le logo du club -- si aucun n'a été mis en ligne,
  // l'image échoue silencieusement et reste cachée (pas d'erreur affichée).
  function loadOrgLogo(orgId, orgName) {
    const url = `${SUPABASE_URL}/storage/v1/object/public/logos/${orgId}/logo.png?t=${Date.now()}`;
    els.orgLogo.onload = () => { els.orgLogo.style.display = "inline-block"; };
    els.orgLogo.onerror = () => { els.orgLogo.style.display = "none"; };
    els.orgLogo.src = url;

    els.orgLogoBig.onload = () => { els.orgLogoBig.style.display = "inline-block"; };
    els.orgLogoBig.onerror = () => { els.orgLogoBig.style.display = "none"; };
    els.orgLogoBig.src = url;
    els.orgNameBig.textContent = orgName || "";
  }

  // -----------------------------------------------------------------------
  // Pas encore dans un club actif : proposer d'en rejoindre un directement
  // ici, plutôt que de laisser un message sans suite.
  // -----------------------------------------------------------------------
  function showJoinPrompt() {
    const wrap = document.createElement("div");
    wrap.style.marginTop = "10px";

    const openBtn = document.createElement("button");
    openBtn.className = "nav-btn";
    openBtn.textContent = "Request to join a club or association";
    wrap.appendChild(openBtn);

    openBtn.addEventListener("click", () => openJoinForm(wrap, openBtn), { once: true });
    els.clubStatusText.insertAdjacentElement("afterend", wrap);
  }

  async function openJoinForm(wrap, openBtn) {
    openBtn.style.display = "none";

    const box = document.createElement("div");
    box.className = "pending-card";
    box.style.padding = "16px 20px";
    box.style.marginTop = "8px";
    box.innerHTML = `
      <label style="display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px;">Which club or association?</label>
      <select id="join-org-select" style="width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px;"><option>Loading…</option></select>
      <button class="nav-btn" id="join-org-btn" style="width:100%;">Send request</button>
    `;
    wrap.appendChild(box);

    const select = box.querySelector("#join-org-select");
    const { data: orgs, error } = await supabaseClient.from("organizations").select("id, name").eq("is_active", true).order("name");
    if (error) console.error("showJoinPrompt error:", error);
    select.innerHTML = "";
    (orgs || []).forEach((org) => {
      const opt = document.createElement("option");
      opt.value = org.id;
      opt.textContent = org.name;
      select.appendChild(opt);
    });

    box.querySelector("#join-org-btn").addEventListener("click", async () => {
      const orgId = select.value;
      if (!orgId) return;
      try {
        const { error } = await supabaseClient.from("memberships").insert({ organization_id: orgId, role: "coach", status: "pending" });
        if (error) throw error;
        showMessage("Request sent — the admin needs to approve it.", "success");
        wrap.remove();
      } catch (err) {
        showMessage(err.message || "Couldn't send the request.", "error");
      }
    });
  }

  // -----------------------------------------------------------------------
  // Terminer une création/demande de club restée en attente (voir login.html)
  // -----------------------------------------------------------------------
  async function performClubAction(action) {
    if (action.type === "create") {
      const { error } = await supabaseClient.from("organizations").insert({ name: action.clubName });
      if (error) throw error;
      return `Club "${action.clubName}" created — you're its admin.`;
    } else {
      const { error } = await supabaseClient
        .from("memberships")
        .insert({ organization_id: action.orgId, role: action.role, status: "pending" });
      if (error) throw error;
      return "Your request to join has been sent — the admin needs to approve it.";
    }
  }

  async function completePendingClubAction() {
    const saved = localStorage.getItem("pivot_pending_club_action");
    if (!saved) return false;
    localStorage.removeItem("pivot_pending_club_action");
    try {
      showMessage(await performClubAction(JSON.parse(saved)), "success");
      return true;
    } catch (err) {
      showMessage(err.message || "Couldn't finish setting up your club.", "error");
      return false;
    }
  }

  // -----------------------------------------------------------------------
  // Demandes en attente pour les clubs que je dirige
  // -----------------------------------------------------------------------
  async function loadPendingRequestsForAdmin() {
    const { data: myAdminRows } = await supabaseClient
      .from("memberships").select("organization_id").eq("role", "admin").eq("status", "active");
    if (!myAdminRows || myAdminRows.length === 0) return;
    const myOrgIds = myAdminRows.map((r) => r.organization_id);

    const { data: requests } = await supabaseClient
      .from("memberships")
      .select("id, role, organization_id, user_id, organizations(name), profiles(full_name)")
      .eq("status", "pending")
      .in("organization_id", myOrgIds);
    if (!requests || requests.length === 0) return;

    els.pendingSection.style.display = "block";
    requests.forEach((req) => {
      const row = document.createElement("div");
      row.className = "request-row";
      const info = document.createElement("div");
      info.className = "request-info";
      const name = document.createElement("strong");
      name.textContent = (req.profiles && req.profiles.full_name) || "Someone";
      const detail = document.createElement("span");
      detail.textContent = `wants to join ${(req.organizations && req.organizations.name) || "your club"} as ${req.role}`;
      info.appendChild(name); info.appendChild(detail);

      const actions = document.createElement("div");
      actions.className = "request-actions";
      const approveBtn = document.createElement("button");
      approveBtn.className = "btn-approve"; approveBtn.textContent = "Approve";
      const rejectBtn = document.createElement("button");
      rejectBtn.className = "btn-reject"; rejectBtn.textContent = "Reject";
      approveBtn.addEventListener("click", () => respondToRequest(req.id, "active", row));
      rejectBtn.addEventListener("click", () => respondToRequest(req.id, "rejected", row));
      actions.appendChild(approveBtn); actions.appendChild(rejectBtn);
      row.appendChild(info); row.appendChild(actions);
      els.pendingRequests.appendChild(row);
    });
  }

  async function respondToRequest(id, newStatus, rowEl) {
    try {
      const { error } = await supabaseClient.from("memberships").update({ status: newStatus }).eq("id", id);
      if (error) throw error;
      rowEl.remove();
    } catch (err) {
      alert(err.message || "Couldn't update that request.");
    }
  }

  // -----------------------------------------------------------------------
  // Statistiques simples -- seuls Roster et Suivi existent vraiment pour
  // l'instant, les autres modules restent à "—" tant qu'ils n'existent pas.
  // -----------------------------------------------------------------------
  async function loadStats() {
    if (!currentOrgId) return;
    const { count: playerCount } = await supabaseClient
      .from("players").select("id", { count: "exact", head: true }).eq("organization_id", currentOrgId);
    els.statPlayers.textContent = playerCount ?? 0;

    // pas de "distinct count" tout fait côté client Supabase -- on récupère
    // juste la colonne "team" et on compte les valeurs différentes ici
    const { data: teamRows } = await supabaseClient.from("players").select("team").eq("organization_id", currentOrgId);
    els.statTeams.textContent = teamRows ? new Set(teamRows.map((r) => r.team)).size : 0;

    const { count: assessmentCount } = await supabaseClient
      .from("player_assessments").select("id", { count: "exact", head: true }).eq("organization_id", currentOrgId);
    els.statAssessments.textContent = assessmentCount ?? 0;
  }

  // -----------------------------------------------------------------------
  // Mêmes données d'exemple que dans roster.html (Bulls 95-96) -- ici,
  // en un clic, pour remplir les statistiques d'un coup sans avoir à
  // aller les charger séparément dans Roster.
  // -----------------------------------------------------------------------
  const EXAMPLE_SEASON = "1995-1996";
  const EXAMPLE_TEAM = "Chicago Bulls";
  const EXAMPLE_PLAYERS = [
    { first_name: "Michael", last_name: "Jordan", jersey_number: "23", category: "SG" },
    { first_name: "Scottie", last_name: "Pippen", jersey_number: "33", category: "SF" },
    { first_name: "Dennis", last_name: "Rodman", jersey_number: "91", category: "PF" },
    { first_name: "Ron", last_name: "Harper", jersey_number: "9", category: "PG" },
    { first_name: "Luc", last_name: "Longley", jersey_number: "13", category: "C" },
    { first_name: "Toni", last_name: "Kukoc", jersey_number: "7", category: "SF" },
    { first_name: "Steve", last_name: "Kerr", jersey_number: "25", category: "PG" },
    { first_name: "Bill", last_name: "Wennington", jersey_number: "34", category: "C" },
    { first_name: "Jud", last_name: "Buechler", jersey_number: "30", category: "SF" },
    { first_name: "Randy", last_name: "Brown", jersey_number: "1", category: "PG" },
    { first_name: "Dickey", last_name: "Simpkins", jersey_number: "8", category: "PF" },
    { first_name: "Jason", last_name: "Caffey", jersey_number: "35", category: "PF" },
    { first_name: "James", last_name: "Edwards", jersey_number: "53", category: "C" },
    { first_name: "Jack", last_name: "Haley", jersey_number: "4", category: "C" },
    { first_name: "John", last_name: "Salley", jersey_number: "22", category: "PF" },
  ].map((p) => ({ ...p, gender: "Boy", has_license: true, active: true }));

  // Même forme de critères que assessment.html (juste les décomptes, pas
  // besoin du texte complet ici) -- pour générer des notes d'exemple.
  const CRITERIA_SHAPE = {
    technique: { dribble: 4, tir: 4, passe: 3, defense: 3 },
    intelligence: { sans_ballon: 4, avec_ballon: 3, defense: 5, divers: 3 },
    personnalite: { attitude: 3 },
    comportement: { comportement: 4 },
  };
  function makeExampleRatings(center, spread) {
    const ratings = {};
    for (const sect in CRITERIA_SHAPE) {
      ratings[sect] = {};
      for (const grp in CRITERIA_SHAPE[sect]) {
        const n = CRITERIA_SHAPE[sect][grp];
        ratings[sect][grp] = Array.from({ length: n }, () => {
          const v = spread ? center + Math.round((Math.random() * 2 - 1) * spread) : center;
          return Math.max(1, Math.min(5, v));
        });
      }
    }
    return ratings;
  }
  // centre / écart par joueur -- même logique que la démo Bulls du bureau
  const ASSESSMENT_PATTERNS = { Jordan: [5, 0], Pippen: [5, 1], Rodman: [4, 1], Harper: [3, 1] };
  const DEFAULT_PATTERN = [2, 1];

  document.getElementById("load-example-btn").addEventListener("click", async () => {
    if (!currentOrgId) { showMessage("Join or create a club first.", "error"); return; }
    if (!confirm(`Add ${EXAMPLE_PLAYERS.length} example players (${EXAMPLE_TEAM}, ${EXAMPLE_SEASON}), plus a sample assessment for each, to your club?`)) return;
    try {
      // on retire d'abord toute donnée d'exemple déjà là (au cas où on a
      // déjà cliqué avant) -- comme ça, ce bouton ne peut jamais dupliquer
      const { error: cleanupError } = await supabaseClient
        .from("players").delete()
        .eq("organization_id", currentOrgId).eq("season", EXAMPLE_SEASON).eq("team", EXAMPLE_TEAM);
      if (cleanupError) throw cleanupError;

      const rows = EXAMPLE_PLAYERS.map((p) => ({ ...p, organization_id: currentOrgId, season: EXAMPLE_SEASON, team: EXAMPLE_TEAM }));
      const { data: inserted, error } = await supabaseClient.from("players").insert(rows).select("id, last_name");
      if (error) throw error;

      const assessmentRows = (inserted || []).map((p) => {
        const [center, spread] = ASSESSMENT_PATTERNS[p.last_name] || DEFAULT_PATTERN;
        return {
          organization_id: currentOrgId,
          player_id: p.id,
          date: "1996-04-21",
          location: "Chicago (United Center)",
          ratings: makeExampleRatings(center, spread),
          positive_points: "Example assessment, for demo purposes.",
        };
      });
      const { error: assessError } = await supabaseClient.from("player_assessments").insert(assessmentRows);
      if (assessError) throw assessError;

      showMessage(`${EXAMPLE_PLAYERS.length} example players and assessments added — see them in Roster and Player assessment.`, "success");
      await loadStats();
    } catch (err) {
      showMessage(err.message || "Couldn't load the example data.", "error");
    }
  });

  document.getElementById("remove-example-btn").addEventListener("click", async () => {
    if (!currentOrgId) return;
    if (!confirm(`Remove all example data (${EXAMPLE_TEAM}, ${EXAMPLE_SEASON}) from your club? Their assessments go with them.`)) return;
    try {
      // supprimer les joueurs suffit : les évaluations liées disparaissent
      // automatiquement (contrainte "on delete cascade" côté base de données)
      const { error } = await supabaseClient
        .from("players").delete()
        .eq("organization_id", currentOrgId).eq("season", EXAMPLE_SEASON).eq("team", EXAMPLE_TEAM);
      if (error) throw error;
      showMessage("Example data removed.", "success");
      await loadStats();
    } catch (err) {
      showMessage(err.message || "Couldn't remove the example data.", "error");
    }
  });

  document.getElementById("nav-menu").addEventListener("change", (e) => {
    if (e.target.value) window.location.href = "./" + e.target.value;
  });

  document.getElementById("help-btn").addEventListener("click", () => {
    const box = document.getElementById("help-box");
    if (box.style.display === "block") { box.style.display = "none"; return; }
    box.innerHTML = `
      <strong>How to use the Dashboard</strong>
      <ul style="margin:8px 0 0; padding-left:18px; line-height:1.7;">
        <li>This is your home screen — your club, your role, and quick stats about what's in Pivot so far.</li>
        <li>If you're an admin, <strong>pending requests</strong> to join your club show up here, with Approve/Reject buttons.</li>
        <li><strong>Load example data</strong> (below the tools) fills your club with a real historical roster and sample evaluations, to try everything before you have your own data. <strong>Remove example data</strong> clears it out again, cleanly.</li>
        <li>Click any tile in "Tools" to open that module, or use the "Go to…" menu at the top on any page to jump straight to another one.</li>
      </ul>`;
    box.style.display = "block";
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "./login.html";
  });

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) { window.location.href = "./login.html"; return; }

    renderModulesGrid("modules-grid", linkForModule);
    // Terminer une création/demande de club en attente AVANT de vérifier
    // si on appartient déjà à un club -- sinon on vérifie trop tôt et ça
    // affiche à tort "pas encore membre" alors que le club vient d'être créé.
    await completePendingClubAction();
    const orgId = await loadMyOrganization(data.session.user);
    if (orgId) {
      await loadPendingRequestsForAdmin();
      await loadStats();
    }
  }
  init();
</script>

</body>
</html>
