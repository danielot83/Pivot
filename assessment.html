<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Player assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b70; --line: #e5e5e5; --paper: #fafafa; --card: #ffffff;
    --accent: #d21414; --accent-deep: #a10f0f; --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
  h1, h2, h3, .logotype { font-family: "Space Grotesk", "Inter", sans-serif; }
  a { color: inherit; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); }
  .nav-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .nav-btn:hover { border-color: var(--accent); }
  .back-link { display: inline-block; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; max-width: 900px; margin: 0 auto; padding: 24px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  h1 { font-size: 22px; margin: 8px 0 4px; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }

  .msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }

  /* -------- barre latérale : arbre + critères -------- */
  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .side-card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px; }
  .tree-season { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .tree-season:first-child { margin-top: 0; }
  .tree-team-row { display: flex; align-items: center; }
  .tree-team { display: block; width: 100%; text-align: left; background: none; border: none; padding: 5px 8px; margin: 1px 0; border-radius: 6px; font-size: 13px; color: var(--ink); cursor: pointer; flex: 1; }
  .tree-team:hover { background: var(--paper); }
  .tree-team.active { background: var(--accent-tint); color: var(--accent-deep); font-weight: 600; }
  .tree-new, .tree-example { font-size: 12.5px; color: var(--accent-deep); background: none; border: none; cursor: pointer; padding: 6px 8px; text-align: left; width: 100%; }
  .toggle-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--ink); }
  .toggle-row input { width: auto; margin-top: 2px; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; min-width: 140px; }
  .spacer { flex: 1; }
  .btn { padding: 8px 15px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--accent); }

  .heights-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .heights-row .field input { min-width: 100px; }

  .sector-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin-bottom: 14px; }
  .sector-card h3 { font-size: 15px; margin: 0 0 2px; }
  .sector-card .avg { font-size: 13px; color: var(--accent-deep); font-weight: 600; margin-bottom: 12px; }
  .group-title { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; text-transform: uppercase; letter-spacing: 0.02em; }
  .criterion-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13px; }
  .criterion-row.advanced { display: none; }
  .criterion-row.advanced.show { display: flex; }
  .criterion-row select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; width: 60px; }

  .comments-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin-bottom: 16px; }
  .comments-card label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  .comments-card label:first-child { margin-top: 0; }
  .comments-card textarea { width: 100%; min-height: 50px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; }

  .history-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; }
  .history-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 18px; font-size: 13px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .history-row:last-child { border-bottom: none; }
  .history-row:hover { background: var(--paper); }
  .history-row .tot { color: var(--accent-deep); font-weight: 600; }
  .empty-state { text-align: center; padding: 24px 20px; color: var(--muted); font-size: 13px; }

  .help-box { display: none; background: var(--accent-tint); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--ink); margin-bottom: 12px; }
</style>
</head>
<body>

<nav>
  <div class="logotype">Pi<span class="v-red">v</span>ot<span class="dot">.</span></div>
  <div class="nav-right">
    <img id="org-logo" style="height:28px; width:28px; border-radius:6px; object-fit:cover; display:none;" />
    <span id="org-name"></span>
    <select id="nav-menu" class="nav-btn" style="cursor:pointer;">
      <option value="">Go to…</option>
      <option value="dashboard.html">Dashboard</option>
      <option value="roster.html">Roster</option>
      <option value="assessment.html" selected>Player assessment</option>
      <option value="settings.html">Settings</option>

    <button class="nav-btn" id="logout-btn">Log out</button>
  </div>
</nav>

<div class="layout">
  <div>
    <div class="side-card">
      <h2>Seasons &amp; teams</h2>

    </div>
    <div class="side-card">
      <h2>Criteria</h2>
      <label class="toggle-row">

        <span>Show advanced criteria too (18 more, tactical/IQ-focused)</span>
      </label>
    </div>
    <div class="side-card">
      <h2>Example data</h2>
      <button class="tree-example" id="load-bulls-btn">★ Load Chicago Bulls '96</button>
      <button class="tree-example" id="remove-bulls-btn" style="color:#991b1b;">Remove Bulls example</button>
      <button class="tree-example" id="load-celtics-btn" style="margin-top:6px;">★ Load Boston Celtics '08</button>
      <button class="tree-example" id="remove-celtics-btn" style="color:#991b1b;">Remove Celtics example</button>
    </div>
  </div>

  <div>
    <a class="back-link" href="./dashboard.html">&larr; Back to dashboard</a>
    <h1 style="display:flex; align-items:center; justify-content:space-between;">
      Player assessment
      <button id="help-btn" title="What's this module for?" style="width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; line-height:1;">?</button>
    </h1>
    <div class="help-box" id="help-box"></div>
    <p class="sub" id="current-selection">Pick a season/team on the left, or load the example.</p>

    <div class="msg" id="msg"></div>

    <div class="toolbar">
      <div class="field">
        <label for="player-select">Player</label>
        <select id="player-select"><option value="">Pick a season/team first</option></select>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="new-btn">+ New assessment</button>
    </div>

    <div id="form-area" style="display:none">
      <div class="toolbar">
        <div class="field"><label for="date">Date</label><input id="date" type="date" /></div>
        <div class="field"><label for="location">Location</label><input id="location" type="text" placeholder="Optional" /></div>
      </div>
      <div class="heights-row">
        <div class="field"><label for="height_player">Player height (cm)</label><input id="height_player" type="text" /></div>
        <div class="field"><label for="height_father">Father's height (cm)</label><input id="height_father" type="text" /></div>
        <div class="field"><label for="height_mother">Mother's height (cm)</label><input id="height_mother" type="text" /></div>
      </div>

      <div id="sectors-container"></div>

      <div class="comments-card">
        <label for="positive_points">Positive points</label>
        <textarea id="positive_points"></textarea>
        <label for="negative_points">Points to watch</label>
        <textarea id="negative_points"></textarea>
        <label for="to_improve">To work on next</label>
        <textarea id="to_improve"></textarea>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" id="save-btn">Save assessment</button>
        <button class="btn btn-secondary" id="pdf-btn">Generate PDF</button>
        <button class="btn btn-secondary" id="excel-btn">Export history to Excel</button>
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <div class="spacer"></div>
        <button class="btn btn-secondary" id="delete-btn" style="display:none">Delete</button>
      </div>
    </div>

    <h2 style="font-size:15px; margin: 24px 0 10px;">Past assessments</h2>
    <div class="history-card" id="history-card">
      <div class="empty-state" id="history-empty">Pick a player above to see their assessment history.</div>
    </div>
  </div>
</div>

  function emptyRatings() {
    const r = {};
    for (const sectKey in CRITERIA) {
      r[sectKey] = {};
      for (const grpKey in CRITERIA[sectKey].groups) {
        r[sectKey][grpKey] = CRITERIA[sectKey].groups[grpKey].items.map(() => null);
      }
    }
    return r;
  }
  function sectorAverage(ratings, sectKey) {
    let sum = 0, count = 0;
    const groups = ratings[sectKey] || {};
    for (const grpKey in groups) {
      (groups[grpKey] || []).forEach((v) => { if (v !== null && v !== undefined) { sum += v; count++; } });
    }
    return count > 0 ? sum / count : null;

  let currentOrgId = null;

  function showMessage(text, type) { els.msg.textContent = text; els.msg.className = "msg " + type; }

  // ---------------------------------------------------------------------
  // Arbre saison / équipe (même logique que roster.html)
  // ---------------------------------------------------------------------
  async function loadTree() {
    const { data, error } = await supabaseClient
      .from("players").select("season, team").eq("organization_id", currentOrgId);
    if (error) { console.error("loadTree error:", error); return; }

    const bySeasons = {};
    (data || []).forEach((r) => {
      (bySeasons[r.season] = bySeasons[r.season] || new Set()).add(r.team);
    });

    els.tree.innerHTML = "";
    Object.keys(bySeasons).sort().reverse().forEach((season) => {
      const seasonEl = document.createElement("div");
      seasonEl.className = "tree-season";
      seasonEl.textContent = season;
      els.tree.appendChild(seasonEl);
      Array.from(bySeasons[season]).sort().forEach((team) => {
        const btn = document.createElement("button");
        btn.className = "tree-team" + (season === currentSeason && team === currentTeam ? " active" : "");
        btn.textContent = team;
        btn.addEventListener("click", () => selectSeasonTeam(season, team));
        els.tree.appendChild(btn);
      });
    });
  }

  function selectSeasonTeam(season, team) {
    currentSeason = season;
    currentTeam = team;
    els.currentSelection.textContent = `${team} — ${season}`;
    els.formArea.style.display = "none";
    loadTree();
    loadPlayersIntoSelect();
  }

  // ---------------------------------------------------------------------
  // Club + logo
  // ---------------------------------------------------------------------
  async function loadMyOrganization() {
    const { data, error } = await supabaseClient
      .from("memberships").select("organization_id, status, organizations(name)").eq("status", "active").limit(1);
    if (error || !data || data.length === 0) {
      showMessage("You're not an active member of any club yet.", "error");
      return null;
    }
    currentOrgId = data[0].organization_id;
    els.orgName.textContent = (data[0].organizations && data[0].organizations.name) || "";
    els.orgLogo.onload = () => { els.orgLogo.style.display = "inline-block"; };
    els.orgLogo.onerror = () => { els.orgLogo.style.display = "none"; };
    els.orgLogo.src = `${SUPABASE_URL}/storage/v1/object/public/logos/${currentOrgId}/logo.png?t=${Date.now()}`;
    return currentOrgId;
  }

  async function loadPlayersIntoSelect() {
    els.playerSelect.innerHTML = "";
    if (!currentSeason || !currentTeam) {
      els.playerSelect.innerHTML = '<option value="">Pick a season/team first</option>';
      return;

    const { data, error } = await supabaseClient
      .from("players").select("id, first_name, last_name")
      .eq("organization_id", currentOrgId).eq("season", currentSeason).eq("team", currentTeam)
      .eq("active", true).order("last_name");
    if (error || !data || data.length === 0) {
      els.playerSelect.innerHTML = '<option value="">No players in this team yet — add some in Roster</option>';
      return;
    }
    data.forEach((p) => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.first_name} ${p.last_name}`;

    loadHistory();

  const CRITERIA_SHAPE = {

  function makeExampleRatings(center, spread) {
    const ratings = {};
    for (const sect in CRITERIA_SHAPE) {
      ratings[sect] = {};
      for (const grp in CRITERIA_SHAPE[sect]) {
        const n = CRITERIA_SHAPE[sect][grp];
        ratings[sect][grp] = Array.from({ length: n }, () => {
          const v = spread ? center + Math.round((Math.random() * 2 - 1) * spread) : center;
          return Math.max(1, Math.min(5, v));
        });
      }
    }
    return ratings;

  async function loadExampleTeam(key) {
    const ex = EXAMPLE_TEAMS[key];
    if (!currentOrgId) { showMessage("Join or create a club first.", "error"); return; }
    if (!confirm(`Load ${ex.team} (${ex.season}) with a sample assessment for each player?`)) return;
    try {
      await supabaseClient.from("players").delete()
        .eq("organization_id", currentOrgId).eq("season", ex.season).eq("team", ex.team);
      const rows = ex.players.map((p) => ({ ...p, organization_id: currentOrgId, season: ex.season, team: ex.team }));
      const { data: inserted, error } = await supabaseClient.from("players").insert(rows).select("id, last_name");
      if (error) throw error;

      const assessmentRows = (inserted || []).map((p) => {
        const [center, spread] = ex.patterns[p.last_name] || DEFAULT_PATTERN;
        return {
          organization_id: currentOrgId, player_id: p.id, date: ex.date,
          ratings: makeExampleRatings(center, spread),
          positive_points: "Example assessment, for demo purposes.",
        };
      });
      const { error: aErr } = await supabaseClient.from("player_assessments").insert(assessmentRows);
      if (aErr) throw aErr;

      selectSeasonTeam(ex.season, ex.team);
      showMessage(`${ex.players.length} example players and assessments loaded.`, "success");
    } catch (err) {
      showMessage(err.message || "Couldn't load the example data.", "error");
    }
  }

  async function removeExampleTeam(key) {
    const ex = EXAMPLE_TEAMS[key];
    if (!currentOrgId) return;
    if (!confirm(`Remove ${ex.team} (${ex.season}) and all its data? Can't be undone.`)) return;
    const { error } = await supabaseClient.from("players").delete()
      .eq("organization_id", currentOrgId).eq("season", ex.season).eq("team", ex.team);
    if (error) { showMessage(error.message, "error"); return; }
    if (currentSeason === ex.season && currentTeam === ex.team) {
      currentSeason = null; currentTeam = null;
      els.currentSelection.textContent = "Pick a season/team on the left, or load the example.";
      els.playerSelect.innerHTML = '<option value="">Pick a season/team first</option>';
    }
    showMessage(`${ex.team} removed.`, "success");
    await loadTree();
  }

  // ---------------------------------------------------------------------
  // Formulaire des critères
  // ---------------------------------------------------------------------
  function buildForm() {
    els.sectorsContainer.innerHTML = "";
    SECTOR_ORDER.forEach((sectKey) => {
      const sect = CRITERIA[sectKey];
      const card = document.createElement("div");
      card.className = "sector-card";
      card.innerHTML = `<h3>${sect.label}</h3><div class="avg" id="avg-${sectKey}">Average: —</div>`;
      Object.keys(sect.groups).forEach((grpKey) => {
        const grp = sect.groups[grpKey];
        if (grp.label) {
          const gt = document.createElement("div");
          gt.className = "group-title";
          gt.textContent = grp.label;
          card.appendChild(gt);
        }
        grp.items.forEach((item, i) => {
          const row = document.createElement("div");
          row.className = "criterion-row" + (item.basic ? "" : " advanced");
          row.innerHTML = `
            <span>${item.text}</span>
            <select data-sector="${sectKey}" data-group="${grpKey}" data-index="${i}">
              <option value="">—</option>
              <option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option><option value="5">5</option>
            </select>
          `;
          const select = row.querySelector("select");
          select.addEventListener("change", () => {
            const v = select.value ? parseInt(select.value, 10) : null;
            currentRatings[sectKey][grpKey][i] = v;
            updateAverages();
          });
          card.appendChild(row);
        });
      });
      els.sectorsContainer.appendChild(card);
    });
  }
  function updateAverages() {
    SECTOR_ORDER.forEach((sectKey) => {
      const avg = sectorAverage(currentRatings, sectKey);
      const el = document.getElementById(`avg-${sectKey}`);
      if (el) el.textContent = avg !== null ? `Average: ${avg.toFixed(1)} / 5` : "Average: —";
    });
  }
  function fillFormFromRatings() {
    document.querySelectorAll("#sectors-container select").forEach((select) => {
      const sectKey = select.dataset.sector, grpKey = select.dataset.group, i = parseInt(select.dataset.index, 10);
      const v = currentRatings[sectKey][grpKey][i];
      select.value = v === null || v === undefined ? "" : String(v);
    });
    updateAverages();
  }
  function applyAdvancedVisibility() {
    const show = els.advancedToggle.checked;
    document.querySelectorAll(".criterion-row.advanced").forEach((row) => row.classList.toggle("show", show));
  }
  els.advancedToggle.addEventListener("change", applyAdvancedVisibility);

  // ---------------------------------------------------------------------
  // Historique / sauvegarde
  // ---------------------------------------------------------------------
  async function loadHistory() {
    const playerId = els.playerSelect.value;
    els.historyCard.innerHTML = "";
    if (!playerId) { els.historyCard.appendChild(els.historyEmpty); return; }
    const { data, error } = await supabaseClient
      .from("player_assessments").select("id, date, location, ratings")
      .eq("player_id", playerId).order("date", { ascending: false });
    if (error || !data || data.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No assessments yet for this player.";
      els.historyCard.appendChild(empty);
      return;
    }
    data.forEach((row) => {
      const sectorAvgs = SECTOR_ORDER.map((s) => sectorAverage(row.ratings, s)).filter((v) => v !== null);
      const tot = sectorAvgs.length ? sectorAvgs.reduce((a, b) => a + b, 0).toFixed(1) : "—";
      const div = document.createElement("div");
      div.className = "history-row";
      div.innerHTML = `<span>${row.date}${row.location ? " — " + row.location : ""}</span><span class="tot">TOT ${tot}</span>`;
      div.addEventListener("click", () => openExisting(row.id));
      els.historyCard.appendChild(div);
    });
  }

  function openNew() {
    if (!els.playerSelect.value) { showMessage("Pick a player first.", "error"); return; }
    editingId = null;
    currentRatings = emptyRatings();
    els.date.value = new Date().toISOString().slice(0, 10);
    els.location.value = "";
    els.heightPlayer.value = ""; els.heightFather.value = ""; els.heightMother.value = "";
    els.positivePoints.value = ""; els.negativePoints.value = ""; els.toImprove.value = "";
    els.deleteBtn.style.display = "none";
    els.formArea.style.display = "block";
    fillFormFromRatings();
    applyAdvancedVisibility();
  }

  async function openExisting(id) {
    const { data, error } = await supabaseClient.from("player_assessments").select("*").eq("id", id).single();
    if (error) { showMessage(error.message, "error"); return; }
    editingId = id;
    currentRatings = data.ratings;
    els.date.value = data.date;
    els.location.value = data.location || "";
    els.heightPlayer.value = data.height_player || "";
    els.heightFather.value = data.height_father || "";
    els.heightMother.value = data.height_mother || "";
    els.positivePoints.value = data.positive_points || "";
    els.negativePoints.value = data.negative_points || "";
    els.toImprove.value = data.to_improve || "";
    els.deleteBtn.style.display = "inline-block";
    els.formArea.style.display = "block";
    fillFormFromRatings();
    applyAdvancedVisibility();
  }

  // -----------------------------------------------------------------------
  // PDF vectoriel de l'évaluation en cours à l'écran (même si elle n'est
  // pas encore sauvegardée) -- texte et graphique dessinés directement,
  // avec le même graphique en barres par secteur que sur l'app de bureau.
  // -----------------------------------------------------------------------
  // -----------------------------------------------------------------------
  // Export Excel de tout l'historique du joueur sélectionné -- une ligne
  // par évaluation, avec les moyennes par secteur et le TOT.
  // -----------------------------------------------------------------------
  async function exportHistoryToExcel() {
    const playerId = els.playerSelect.value;
    if (!playerId) { showMessage("Pick a player first.", "error"); return; }
    const playerName = els.playerSelect.options[els.playerSelect.selectedIndex].textContent;

    const { data, error } = await supabaseClient
      .from("player_assessments").select("*").eq("player_id", playerId).order("date");
    if (error) { showMessage(error.message, "error"); return; }
    if (!data || data.length === 0) { showMessage("No assessments yet for this player.", "error"); return; }

    const rows = data.map((row) => {
      const out = { date: row.date, location: row.location || "" };
      SECTOR_ORDER.forEach((s) => {
        const avg = sectorAverage(row.ratings, s);
        out[CRITERIA[s].label] = avg !== null ? Number(avg.toFixed(2)) : "";
      });
      const sectorAvgs = SECTOR_ORDER.map((s) => sectorAverage(row.ratings, s)).filter((v) => v !== null);
      out["TOT"] = sectorAvgs.length ? Number(sectorAvgs.reduce((a, b) => a + b, 0).toFixed(2)) : "";
      out["Positive points"] = row.positive_points || "";
      out["Points to watch"] = row.negative_points || "";
      out["To improve"] = row.to_improve || "";
      return out;
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Assessments");
    XLSX.writeFile(wb, `${playerName.replace(/\s+/g, "_")}_assessments.xlsx`);
  }

  async function loadLogoDataUrl(orgId) {
    try {
      const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/public/logos/${orgId}/logo.png`);
      if (!resp.ok) return null;
      const blob = await resp.blob();
      return await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(blob);
      });
    } catch (e) { return null; }
  }

  async function generatePdf() {
    const playerName = els.playerSelect.options[els.playerSelect.selectedIndex]
      ? els.playerSelect.options[els.playerSelect.selectedIndex].textContent
      : "Player";
    const logoDataUrl = await loadLogoDataUrl(currentOrgId);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const accent = [210, 20, 20];
    const ink = [26, 26, 26];
    const muted = [107, 107, 112];
    if (logoDataUrl) {
      try { doc.addImage(logoDataUrl, "PNG", 480, 30, 40, 40); } catch (e) { /* logo illisible, on continue sans */ }
    }
    const marginX = 40;
    let y = 50;

    doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(...ink);
    doc.text(els.orgName.textContent || "Pivot", marginX, y);
    y += 22;
    doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(...muted);
    doc.text(`Player assessment — ${playerName}`, marginX, y);
    y += 16;
    doc.setFontSize(10);
    doc.text(`${els.date.value || ""}${els.location.value ? " — " + els.location.value : ""}`, marginX, y);
    y += 10;
    doc.setDrawColor(...accent); doc.setLineWidth(1.2);
    doc.line(marginX, y, 555, y);
    y += 20;

    if (els.heightPlayer.value || els.heightFather.value || els.heightMother.value) {
      doc.setFontSize(9.5); doc.setTextColor(...muted);
      doc.text(
        `Height — player: ${els.heightPlayer.value || "—"} cm · father: ${els.heightFather.value || "—"} cm · mother: ${els.heightMother.value || "—"} cm`,
        marginX, y
      );
      y += 20;
    }

    // -- graphique en barres par secteur (même logique que pdf_builder_suivi.py) --
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...ink);
    doc.text("Sector averages", marginX, y);
    y += 16;
    const chartTop = y, chartHeight = 90, chartLeft = marginX + 10, chartWidth = 460;
    const barGap = 20, barWidth = (chartWidth - barGap * (SECTOR_ORDER.length - 1)) / SECTOR_ORDER.length;
    doc.setDrawColor(230, 230, 230); doc.setLineWidth(0.5);
    for (let i = 0; i <= 5; i++) {
      const gy = chartTop + chartHeight - (i / 5) * chartHeight;
      doc.line(chartLeft, gy, chartLeft + chartWidth, gy);
    }
    SECTOR_ORDER.forEach((sectKey, i) => {
      const avg = sectorAverage(currentRatings, sectKey) || 0;
      const bx = chartLeft + i * (barWidth + barGap);
      const barH = (avg / 5) * chartHeight;
      doc.setFillColor(...accent);
      doc.rect(bx, chartTop + chartHeight - barH, barWidth, barH, "F");
      doc.setFontSize(8.5); doc.setTextColor(...ink);
      doc.text(CRITERIA[sectKey].label, bx, chartTop + chartHeight + 14, { maxWidth: barWidth });
      doc.setTextColor(...accent); doc.setFont("helvetica", "bold");
      doc.text(avg ? avg.toFixed(1) : "—", bx, chartTop + chartHeight - barH - 4);
      doc.setFont("helvetica", "normal");
    });
    y = chartTop + chartHeight + 34;

    // -- remarques --
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...ink);
    [["Positive points", els.positivePoints.value], ["Points to watch", els.negativePoints.value], ["To work on next", els.toImprove.value]]
      .forEach(([label, text]) => {
        if (!text) return;
        doc.text(label, marginX, y); y += 14;
        doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...muted);
        const lines = doc.splitTextToSize(text, 480);
        doc.text(lines, marginX, y);
        y += lines.length * 12 + 12;
        doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...ink);
      });

    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...muted);
    doc.text(`Generated by Pivot on ${new Date().toISOString().slice(0, 10)}`, marginX, 810);

    doc.save(`${playerName.replace(/\s+/g, "_")}_${els.date.value || "assessment"}.pdf`);
  }

  async function saveAssessment() {
    clearMessage();
    const playerId = els.playerSelect.value;
    if (!playerId) { showMessage("Pick a player first.", "error"); return; }
    const payload = {
      organization_id: currentOrgId, player_id: playerId,
      date: els.date.value, location: els.location.value.trim() || null,
      height_player: els.heightPlayer.value.trim() || null,
      height_father: els.heightFather.value.trim() || null,
      height_mother: els.heightMother.value.trim() || null,
      ratings: currentRatings,
      positive_points: els.positivePoints.value.trim() || null,
      negative_points: els.negativePoints.value.trim() || null,
      to_improve: els.toImprove.value.trim() || null,
    };
    try {
      let error;
      if (editingId) ({ error } = await supabaseClient.from("player_assessments").update(payload).eq("id", editingId));
      else ({ error } = await supabaseClient.from("player_assessments").insert(payload));
      if (error) throw error;
      els.formArea.style.display = "none";
      await loadHistory();
      showMessage("Assessment saved.", "success");
    } catch (err) {
      showMessage(err.message || "Couldn't save that assessment.", "error");
    }
  }

  async function deleteAssessment() {
    if (!editingId || !confirm("Delete this assessment?")) return;
    const { error } = await supabaseClient.from("player_assessments").delete().eq("id", editingId);
    if (error) { showMessage(error.message, "error"); return; }
    els.formArea.style.display = "none";
    await loadHistory();
  }

  els.newBtn.addEventListener("click", openNew);
  els.cancelBtn.addEventListener("click", () => { els.formArea.style.display = "none"; });
  els.saveBtn.addEventListener("click", saveAssessment);
  document.getElementById("pdf-btn").addEventListener("click", generatePdf);
  document.getElementById("excel-btn").addEventListener("click", exportHistoryToExcel);
  els.deleteBtn.addEventListener("click", deleteAssessment);
  els.playerSelect.addEventListener("change", () => { els.formArea.style.display = "none"; loadHistory(); });

  document.getElementById("nav-menu").addEventListener("change", (e) => {
    if (e.target.value) window.location.href = "./" + e.target.value;
  });

  document.getElementById("help-btn").addEventListener("click", () => {
    const box = document.getElementById("help-box");
    if (box.style.display === "block") { box.style.display = "none"; return; }
    box.innerHTML = `
      <strong>How to use Player assessment</strong>
      <ul style="margin:8px 0 0; padding-left:18px; line-height:1.7;">
        <li><strong>Pick a season/team</strong> on the left, then a player at the top — the list updates to match.</li>
        <li><strong>Show advanced criteria</strong> (left, below the tree) reveals 18 more tactical/IQ-focused criteria on top of the 18 basic ones — leave it off for a quicker, simpler evaluation.</li>
        <li><strong>Heights</strong> (player, father, mother) are optional, used to get a feel for likely adult height.</li>
        <li><strong>Click "+ New assessment"</strong>, fill in what you can (blank stays blank, it's not forced to a random score), Save.</li>
        <li>Sector averages update live as you fill each one in.</li>
        <li><strong>Past assessments</strong> below are clickable — opens that one back up to review or edit.</li>
        <li><strong>★ Load example</strong> (left, under the tree) needs the Bulls roster to already exist — load it from Dashboard or Roster first if you haven't yet, then come back here to see sample evaluations for Jordan, Pippen, and the rest.</li>
      </ul>`;
    box.style.display = "block";
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "./login.html";
  });

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) { window.location.href = "./login.html"; return; }
    buildForm();
    const orgId = await loadMyOrganization();
    if (orgId) await loadTree();
  }
  init();
</script>
