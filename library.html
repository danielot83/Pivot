<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b70; --line: #e5e5e5; --paper: #fafafa; --card: #ffffff;
    --accent: #d21414; --accent-deep: #a10f0f; --accent-tint: #fceceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
  h1, h2, h3, .logotype { font-family: "Space Grotesk", "Inter", sans-serif; }
  a { color: inherit; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .logotype { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .logotype .v-red, .logotype .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); }
  .nav-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .nav-btn:hover { border-color: var(--accent); }
  .back-link { display: inline-block; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 240px 1fr 340px; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 24px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }

  h1 { font-size: 22px; margin: 8px 0 4px; display:flex; align-items:center; justify-content:space-between; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
  .msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }
  .help-box { display: none; background: var(--accent-tint); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--ink); margin-bottom: 12px; }

  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .side-card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; width: 100%; }
  .checkbox-field { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .checkbox-field input { width: auto; }
  .multiselect { max-height: 150px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 12px; }
  .multiselect label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 0; }
  .multiselect label input { width: auto; }
  .reset-btn { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid var(--line); background: none; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .reset-btn:hover { border-color: var(--accent); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .btn { padding: 7px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-secondary:hover { border-color: var(--accent); }

  .list-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; }
  .list-row:hover { background: var(--paper); }
  .list-row.active { background: var(--accent-tint); }
  .list-row .name { font-weight: 600; }
  .list-row .meta { font-size: 11.5px; color: var(--muted); }
  .list-row .stars { color: var(--accent); font-size: 11px; white-space: nowrap; }
  .list-row .usage { font-size: 10.5px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 100px; padding: 1px 8px; white-space: nowrap; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  .detail-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .detail-card h3 { font-size: 16px; margin: 0 0 4px; }
  .detail-card .meta-row { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .detail-card .section { margin-bottom: 12px; }
  .detail-card .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .detail-card .section p { font-size: 13px; margin: 0; white-space: pre-line; }
  .tag-chip { display: inline-block; background: var(--paper); border: 1px solid var(--line); border-radius: 100px; padding: 2px 9px; font-size: 11.5px; margin: 2px 3px 2px 0; }
</style>
</head>
<body>

<nav>
  <div class="logotype">Pi<span class="v-red">v</span>ot<span class="dot">.</span></div>
  <div class="nav-right">
    <img id="org-logo" style="height:28px; width:28px; border-radius:6px; object-fit:cover; display:none;" />
    <span id="org-name"></span>
    <select id="nav-menu" class="nav-btn" style="cursor:pointer;">
      <option value="">Go to…</option>
      <option value="dashboard.html">Dashboard</option>
      <option value="roster.html">Roster</option>
      <option value="assessment.html">Player assessment</option>
      <option value="play_design.html">Play design</option>
      <option value="compare.html">Compare players</option>
      <option value="match.html">Match day</option>
      <option value="exercises.html">Exercise creator</option>
      <option value="library.html" selected>Library</option>
      <option value="training.html">Training builder</option>
      <option value="settings.html">Settings</option>
    </select>
    <button class="nav-btn" id="logout-btn">Log out</button>
  </div>
</nav>

<div class="layout">
  <!-- Filtres -->
  <div>
    <div class="side-card">
      <h2>Search</h2>
      <div class="field"><input id="search-input" type="text" placeholder="Name, tag, description…" /></div>
    </div>
    <div class="side-card">
      <h2>Filters</h2>
      <div class="field"><label for="difficulty-filter">Difficulty</label><select id="difficulty-filter"><option value="">All</option><option value="1">★☆☆</option><option value="2">★★☆</option><option value="3">★★★</option></select></div>
      <label class="field-label" style="font-size:12px; font-weight:600; color:var(--muted);">Category</label>
      <div class="multiselect" id="category-filter"></div>
      <label class="field-label" style="font-size:12px; font-weight:600; color:var(--muted);">Age</label>
      <div class="multiselect" id="age-filter"></div>
      <div class="checkbox-field"><input type="checkbox" id="favorites-filter" /><label for="favorites-filter">Favorites only</label></div>
      <div class="checkbox-field"><input type="checkbox" id="unused-filter" /><label for="unused-filter">Never used in a session</label></div>
      <button class="reset-btn" id="reset-filters-btn">Reset filters</button>
    </div>
  </div>

  <!-- Liste -->
  <div>
    <a class="back-link" href="./dashboard.html">&larr; Back to dashboard</a>
    <h1>
      Library
      <button id="help-btn" title="How does this work?" style="width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; cursor:pointer; line-height:1;">?</button>
    </h1>
    <p class="sub" id="result-count">Loading…</p>
    <div class="msg" id="msg"></div>
    <div class="toolbar">
      <a class="btn btn-primary" href="./exercises.html" style="text-decoration:none;">+ New exercise</a>
      <button class="btn btn-secondary" id="random-btn">🎲 Pick at random</button>
    </div>
    <div class="list-card" id="list-card"></div>
    <div class="empty-state" id="list-empty" style="display:none">No exercise matches the current filters.</div>
  </div>

  <!-- Détail -->
  <div>
    <div class="detail-card" id="detail-card">
      <p class="sub" style="margin:0;">Pick an exercise from the list to see its details here.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CATEGORIES = ["Warm-up","Dribble","Shooting","Passing","Defense","1v1","2v2","Fast break","Competition","Fun"];
  const AGE_GROUPS = ["U6","U8","U10","U12","U14","U16","U18","U20","Seniors","All ages"];

  const els = {
    orgName: document.getElementById("org-name"),
    orgLogo: document.getElementById("org-logo"),
    logoutBtn: document.getElementById("logout-btn"),
    msg: document.getElementById("msg"),
    search: document.getElementById("search-input"),
    difficultyFilter: document.getElementById("difficulty-filter"),
    categoryFilter: document.getElementById("category-filter"),
    ageFilter: document.getElementById("age-filter"),
    favoritesFilter: document.getElementById("favorites-filter"),
    unusedFilter: document.getElementById("unused-filter"),
    resultCount: document.getElementById("result-count"),
    listCard: document.getElementById("list-card"),
    listEmpty: document.getElementById("list-empty"),
    detailCard: document.getElementById("detail-card"),
  };

  let currentOrgId = null;
  let allExercises = [];
  let usageCounts = {}; // exercise_id -> nombre de séances où il apparaît
  let selectedId = null;

  function showMessage(text, type) { els.msg.textContent = text; els.msg.className = "msg " + type; }

  function buildMultiselect(containerId, options) {
    const el = document.getElementById(containerId);
    el.innerHTML = "";
    options.forEach((opt) => {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" value="${opt}" /> ${opt}`;
      label.querySelector("input").addEventListener("change", refresh);
      el.appendChild(label);
    });
  }
  buildMultiselect("category-filter", CATEGORIES);
  buildMultiselect("age-filter", AGE_GROUPS);

  function checkedValues(containerId) {
    return Array.from(document.querySelectorAll(`#${containerId} input:checked`)).map((cb) => cb.value);
  }

  async function loadMyOrganization() {
    const { data, error } = await supabaseClient
      .from("memberships").select("organization_id, status, organizations(name)").eq("status", "active").limit(1);
    if (error || !data || data.length === 0) { showMessage("You're not an active member of any club yet.", "error"); return null; }
    currentOrgId = data[0].organization_id;
    els.orgName.textContent = (data[0].organizations && data[0].organizations.name) || "";
    els.orgLogo.onload = () => { els.orgLogo.style.display = "inline-block"; };
    els.orgLogo.onerror = () => { els.orgLogo.style.display = "none"; };
    els.orgLogo.src = `${SUPABASE_URL}/storage/v1/object/public/logos/${currentOrgId}/logo.png?t=${Date.now()}`;
    return currentOrgId;
  }

  // -----------------------------------------------------------------------
  // Charge les exercices (RLS renvoie déjà les siens + les partagés) et le
  // nombre de séances où chacun a servi (training_exercises), pour le
  // filtre "jamais utilisé" et le badge "Nx" dans la liste.
  // -----------------------------------------------------------------------
  async function loadExercises() {
    const { data, error } = await supabaseClient.from("exercises").select("*").order("number");
    if (error) { console.error(error); return; }
    allExercises = data || [];

    const { data: usageRows } = await supabaseClient.from("training_exercises").select("exercise_id");
    usageCounts = {};
    (usageRows || []).forEach((r) => { if (r.exercise_id) usageCounts[r.exercise_id] = (usageCounts[r.exercise_id] || 0) + 1; });

    refresh();
  }

  function refresh() {
    const text = els.search.value.toLowerCase().trim();
    const diff = els.difficultyFilter.value;
    const cats = checkedValues("category-filter");
    const ages = checkedValues("age-filter");
    const favOnly = els.favoritesFilter.checked;
    const unusedOnly = els.unusedFilter.checked;

    const filtered = allExercises.filter((e) => {
      if (text) {
        const hay = [e.number, e.name, (e.categories || []).join(" "), (e.material || []).join(" "), (e.objectives || []).join(" "), e.description, e.variants, (e.tags || []).join(" ")].join(" ").toLowerCase();
        if (!hay.includes(text)) return false;
      }
      if (favOnly && !e.favorite) return false;
      if (diff && String(e.difficulty) !== diff) return false;
      if (cats.length && !cats.some((c) => (e.categories || []).includes(c))) return false;
      if (ages.length && !ages.every((a) => (e.age || []).includes(a))) return false;
      if (unusedOnly && (usageCounts[e.id] || 0) > 0) return false;
      return true;
    });

    els.resultCount.textContent = `${filtered.length} exercise${filtered.length === 1 ? "" : "s"} found`;
    els.listCard.innerHTML = "";
    els.listEmpty.style.display = filtered.length === 0 ? "block" : "none";

    filtered.forEach((e) => {
      const row = document.createElement("div");
      row.className = "list-row" + (e.id === selectedId ? " active" : "");
      const used = usageCounts[e.id] || 0;
      const usedTxt = used === 0 ? "never used" : `${used}×`;
      row.innerHTML = `
        <div>
          <div class="name">${e.favorite ? "★ " : ""}${e.number ? e.number + ". " : ""}${e.name}</div>
          <div class="meta">${(e.categories || []).join(", ")}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <span class="stars">${"★".repeat(e.difficulty || 1)}${"☆".repeat(3 - (e.difficulty || 1))}</span>
          <span class="usage">${usedTxt}</span>
        </div>
      `;
      row.addEventListener("click", () => selectExercise(e.id));
      els.listCard.appendChild(row);
    });
    return filtered;
  }

  function selectExercise(id) {
    selectedId = id;
    refresh();
    const e = allExercises.find((ex) => ex.id === id);
    renderDetail(e);
  }

  function renderDetail(e) {
    if (!e) { els.detailCard.innerHTML = '<p class="sub" style="margin:0;">Pick an exercise from the list.</p>'; return; }
    const owned = e.organization_id === currentOrgId;
    const used = usageCounts[e.id] || 0;
    els.detailCard.innerHTML = `
      <h3>${e.favorite ? "★ " : ""}${e.name}</h3>
      <div class="meta-row">#${e.number || "—"} · ${"★".repeat(e.difficulty || 1)}${"☆".repeat(3 - (e.difficulty || 1))} · ${used === 0 ? "never used" : used + "× used"}${!owned ? " · 🌐 shared by another club" : ""}</div>
      <div class="section"><div class="section-label">Age</div><p>${(e.age || []).map((a) => `<span class="tag-chip">${a}</span>`).join("") || "—"}</p></div>
      <div class="section"><div class="section-label">Categories</div><p>${(e.categories || []).map((c) => `<span class="tag-chip">${c}</span>`).join("") || "—"}</p></div>
      <div class="section"><div class="section-label">Material</div><p>${(e.material || []).map((m) => `<span class="tag-chip">${m}</span>`).join("") || "—"}</p></div>
      <div class="section"><div class="section-label">Tags</div><p>${(e.tags || []).map((t) => `<span class="tag-chip">${t}</span>`).join("") || "—"}</p></div>
      <div class="section"><div class="section-label">Objectives</div><p>${(e.objectives || []).join("\\n") || "—"}</p></div>
      <div class="section"><div class="section-label">Description</div><p>${e.description || "—"}</p></div>
      <div class="section"><div class="section-label">Variants</div><p>${e.variants || "—"}</p></div>
      <div class="toolbar" style="margin-top:14px;">
        <a class="btn btn-primary" href="./exercises.html?id=${e.id}" style="text-decoration:none;">${owned ? "Edit" : "View"}</a>
        <button class="btn btn-secondary" id="fav-toggle-btn">${e.favorite ? "Unfavorite" : "★ Favorite"}</button>
        ${owned ? '<button class="btn btn-secondary" id="duplicate-btn">Duplicate</button>' : ""}
        ${owned ? '<button class="btn btn-secondary" id="delete-btn" style="color:#991b1b;">Delete</button>' : ""}
      </div>
    `;
    document.getElementById("fav-toggle-btn").addEventListener("click", () => toggleFavorite(e));
    if (owned) {
      document.getElementById("duplicate-btn").addEventListener("click", () => duplicateExercise(e));
      document.getElementById("delete-btn").addEventListener("click", () => deleteExercise(e));
    }
  }

  async function toggleFavorite(e) {
    const { error } = await supabaseClient.from("exercises").update({ favorite: !e.favorite }).eq("id", e.id);
    if (error) { showMessage(error.message, "error"); return; }
    await loadExercises();
    selectExercise(e.id);
  }

  async function duplicateExercise(e) {
    const nextNumber = allExercises
      .filter((ex) => ex.organization_id === currentOrgId)
      .reduce((max, ex) => Math.max(max, ex.number || 0), 0) + 1;
    const copy = { ...e, name: e.name + " (copy)", number: nextNumber, favorite: false };
    delete copy.id;
    const { error } = await supabaseClient.from("exercises").insert(copy);
    if (error) { showMessage(error.message, "error"); return; }
    showMessage("Exercise duplicated.", "success");
    await loadExercises();
  }

  async function deleteExercise(e) {
    if (!confirm(`Delete "${e.name}"?`)) return;
    const { error } = await supabaseClient.from("exercises").delete().eq("id", e.id);
    if (error) { showMessage(error.message, "error"); return; }
    selectedId = null;
    await loadExercises();
    renderDetail(null);
  }

  document.getElementById("random-btn").addEventListener("click", () => {
    const filtered = refresh();
    if (filtered.length === 0) { showMessage("No exercise matches the current filters.", "error"); return; }
    const pick = filtered[Math.floor(Math.random() * filtered.length)];
    selectExercise(pick.id);
  });

  document.getElementById("reset-filters-btn").addEventListener("click", () => {
    els.search.value = ""; els.difficultyFilter.value = "";
    els.favoritesFilter.checked = false; els.unusedFilter.checked = false;
    document.querySelectorAll("#category-filter input, #age-filter input").forEach((cb) => (cb.checked = false));
    refresh();
  });

  [els.search, els.difficultyFilter, els.favoritesFilter, els.unusedFilter].forEach((el) => {
    el.addEventListener("input", refresh);
    el.addEventListener("change", refresh);
  });

  document.getElementById("nav-menu").addEventListener("change", (e) => {
    if (e.target.value) window.location.href = "./" + e.target.value;
  });

  document.getElementById("help-btn").addEventListener("click", () => {
    const box = document.getElementById("help-box");
    els.detailCard.insertAdjacentElement; // no-op, garde la structure
    if (!document.getElementById("help-box-inline")) {
      const inline = document.createElement("div");
      inline.id = "help-box-inline";
      inline.className = "help-box";
      inline.style.display = "block";
      inline.innerHTML = `
        <strong>How to use Library</strong>
        <ul style="margin:8px 0 0; padding-left:18px; line-height:1.7;">
          <li><strong>Search</strong> looks across name, tags, description, variants, objectives, and material.</li>
          <li><strong>Category / Age</strong> — tick several to combine them (age requires ALL ticked ages to match; category matches ANY ticked one).</li>
          <li><strong>Never used</strong> — hides any exercise already pulled into a training session, to help you rediscover ones you haven't tried.</li>
          <li><strong>🎲 Pick at random</strong> — picks one exercise among whatever the current filters show.</li>
          <li>Exercises from other clubs (🌐) can be viewed but not edited or deleted — only their owner can.</li>
        </ul>`;
      document.querySelector(".sub").insertAdjacentElement("afterend", inline);
    } else {
      document.getElementById("help-box-inline").remove();
    }
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "./login.html";
  });

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) { window.location.href = "./login.html"; return; }
    const orgId = await loadMyOrganization();
    if (orgId) await loadExercises();
  }
  init();
</script>

</body>
</html>
