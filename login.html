<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Log in</title>
<!--
  Step 3: login/signup, NOTHING ELSE for now (on purpose, to keep this
  as a piece we can finish and test in one sitting).

  This file is self-contained: no need to install Node.js, npm, or
  anything else to try it -- double-click it, or open it in a browser,
  and it already talks for real to your Supabase project.

  To try it: open this file in Chrome/Firefox/Safari. Create an account
  with your email, check your inbox for the confirmation Supabase sends
  automatically, click the link, come back here and log in.
-->
<style>
  /* Minimalist style, ChemCalc/shadcn-ui inspired: lots of white,
     little color, thin borders, no gradients or heavy shadows. */
  :root {
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
    --accent: #1e5c38; /* club color -- easy to change here */
    --accent-hover: #164a2c;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  button.secondary:hover { background: #f3f4f6; }
  button:disabled { opacity: 0.6; cursor: default; }
  .toggle {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .toggle a:hover { text-decoration: underline; }
  .msg {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }
  #logged-in { display: none; text-align: center; }
  #logged-in p { color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <!-- screen: logged out -->
  <div id="auth-screen">
    <h1 id="form-title">Log in</h1>
    <p class="sub" id="form-sub">Access your Pivot workspace.</p>

    <div id="name-field" style="display:none">
      <label for="full_name">Full name</label>
      <input id="full_name" type="text" placeholder="Your name" />
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" />

    <button id="submit-btn">Log in</button>

    <div class="toggle">
      <span id="toggle-text">Don't have an account yet?</span>
      <a id="toggle-link">Create one</a>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <!-- screen: logged in -->
  <div id="logged-in">
    <h1>You're in!</h1>
    <p id="welcome-text"></p>
    <button class="secondary" id="logout-btn">Log out</button>
  </div>
</div>

<!-- Official Supabase client, loaded from their CDN -- nothing to
     install for this first test. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // -----------------------------------------------------------------------
  // Connection to YOUR real Supabase project (project ref: eeucbnhqsnfitzwzghtg)
  // -----------------------------------------------------------------------
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = "login"; // or "signup"

  const els = {
    title: document.getElementById("form-title"),
    sub: document.getElementById("form-sub"),
    nameField: document.getElementById("name-field"),
    fullName: document.getElementById("full_name"),
    email: document.getElementById("email"),
    password: document.getElementById("password"),
    submitBtn: document.getElementById("submit-btn"),
    toggleText: document.getElementById("toggle-text"),
    toggleLink: document.getElementById("toggle-link"),
    msg: document.getElementById("msg"),
    authScreen: document.getElementById("auth-screen"),
    loggedIn: document.getElementById("logged-in"),
    welcomeText: document.getElementById("welcome-text"),
    logoutBtn: document.getElementById("logout-btn"),
  };

  function showMessage(text, type) {
    els.msg.textContent = text;
    els.msg.className = "msg " + type;
  }

  function clearMessage() {
    els.msg.className = "msg";
    els.msg.textContent = "";
  }

  function setMode(newMode) {
    mode = newMode;
    clearMessage();
    if (mode === "login") {
      els.title.textContent = "Log in";
      els.sub.textContent = "Access your Pivot workspace.";
      els.nameField.style.display = "none";
      els.submitBtn.textContent = "Log in";
      els.toggleText.textContent = "Don't have an account yet?";
      els.toggleLink.textContent = "Create one";
    } else {
      els.title.textContent = "Create an account";
      els.sub.textContent = "Your account, then you can create or join a club.";
      els.nameField.style.display = "block";
      els.submitBtn.textContent = "Create my account";
      els.toggleText.textContent = "Already have an account?";
      els.toggleLink.textContent = "Log in";
    }
  }

  els.toggleLink.addEventListener("click", () => setMode(mode === "login" ? "signup" : "login"));

  async function showLoggedInState(user) {
    els.authScreen.style.display = "none";
    els.loggedIn.style.display = "block";
    els.welcomeText.textContent = `Logged in as ${user.email}.`;
  }

  els.submitBtn.addEventListener("click", async () => {
    clearMessage();
    const email = els.email.value.trim();
    const password = els.password.value;

    if (!email || !password) {
      showMessage("Email and password are required.", "error");
      return;
    }

    els.submitBtn.disabled = true;
    try {
      if (mode === "signup") {
        const full_name = els.fullName.value.trim();
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name } },
        });
        if (error) throw error;
        if (data.session) {
          // some Supabase projects log the user in immediately without an
          // email confirmation step, depending on the project's settings
          showLoggedInState(data.user);
        } else {
          showMessage(
            "Account created! Check your inbox to confirm your email, then come back to log in.",
            "success"
          );
          setMode("login");
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        showLoggedInState(data.user);
      }
    } catch (err) {
      showMessage(err.message || "Something went wrong.", "error");
    } finally {
      els.submitBtn.disabled = false;
    }
  });

  els.logoutBtn.addEventListener("click", async () => {
    await supabase.auth.signOut();
    els.loggedIn.style.display = "none";
    els.authScreen.style.display = "block";
    els.email.value = "";
    els.password.value = "";
    setMode("login");
  });

  // If already logged in (session remembered by the browser), skip
  // straight to the "logged in" screen when the page loads.
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) showLoggedInState(data.session.user);
  });
</script>

</body>
</html>
