<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot — Log in</title>
<!--
  Step 3: login/signup, NOTHING ELSE for now (on purpose, to keep this
  as a piece we can finish and test in one sitting).

  This file is self-contained: no need to install Node.js, npm, or
  anything else to try it -- double-click it, or open it in a browser,
  and it already talks for real to your Supabase project.

  To try it: open this file in Chrome/Firefox/Safari. Create an account
  with your email, check your inbox for the confirmation Supabase sends
  automatically, click the link, come back here and log in.
-->
<style>
  /* Minimalist style, ChemCalc/shadcn-ui inspired: lots of white,
     little color, thin borders, no gradients or heavy shadows. */
  :root {
    --border: #e5e5e5;
    --text: #1a1a1a;
    --text-muted: #6b6b70;
    --accent: #d21414; /* couleur réelle de la marque Pivot -- voir icons/pivot_logo.png */
    --accent-hover: #a10f0f;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    background: #fff;
  }
  select:focus { border-color: var(--accent); }
  .radio-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
    margin-bottom: 12px;
  }
  .radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 400;
    cursor: pointer;
  }
  .radio-option input { width: auto; }
  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin: 6px 0 0;
  }
  #pending-requests { text-align: left; margin-top: 18px; }
  #pending-requests h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 8px;
  }
  .request-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .request-row:last-child { border-bottom: none; }
  .request-info strong { display: block; }
  .request-info span { color: var(--text-muted); font-size: 12.5px; }
  .request-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .request-actions button {
    width: auto;
    margin-top: 0;
    padding: 6px 12px;
    font-size: 12.5px;
  }
  .btn-approve { background: var(--accent); }
  .btn-reject { background: transparent; color: #991b1b; border: 1px solid var(--border); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  button.secondary:hover { background: #f3f4f6; }
  button:disabled { opacity: 0.6; cursor: default; }
  .toggle {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .toggle a:hover { text-decoration: underline; }
  .msg {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .msg.error { background: #fef2f2; color: #991b1b; display: block; }
  .msg.success { background: #f0fdf4; color: #166534; display: block; }
  #logged-in { display: none; text-align: center; }
  #logged-in p { color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <!-- screen: logged out -->
  <div id="auth-screen">
    <h1 id="form-title">Log in</h1>
    <p class="sub" id="form-sub">Access your Pivot workspace.</p>

    <div id="name-field" style="display:none">
      <label for="full_name">Full name</label>
      <input id="full_name" type="text" placeholder="Your name" />
    </div>

    <div id="club-choice-field" style="display:none">
      <label>Your club or association</label>
      <div class="radio-row">
        <label class="radio-option"><input type="radio" name="club_mode" value="create" checked /> Create a new club or association</label>
        <label class="radio-option"><input type="radio" name="club_mode" value="join" /> Join an existing one</label>
      </div>

      <div id="create-club-field">
        <label for="club_name">Club or association name</label>
        <input id="club_name" type="text" placeholder="e.g. DEL Basket" />
        <p class="hint">You'll be its admin — you'll be able to approve others who want to join.</p>
      </div>

      <div id="join-club-field" style="display:none">
        <label for="join_org">Which one?</label>
        <select id="join_org"></select>
        <label for="join_role">Your role there</label>
        <select id="join_role">
          <option value="coach">Coach</option>
          <option value="assistant">Assistant coach</option>
          <option value="viewer">Viewer (players/parents)</option>
        </select>
        <p class="hint">The admin will need to approve your request before you get access.</p>
      </div>
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" />

    <button id="submit-btn">Log in</button>

    <div class="toggle">
      <span id="toggle-text">Don't have an account yet?</span>
      <a id="toggle-link">Create one</a>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>

<!-- Official Supabase client, loaded from their CDN -- nothing to
     install for this first test. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // -----------------------------------------------------------------------
  // Connection to YOUR real Supabase project (project ref: eeucbnhqsnfitzwzghtg)
  // -----------------------------------------------------------------------
  const SUPABASE_URL = "https://eeucbnhqsnfitzwzghtg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldWNibmhxc25maXR6d3pnaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE4NzMsImV4cCI6MjEwMDk2Nzg3M30.AHdw810kcl7CvdV5YhhEbcWfZssuSkp2r-BWnV16L6M";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = "login"; // or "signup"

  const els = {
    title: document.getElementById("form-title"),
    sub: document.getElementById("form-sub"),
    nameField: document.getElementById("name-field"),
    fullName: document.getElementById("full_name"),
    clubChoiceField: document.getElementById("club-choice-field"),
    createClubField: document.getElementById("create-club-field"),
    joinClubField: document.getElementById("join-club-field"),
    clubName: document.getElementById("club_name"),
    joinOrg: document.getElementById("join_org"),
    joinRole: document.getElementById("join_role"),
    email: document.getElementById("email"),
    password: document.getElementById("password"),
    submitBtn: document.getElementById("submit-btn"),
    toggleText: document.getElementById("toggle-text"),
    toggleLink: document.getElementById("toggle-link"),
    msg: document.getElementById("msg"),
    authScreen: document.getElementById("auth-screen"),
  };

  function showMessage(text, type) {
    els.msg.textContent = text;
    els.msg.className = "msg " + type;
  }

  function clearMessage() {
    els.msg.className = "msg";
    els.msg.textContent = "";
  }

  function setMode(newMode) {
    mode = newMode;
    clearMessage();
    if (mode === "login") {
      els.title.textContent = "Log in";
      els.sub.textContent = "Access your Pivot workspace.";
      els.nameField.style.display = "none";
      els.clubChoiceField.style.display = "none";
      els.submitBtn.textContent = "Log in";
      els.toggleText.textContent = "Don't have an account yet?";
      els.toggleLink.textContent = "Create one";
    } else {
      els.title.textContent = "Create an account";
      els.sub.textContent = "Your account, then create your own club/association or join one that's already on Pivot.";
      els.nameField.style.display = "block";
      els.clubChoiceField.style.display = "block";
      els.submitBtn.textContent = "Create my account";
      els.toggleText.textContent = "Already have an account?";
      els.toggleLink.textContent = "Log in";
      loadJoinableOrgs();
    }
  }

  // -----------------------------------------------------------------------
  // Choix "créer un club" / "rejoindre un club existant"
  // -----------------------------------------------------------------------
  document.querySelectorAll('input[name="club_mode"]').forEach((radio) => {
    radio.addEventListener("change", () => {
      const isJoin = document.querySelector('input[name="club_mode"]:checked').value === "join";
      els.createClubField.style.display = isJoin ? "none" : "block";
      els.joinClubField.style.display = isJoin ? "block" : "none";
    });
  });

  async function loadJoinableOrgs() {
    els.joinOrg.innerHTML = "<option>Loading…</option>";
    try {
      const { data, error } = await supabaseClient
        .from("organizations")
        .select("id, name")
        .eq("is_active", true)
        .order("name");
      if (error) throw error;
      els.joinOrg.innerHTML = "";
      if (!data || data.length === 0) {
        els.joinOrg.innerHTML = "<option value=''>None yet — create the first one!</option>";
        return;
      }
      data.forEach((org) => {
        const opt = document.createElement("option");
        opt.value = org.id;
        opt.textContent = org.name;
        els.joinOrg.appendChild(opt);
      });
    } catch (err) {
      els.joinOrg.innerHTML = "<option value=''>Couldn't load the list</option>";
    }
  }

  els.toggleLink.addEventListener("click", () => setMode(mode === "login" ? "signup" : "login"));

  // Une fois connecté, tout le reste (compléter la création/demande de
  // club en attente, voir les demandes à approuver, la grille de modules,
  // les statistiques) vit dans dashboard.html -- pas ici. login.html ne
  // s'occupe que de la connexion elle-même.
  function showLoggedInState() {
    window.location.href = "./dashboard.html";
  }

  els.submitBtn.addEventListener("click", async () => {
    clearMessage();
    const email = els.email.value.trim();
    const password = els.password.value;

    if (!email || !password) {
      showMessage("Email and password are required.", "error");
      return;
    }

    els.submitBtn.disabled = true;
    try {
      if (mode === "signup") {
        const full_name = els.fullName.value.trim();
        const clubAction = readClubActionFromForm();
        if (!clubAction) {
          showMessage("Tell us the name, or pick one to join.", "error");
          els.submitBtn.disabled = false;
          return;
        }
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { full_name } },
        });
        if (error) throw error;
        // on garde toujours l'action de côté de la même façon, que la
        // session soit immédiate ou non -- un seul chemin de code, plus
        // simple à suivre et moins risqué qu'avoir deux mécanismes différents
        localStorage.setItem("pivot_pending_club_action", JSON.stringify(clubAction));
        if (data.session) {
          // some Supabase projects log the user in immediately without an
          // email confirmation step, depending on the project's settings
          await showLoggedInState(data.user);
        } else {
          // pas encore de session tant que l'e-mail n'est pas confirmé --
          // switchMode d'abord (il efface le message en changeant d'écran),
          // ENSUITE afficher le message de succès -- sinon il serait
          // effacé aussitôt affiché.
          setMode("login");
          showMessage(
            "Account created! Check your inbox to confirm your email, then come back to log in.",
            "success"
          );
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await showLoggedInState(data.user);
      }
    } catch (err) {
      showMessage(err.message || "Something went wrong.", "error");
    } finally {
      els.submitBtn.disabled = false;
    }
  });

  // If already logged in (session remembered by the browser), skip
  // straight to the "logged in" screen when the page loads.
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) showLoggedInState(data.session.user);
  });
</script>

</body>
</html>
