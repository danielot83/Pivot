name: Deploy to Infomaniak

# Se ejecuta solo -- cada vez que llega un cambio a la rama principal
on:
  push:
    branches: [main]
  workflow_dispatch:  # tambien puedes lanzarlo a mano desde la pestaña "Actions" de GitHub

jobs:
  ftp-deploy:
    name: Subir por FTP a Infomaniak
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Subir todo por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFOMANIAK_FTP_SERVER }}
          username: ${{ secrets.INFOMANIAK_FTP_USERNAME }}
          password: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          # No hace falta subir la carpeta de migraciones SQL (no es
          # parte de la web publica), ni los archivos internos de git
          exclude: |
            **/.git*
            **/.git*/**
            **/database/**
            **/.github/**
